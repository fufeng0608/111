  html, body {
    margin: 0; height: 100%; background: #030209; overflow: hidden;

    -webkit-user-select: none; user-select: none;

<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rint = (a, b) => Math.floor(rnd(a, b + 1));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const hyp = Math.hypot;

  const FONT = '"PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
  const font = (size, weight) => (weight || 600) + ' ' + size + 'px ' + FONT;

  const COL = {
    cyan: '#6ff6ff',
    pink: '#ff5f8f',
    gold: '#ffd166',
    violet: '#c78bff',
    white: '#eef7ff',
    mint: '#7dffb3',
    rose: '#ff9ad5',
    orange: '#ff9a3c'
  };

  let W = 1, H = 1, DPR = 1;
  let bgGrad = null, vignette = null;
  let bgCanvas = null, vigCanvas = null;
  let glowMul = 1;            // 性能不足时自动关闭辉光
  let perfAcc = 0, perfN = 0, perfSlow = 0; // 帧时间采样
  let stars = [];

  // ---------------------------------------------------------------- audio
  let actx = null;
  let hitGate = 0;

  function audioInit() {
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      if (BGM.wanted && !BGM.timer) bgmStart();
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) {
      actx = null;
    }
    if (actx && BGM.wanted && !BGM.timer) bgmStart();
  }

  // 动态音高：连击越高越亮，慢动作时整体降调
  function audioPitch() {
    let pm = 1 + Math.min(0.28, (S.combo || 0) * 0.012);
    if (S.slowT > 0) pm *= 0.62;
    return pm;
  }

  // 空间音效：按声源与玩家的横向偏差计算声像
  function panFor(x) {
    if (x === undefined || x === null || !player) return 0;
    return clamp((x - player.x) / Math.max(200, W * 0.5), -0.85, 0.85);
  }

  function tone(freq, freq2, dur, type, vol, when, pan, noPitch) {
    if (!actx || S.muted) return;
    vol *= settings.masterVol * settings.sfxVol;
    if (vol < 0.001) return;
    const pm = noPitch ? 1 : audioPitch();
    const f1 = freq * pm;
    const f2 = freq2 ? Math.max(30, freq2 * pm) : 0;
    const t0 = actx.currentTime + (when || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    if (pan && Math.abs(pan) > 0.03 && actx.createStereoPanner) {
      const pn = actx.createStereoPanner();
      pn.pan.value = clamp(pan, -1, 1);
      g.connect(pn);
      pn.connect(actx.destination);
    } else {
      g.connect(actx.destination);
    }
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  function hitSoundOk() {
    const t = performance.now();
    if (t - hitGate < 45) return false;
    hitGate = t;
    return true;
  }

  // 多目标同时死亡时只保留一记击杀音，避免音频节点瞬间堆积
  let killGate = 0;
  function killSoundOk() {
    const t = performance.now();
    if (t - killGate < 40) return false;
    killGate = t;
    return true;
  }

  // Boss 多段命中时限制粒子发射频率
  let bossFxGate = 0;
  function bossFxOk() {
    const t = performance.now();
    if (t - bossFxGate < 38) return false;
    bossFxGate = t;
    return true;
  }

  // 集束雷/分裂弹会在一帧里引爆多次，爆炸音效同样需要限流
  let boomGate = 0;
  function boomSoundOk() {
    const t = performance.now();
    if (t - boomGate < 55) return false;
    boomGate = t;
    return true;
  }

  // 暴击飘字限流，避免高射速下满屏“暴击”
  let critTextAt = 0;
  function critTextOk() {
    const t = performance.now();
    if (t - critTextAt < 220) return false;
    critTextAt = t;
    return true;
  }

  const SFX = {
    shoot() { tone(900, 430, 0.06, 'square', 0.016); },
    hit(x) { tone(320, 170, 0.05, 'triangle', 0.028, 0, panFor(x)); },
    kill(x) { tone(230, 65, 0.17, 'sawtooth', 0.045, 0, panFor(x)); },
    hurt() { tone(190, 50, 0.34, 'sawtooth', 0.085); },
    dash() { tone(480, 1150, 0.12, 'sine', 0.04); },
    pickup(x) { tone(700, 1100, 0.09, 'sine', 0.045, 0, panFor(x)); tone(1150, 1500, 0.11, 'sine', 0.035, 0.07, panFor(x)); },
    wave() { tone(300, 600, 0.22, 'sine', 0.05); tone(460, 920, 0.28, 'sine', 0.045, 0.12); },
    die() { tone(420, 30, 0.85, 'sawtooth', 0.09, 0, 0, true); },
    split() { tone(520, 260, 0.12, 'square', 0.03); },
    boom(x) { tone(120, 40, 0.3, 'sawtooth', 0.065, 0, panFor(x)); },
    boss() { tone(90, 38, 1.2, 'sawtooth', 0.09); tone(180, 60, 1.0, 'square', 0.05, 0.1); },
    start() { tone(420, 840, 0.14, 'triangle', 0.05); tone(640, 1280, 0.2, 'triangle', 0.04, 0.1); },
    blink(x) { tone(760, 300, 0.12, 'sine', 0.035, 0, panFor(x)); },
    shield(x) { tone(620, 980, 0.12, 'triangle', 0.04, 0, panFor(x)); },
    hover() { tone(1180, 1320, 0.05, 'sine', 0.018, 0, 0, true); },
    confirm() { tone(880, 1560, 0.12, 'triangle', 0.05); tone(1320, 1980, 0.16, 'sine', 0.035, 0.06); },
    perfect() { tone(1320, 1980, 0.14, 'sine', 0.05); tone(1980, 2640, 0.18, 'sine', 0.03, 0.05); },
    evolve() { tone(520, 1040, 0.22, 'triangle', 0.06); tone(780, 1560, 0.26, 'sine', 0.045, 0.1); },

    heartbeat() { tone(62, 38, 0.18, 'sine', 0.10, 0, 0, true); tone(54, 34, 0.2, 'sine', 0.07, 0.19, 0, true); },
    skill(id) {
      if (id === 'warrior') {
        tone(180, 60, 0.3, 'sawtooth', 0.09);
        tone(90, 45, 0.4, 'sine', 0.08, 0.05);
      } else if (id === 'ranger') {
        tone(520, 1200, 0.16, 'triangle', 0.06);
        tone(780, 1560, 0.2, 'sine', 0.045, 0.06);
      } else {
        tone(660, 1320, 0.25, 'sine', 0.07);
        tone(990, 1980, 0.3, 'sine', 0.05, 0.08);
      }
    },
    achievement() {
      // tone 的第 6 参数是相对偏移秒，三连音依次上行
      tone(880, 880, 0.08, 'sine', 0.12);
      tone(1100, 1100, 0.12, 'sine', 0.10, 0.08);
      tone(1320, 1320, 0.18, 'sine', 0.10, 0.16);
    },
    levelUp() {
      tone(620, 930, 0.14, 'triangle', 0.06);
      tone(930, 1240, 0.18, 'triangle', 0.05, 0.09);
      tone(1240, 1550, 0.22, 'sine', 0.045, 0.18);
    },
    skillPick() {
      tone(880, 1320, 0.16, 'triangle', 0.05);
    },
    ult(id) {
      tone(140, 38, 0.5, 'sawtooth', 0.085);
      tone(320, 960, 0.28, 'triangle', 0.05, 0.04);
      if (id === 'frost') tone(1200, 600, 0.3, 'sine', 0.04, 0.1);
    }
  };

  // ---------------------------------------------------------------- 程序化 BGM
  // 前瞻调度：每 100ms 只补未来 0.28s 的音符，避免每帧创建音频节点
  const BGM = {
    wanted: false, boss: false, step: 0, next: 0,
    timer: null, gain: null, noise: null
  };
  const BGM_NOTES = [0, 0, 7, 0, 3, 0, 5, 7, 0, 0, 10, 0, 7, 5, 3, 7];

  function bgmEnsure() {
    if (!actx) return false;
    if (!BGM.gain) {
      BGM.gain = actx.createGain();
      BGM.gain.gain.value = 0;
      BGM.gain.connect(actx.destination);
    }
    if (!BGM.noise) {
      const len = Math.floor(actx.sampleRate * 0.16);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
      BGM.noise = buf;
    }
    return true;
  }

  function bgmLevel() {
    if (S.muted) return 0;
    const base = settings.masterVol * settings.musicVol * 0.5;
    const duck = S.mode === 'playing' ? 1 : 0.55;
    return clamp(base * duck, 0, 0.6);
  }

  function bgmKick(t) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g);
    g.connect(BGM.gain);
    o.start(t);
    o.stop(t + 0.22);
  }

  function bgmHat(t, vol) {
    const s = actx.createBufferSource();
    s.buffer = BGM.noise;
    const f = actx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 6200;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f);
    f.connect(g);
    g.connect(BGM.gain);
    s.start(t);
    s.stop(t + 0.06);
  }

  function bgmSnare(t) {
    const s = actx.createBufferSource();
    s.buffer = BGM.noise;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1800;
    f.Q.value = 0.8;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.20, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    s.connect(f);
    f.connect(g);
    g.connect(BGM.gain);
    s.start(t);
    s.stop(t + 0.13);
  }

  function bgmBass(t, freq, dur, vol) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(BGM.gain);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function bgmStep(step, t) {
    const boss = BGM.boss;
    const root = boss ? 49 : 55;

    if (step % 4 === 0) bgmKick(t);
    if (step % 2 === 1 || (boss && step % 4 === 2)) bgmHat(t, boss ? 0.14 : 0.10);
    if (boss && (step === 4 || step === 12)) bgmSnare(t);

    if (step % 2 === 0) {
      const n = BGM_NOTES[step];
      bgmBass(t, root * Math.pow(2, n / 12), boss ? 0.16 : 0.2, boss ? 0.22 : 0.18);
    }
  }

  function bgmTick() {
    if (!BGM.wanted || !actx || !BGM.gain) return;
    const lvl = bgmLevel();
    BGM.gain.gain.setTargetAtTime(lvl, actx.currentTime, 0.12);
    if (actx.state !== 'running') return;
    // 静音时不创建任何节点
    if (lvl <= 0.001) {
      BGM.next = actx.currentTime + 0.06;
      return;
    }

    const stepDur = (BGM.boss ? 60 / 132 : 60 / 100) / 4;
    if (BGM.next < actx.currentTime) BGM.next = actx.currentTime + 0.05;

    let guard = 0;
    while (BGM.next < actx.currentTime + 0.28 && guard++ < 12) {
      bgmStep(BGM.step, BGM.next);
      BGM.step = (BGM.step + 1) % 16;
      BGM.next += stepDur;
    }
  }

  function bgmStart() {
    BGM.wanted = true;
    if (!bgmEnsure()) return;
    if (BGM.timer) return;
    BGM.next = actx.currentTime + 0.08;
    BGM.step = 0;
    BGM.timer = setInterval(bgmTick, 100);
  }

  function bgmStop() {
    BGM.wanted = false;
    if (BGM.timer) {
      clearInterval(BGM.timer);
      BGM.timer = null;
    }
    if (BGM.gain && actx) BGM.gain.gain.setTargetAtTime(0, actx.currentTime, 0.1);
  }

  // ---------------------------------------------------------------- state
  const S = {
    mode: 'title',
    t: 0,
    score: 0,
    best: loadBest(),
    newBest: false,
    wave: 1,
    waveT: 0,
    elapsed: 0,

    banner: '',
    bannerT: 0,
    deadT: 0,

    pendingBursts: [],
    sessionAch: {},

    tutorialStep: -1,

    homeIndex: 0,

    skills: {},

    skillOrder: [],

    bladeT: 0,

    perfectCount: 0,
    level: 1,

    xpNeed: 5,
    skillChoices: [],
    skillSelected: 0,
    skillT: 0,
    // 技能弹窗动画状态：in 入场 / idle 待选 / confirm 确认中
    skillAnim: 'in',
    skillConfirmI: -1,
    skillConfirmT: 0,
    skillHover: -1,

    xpSweepT: 0,
    levelFlashT: 0,

    skillSelectKind: 'level',
    bossSkills: {},

  };

  function loadBest() {
    try { return parseInt(localStorage.getItem('neon-ring-best') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem('neon-ring-best', String(S.best)); }
    catch (e) { /* file:// 下可能被禁用，忽略 */ }
  }

  const bullets = [];
  const enemies = [];
  const ebullets = [];
  const parts = [];
  const picks = [];
  const texts = [];
  const rings = [];
  const bolts = [];

  const keys = new Set();
  const mouse = { x: 1, y: 1, known: false };
  // 触屏：ax/ay 是虚拟摇杆的锚点，x/y 是手指位置；id 用于多指时只认第一根手指
  const touch = { on: false, x: 0, y: 0, ax: 0, ay: 0, id: null };
  const coarse = (() => {
    try { return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); }
    catch (e) { return false; }
  })();
  let touchMode = coarse;

  const ENEMY = {
    chaser: { r: 13, hp: 1, speed: 108, score: 10, color: COL.cyan },
    dasher: { r: 11, hp: 1, speed: 62, score: 16, color: COL.gold },

    summoner: { r: 19, hp: 8, speed: 26, score: 72, color: '#9dff9d' }

  // 普通技能池：原有 10 个 + 新增 9 个；灼烧作为隐藏前置，不进普通池
  const SKILL_POOL = [
    { id: 'homing', name: '追踪弹', desc: '子弹自动追踪敌人；每级提升转向速度与索敌范围', icon: '🎯', rarity: 'rare', maxLevel: 3 },
    { id: 'split', name: '分裂弹', desc: '命中后分裂成碎片；等级越高碎片越多', icon: '✳', rarity: 'common', maxLevel: 3 },

  // 保底进化：7 次技能选择后仍凑不齐任何进化时，补 1 级最缺的前置并强推一张进化卡
  function pityEvoPick() {
    if (S.pityEvoUsed || S.skillPicks < 7) return null;
    let best = null;
    let bestKey = null;
    let bestMissing = 999;
    for (let i = 0; i < EVOLUTIONS.length; i++) {
      const e = EVOLUTIONS[i];
      if (evolved(e.id)) continue;
      let missing = 0;
      let key = null;
      let keyLack = 0;
      for (const k in e.need) {
        const lack = e.need[k] - skillLv(k);
        if (lack > 0) {
          const def = skillDef(k);
          if (!def || skillLv(k) >= def.maxLevel) { missing = 999; break; }
          missing += lack;
          if (!key || lack > keyLack) { key = k; keyLack = lack; }
        }
      }
      if (missing > 0 && missing < bestMissing) {
        bestMissing = missing;
        best = e;
        bestKey = key;
      }
    }
    if (!best || !bestKey) return null;

    // 只补 1 级，之后照常走技能等级判定
    S.skills[bestKey] = skillLv(bestKey) + 1;
    if (S.skillOrder.indexOf(bestKey) < 0) S.skillOrder.push(bestKey);
    S.pityBump = bestKey;
    S.pityEvoUsed = true;
    updateHudOrder();
    return best;
  }

  // HUD 九格排序：进化优先 → 等级高优先 → 同等级按获得顺序
  function updateHudOrder() {
    const list = [];
    for (let i = 0; i < S.skillOrder.length; i++) {
      const id = S.skillOrder[i];
      const ev = evoDef(id);
      if (ev) {
        list.push({ id: id, evo: true, lv: 1, ord: i, def: ev });
        continue;
      }
      const def = skillDef(id);
      const lv = skillLv(id);
      if (def && lv > 0) list.push({ id: id, evo: false, lv: lv, ord: i, def: def });
    }
    list.sort(function (a, b) {
      if (a.evo !== b.evo) return a.evo ? -1 : 1;
      if (a.lv !== b.lv) return b.lv - a.lv;
      return a.ord - b.ord;
    });
    S.hudOrder = list;
  }

  function makeBg() {
    bgCanvas = null;
    vigCanvas = null;

    // 有 DOM 时把渐变预渲染成位图，每帧只 blit 一次
    if (document.createElement) {
      bgCanvas = document.createElement('canvas');
      bgCanvas.width = Math.round(W);
      bgCanvas.height = Math.round(H);
      const b = bgCanvas.getContext('2d');
      const g1 = b.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
      g1.addColorStop(0, '#111038');
      g1.addColorStop(0.55, '#080617');
      g1.addColorStop(1, '#030209');
      b.fillStyle = g1;
      b.fillRect(0, 0, W, H);

      vigCanvas = document.createElement('canvas');
      vigCanvas.width = Math.round(W);
      vigCanvas.height = Math.round(H);
      const v = vigCanvas.getContext('2d');
      const g2 = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.8);
      g2.addColorStop(0, 'rgba(0,0,0,0)');
      g2.addColorStop(1, 'rgba(0,0,0,0.72)');
      v.fillStyle = g2;
      v.fillRect(0, 0, W, H);
      return;
    }

    bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
    bgGrad.addColorStop(0, '#111038');
    bgGrad.addColorStop(0.55, '#080617');
    bgGrad.addColorStop(1, '#030209');

    vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.8);

  }

      if (S.skillAnim === 'confirm') return;

      const cols = skillSelectLayout().cols;

        const i = parseInt(k, 10) - 1;
        if (i < S.skillChoices.length) { S.skillFocusKey = true; pickSkill(i); }
      } else if (k === 'arrowleft' || k === 'a') {
        S.skillSelected = (S.skillSelected + nSel - 1) % nSel;
        S.skillFocusKey = true;
      } else if (k === 'arrowright' || k === 'd') {
        S.skillSelected = (S.skillSelected + 1) % nSel;
        S.skillFocusKey = true;
      } else if (k === 'arrowup' || k === 'w') {
        S.skillSelected = (S.skillSelected + nSel - cols) % nSel;
        S.skillFocusKey = true;
      } else if (k === 'arrowdown' || k === 's') {
        S.skillSelected = (S.skillSelected + cols) % nSel;
        S.skillFocusKey = true;
      } else if (k === 'enter' || k === ' ') {
        S.skillFocusKey = true;
        pickSkill(S.skillSelected);
      }
      return;
    }
    if (k === 'o' && S.mode === 'paused') { S.settingsOpen = true; return; }
    if (S.mode === 'title' && S.tutorialStep >= 0 && k === ' ') {
      advanceTutorial();
      return;
    }
    if (S.mode === 'title' && S.achOpen) {
      if (k === 'escape' || k === 'a') S.achOpen = false;
      return;
    }
    if (S.mode === 'title' && S.helpOpen) {
      if (k === 'escape' || k === 'h') S.helpOpen = false;
      return;
    }
    if (S.mode === 'title') {
      if (k === 'arrowup' || k === 'w') {
        S.homeIndex = (S.homeIndex + HOME_ITEMS.length - 1) % HOME_ITEMS.length;
        return;
      }
      if (k === 'arrowdown' || k === 's') {
        S.homeIndex = (S.homeIndex + 1) % HOME_ITEMS.length;
        return;
      }
      if (k === 'enter' || k === ' ') {
        activateHome();
        return;
      }
      return;
    }
    if (S.mode === 'select') {
      if (k >= '1' && k <= '3') { selectCharacter(parseInt(k, 10) - 1); return; }
      if (k === 'enter' || k === ' ') { startGame(); return; }
      if (k === 'escape') { S.mode = 'title'; clearFieldEntities(); return; }
      return;
    }
    if (k === 'e' && S.mode === 'playing') { useSkill(); return; }
    if (k === 'c' && S.mode === 'dead' && S.deadT > 0.5) { openSelect(); return; }
    if (k === 'q' && S.mode === 'playing') { useBossSkill(); return; }

    if (k === ' ') {
      if (S.mode === 'title') openSelect();
      else if (S.mode === 'dead' && S.deadT > 0.5) startGame();
      else if (S.mode === 'paused') togglePause();
      else if (S.mode === 'playing') dash();

    if (k === 'm') S.muted = !S.muted;

        S.skillPress = i;
        S.skillFocusKey = false;
      }
      return;
    }
    // 设置面板优先吃掉所有指针事件，避免误触摇杆 / 开局 / 再来一局
    if (S.settingsOpen) {
      const hit = settingsSliderAt(px, py);
      if (hit) {
        S.draggingSlider = hit.id;
        updateSliderFromPointer(hit.id, px);
        return;
      }
      const q = settingsQualityBtnAt(px, py);
      if (q) { setQuality(q); return; }
      if (settingsBackBtnAt(px, py)) {
        S.settingsOpen = false;
        saveSettings();
      }
      return;
    }

    // 死亡结算卡按钮必须先于「再来一局」判定
    if (S.mode === 'dead' && S.deadT > 0.5 && changeCharAt(px, py)) {
      openSelect();
      return;
    }
    if (S.mode === 'dead' && S.deadT > 0.5 && deathCardButtonAt(px, py)) {
      exportDeathCard();
      return;
    }

    if (S.mode === 'title' && S.tutorialStep >= 0) {
      handleTutorialClick(px, py);
      return;
    }
    if (S.mode === 'title' && S.achOpen) {
      const L = achPanelLayout();
      const c = L.close;
      const outside = px < L.px || px > L.px + L.pw || py < L.py || py > L.py + L.ph;
      if (outside || (px >= c.x - 8 && px <= c.x + c.w + 8 && py >= c.y - 8 && py <= c.y + c.h + 8)) {
        S.achOpen = false;
      }
      return;
    }
    if (S.mode === 'title' && S.helpOpen) {
      const L = helpPanelLayout();
      const c = L.close;
      const outside = px < L.px || px > L.px + L.pw || py < L.py || py > L.py + L.ph;
      if (outside || (px >= c.x - 8 && px <= c.x + c.w + 8 && py >= c.y - 8 && py <= c.y + c.h + 8)) {
        S.helpOpen = false;
      }
      return;
    }
    if (S.mode === 'title') {
      handleHomeClick(px, py);
      return;
    }
    if (S.mode === 'select') {
      handleSelectClick(px, py);
      return;
    }

    if (e.pointerType === 'touch') {
      touchMode = true;
      if (S.mode === 'title') { openSelect(); return; }
      if (S.mode === 'dead') { if (S.deadT > 0.5) startGame(); return; }
      if (S.mode === 'paused') {
        if (pauseSettingsBtnAt(px, py)) { S.settingsOpen = true; return; }
        togglePause();
        return;
      }
      if (S.qSkill && bossSkillButtonAt(px, py)) { useBossSkill(); return; }
      if (skillButtonAt(px, py)) { useSkill(); return; }
      if (dashButtonAt(px, py)) { dash(); return; }
      if (pauseButtonAt(px, py)) { togglePause(); return; }

      // 以按下点为锚点的虚拟摇杆，手指可以放在屏幕任意顺手的位置
      touch.on = true;
      touch.id = e.pointerId;
      touch.x = px;
      touch.y = py;
      touch.ax = px;
      touch.ay = py;
    } else {
      mouse.x = px;
      mouse.y = py;
      mouse.known = true;
      if (S.mode === 'title') openSelect();
      else if (S.mode === 'dead' && S.deadT > 0.5) startGame();
      else if (S.mode === 'paused') {
        if (pauseSettingsBtnAt(px, py)) S.settingsOpen = true;
        else togglePause();
      } else if (S.mode === 'playing' && S.qSkill && bossSkillButtonAt(px, py)) {
        useBossSkill();
      } else if (S.mode === 'playing' && skillButtonAt(px, py)) {
        useSkill();
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (S.settingsOpen && S.draggingSlider) {
      const r = canvas.getBoundingClientRect();
      updateSliderFromPointer(S.draggingSlider, e.clientX - r.left);
      return;
    }
    if (e.pointerType !== 'touch') return;
    if (!touch.on || e.pointerId !== touch.id) return;
    const r = canvas.getBoundingClientRect();
    touch.x = e.clientX - r.left;
    touch.y = e.clientY - r.top;
  });

  const endTouch = (e) => {
    if (S.draggingSlider) {
      S.draggingSlider = null;
      saveSettings();
    }
    if (S.mode === 'skillSelect' && S.skillPress >= 0) {
      const pressed = S.skillPress;
      S.skillPress = -1;
      if (e.type === 'pointerup') {
        const rect = canvas.getBoundingClientRect();
        const hit = cardIndexAt(S._skillCardRects || [], e.clientX - rect.left, e.clientY - rect.top, 8);
        if (hit === pressed) pickSkill(hit);
      }
    }
    if (e.pointerType === 'touch' && e.pointerId === touch.id) {
      touch.on = false;
      touch.id = null;
    }
  };
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);
  canvas.addEventListener('pointerleave', endTouch);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // 手机切后台 / 锁屏时自动暂停
  if (document.addEventListener && typeof document.hidden === 'boolean') {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && S.mode === 'playing') S.mode = 'paused';
    });
  }

  function getDashButton() {
    const r = clamp(Math.min(W, H) * 0.065, 28, 38);
    return { x: W - r - 22, y: H - r - 22, r };
  }

  function dashButtonAt(px, py) {
    const b = getDashButton();
    const dx = px - b.x;
    const dy = py - b.y;
    const rr = b.r + 16;
    return dx * dx + dy * dy <= rr * rr;
  }

  // 触屏暂停键：手机上原本没有任何暂停入口，玩法说明里的「暂停 → 设置」走不通
  function pauseButtonRect() {
    return { x: W - 30, y: 80, r: 14 };
  }

  function pauseButtonAt(px, py) {
    if (!(touchMode || coarse)) return false;
    const b = pauseButtonRect();
    const dx = px - b.x;
    const dy = py - b.y;
    return dx * dx + dy * dy <= (b.r + 12) * (b.r + 12);
  }

  function togglePause() {
    if (S.mode === 'playing') {
      S.mode = 'paused';
    } else if (S.mode === 'paused') {
      S.mode = 'playing';
      last = performance.now();
    }
  }

  // 局内独立实体统一清理，避免换局 / 回标题后残留
  function clearFieldEntities() {
    S.satellites.length = 0;
    S.mines.length = 0;
    S.blades.length = 0;
  }

  // ---------------------------------------------------------------- 技能与升级
  function gainXP(n) {
    S.xp += n;
    let guard = 0;
    let gained = 0;
    while (S.xp >= S.xpNeed && guard++ < 20) {
      S.xp -= S.xpNeed;
      S.level++;
      S.xpNeed += 2;
      gained++;
    }
    if (!gained) return;
    // 已经站在选择界面里，就先排队，等当前这张选完再连开
    if (S.mode === 'skillSelect') {
      S.pendingSkillSelects += gained;
      return;
    }
    S.levelPending += gained;
    if (S.xpSweepT <= 0) {
      S.xpSweepT = 0.38;
      levelUpMoment();
    }
  }

  // 经验条填满的那一下：屏幕内描边 + 角色冲击波 + 白闪
  function levelUpMoment() {
    S.levelFlashT = 0.4;
    S.flash = Math.max(S.flash, 0.55);
    if (player) {
      spawnRing(player.x, player.y, 190, COL.cyan, 0.6, 5);
      spawnRing(player.x, player.y, 96, '#bfe9ff', 0.45, 3);
      burst(player.x, player.y, 16, COL.cyan, 250, 0.55, 2.4);
    }
    if (SFX.levelUp) SFX.levelUp();
  }

  function triggerSkillSelect() {
    if (S.mode === 'skillSelect') {
      S.pendingSkillSelects++;
      return;
    }

    const pool = SKILL_POOL.filter(function (s) {
      return skillLv(s.id) < s.maxLevel;
    });
    const ready = evoReady();
    const forced = ready.length === 0 ? pityEvoPick() : null;
    if (pool.length === 0 && ready.length === 0 && !forced) {
      S.score += 500;
      if (player.hp < player.maxHp) player.hp++;
      S.banner = '技能已满级 · +500 分';
      S.bannerT = 2;
      if (S.mode === 'skillSelect' && (!S.skillChoices || S.skillChoices.length === 0)) S.mode = 'playing';
      return;
    }

    const picks = [];
    const tmp = pool.slice();
    const WT = { common: 60, rare: 30, epic: 10 };
    while (picks.length < 4 && tmp.length > 0) {
      let total = 0;
      for (let i = 0; i < tmp.length; i++) total += WT[tmp[i].rarity];
      let roll = Math.random() * total;
      let idx = 0;
      for (; idx < tmp.length; idx++) {
        roll -= WT[tmp[idx].rarity];
        if (roll <= 0) break;
      }
      picks.push(tmp.splice(Math.min(idx, tmp.length - 1), 1)[0]);
    }

    S.skillChoices = picks.map(function (s) {
      return { skill: s, nextLevel: skillLv(s.id) + 1 };
    });
    // 进化卡固定占第一张，避免被普通技能挤掉；保底时同样强制入场
    const evo = ready.length ? ready[Math.floor(Math.random() * ready.length)] : forced;
    if (evo) {
      if (S.skillChoices.length >= 4) S.skillChoices.pop();
      S.skillChoices.unshift({ skill: evo, nextLevel: 1, pity: !!forced });
    }
    resetSkillModal(0);
    S.skillSelectKind = 'level';
    S.mode = 'skillSelect';
    touch.on = false;
    keys.clear();
  }

  // 按下即进入确认动画；动画播完才真正生效，中途重复点击会被忽略
  function pickSkill(i) {
    if (S.mode !== 'skillSelect' || S.skillAnim === 'confirm') return;
    if (!S.skillChoices[i]) return;
    S.skillSelected = i;
    S.skillConfirmI = i;
    S.skillConfirmT = 0;
    S.skillAnim = 'confirm';
    S.skillPress = -1;
    if (SFX.confirm) SFX.confirm();
  }

  function applySkillChoice(i) {
    const c = S.skillChoices[i];
    if (!c) return;

    if (S.skillSelectKind === 'boss') {
      S.bossSkills[c.skill.id] = c.nextLevel;
      S.qSkill = c.skill.id;
      S.qMax = c.skill.cd[Math.min(c.nextLevel - 1, c.skill.cd.length - 1)];
      S.qCd = 0;
      if (SFX.skillPick) SFX.skillPick();
      S.skillChoices = [];
      S.skillSelectKind = 'level';
      S.mode = 'playing';
      gainXP(5);
      if (S.mode !== 'skillSelect') S.mode = 'playing';
      return;
    }

    if (c.skill.isEvo) {
      S.evolutions[c.skill.id] = 1;
      if (S.skillOrder.indexOf(c.skill.id) < 0) S.skillOrder.push(c.skill.id);
      S.banner = '进化 · ' + c.skill.name;
      S.bannerT = 2.8;
      if (SFX.evolve) SFX.evolve();
    } else {
      S.skills[c.skill.id] = c.nextLevel;
      if (S.skillOrder.indexOf(c.skill.id) < 0) S.skillOrder.push(c.skill.id);
      S.iconAnim = { id: c.skill.id, t: 0 };
      if (c.nextLevel >= c.skill.maxLevel) unlockAchievement('all_upgrades');
    }
    S.skillPicks++;
    updateHudOrder();
    if (S.pityBump) {
      const bump = skillDef(S.pityBump);
      if (bump) showToast('保底：' + bump.name + ' +1 级');
      S.pityBump = null;
    }
    if (SFX.skillPick) SFX.skillPick();

    S.skillChoices = [];
    if (S.pendingSkillSelects > 0) {
      S.pendingSkillSelects--;
      S.mode = 'playing';
      triggerSkillSelect();
    } else {
      S.mode = 'playing';
      last = performance.now();
      if (S.pendingBossSkill) {
        S.pendingBossSkill = false;
        triggerBossSkillSelect();
      }
    }
  }

  function triggerBossSkillSelect() {
    if (S.mode === 'skillSelect') {
      S.pendingBossSkill = true;
      return;
    }
    const pool = BOSS_SKILLS.filter(function (s) {
      return (S.bossSkills[s.id] || 0) < s.maxLevel;
    });
    if (pool.length === 0) {
      S.score += 1000;
      if (player.hp < player.maxHp) player.hp++;
      gainXP(5);
      if (S.mode === 'skillSelect') S.mode = 'playing';
      return;
    }
    const picks = [];
    const tmp = pool.slice();
    while (picks.length < 3 && tmp.length > 0) {
      picks.push(tmp.splice(Math.floor(Math.random() * tmp.length), 1)[0]);
    }
    S.skillChoices = picks.map(function (s) {
      return { skill: s, nextLevel: (S.bossSkills[s.id] || 0) + 1 };
    });
    resetSkillModal(0);
    S.skillSelectKind = 'boss';
    S.mode = 'skillSelect';
    touch.on = false;
    keys.clear();
  }

  function dash() {
    if (!player || player.dashCd > 0 || player.dashT > 0) return;
    S.dashCount++;
    stats.totalDashes++;
    statsDirty = true;
    const d = inputDir();
    let ix = d.ix, iy = d.iy;
    if (!ix && !iy) {
      ix = Math.cos(player.ang);
      iy = Math.sin(player.ang);
    }
    player.dashX = ix;
    player.dashY = iy;
    player.dashT = 0.16;
    player.dashCd = dashCdMax();
    player.inv = Math.max(player.inv, 0.34);
    S.dashCritT = 0.5;
    // 起手 0.14 秒内擦到敌人或弹幕算完美闪避
    S.perfectT = 0.14;
    S.shake = Math.min(S.shake + 3, 18);
    SFX.dash();
    for (let i = 0; i < 14; i++) {
      const a = rnd(0, TAU);
      const sp = rnd(30, 120);
      pushPart({
        x: player.x, y: player.y,
        vx: Math.cos(a) * sp - ix * 120,
        vy: Math.sin(a) * sp - iy * 120,
        life: rnd(0.2, 0.45), max: 0.45,
        color: COL.cyan, size: rnd(1, 2.6), drag: 3
      });
    }
  }

  // ---------------------------------------------------------------- 角色技能
  function skillButtonRect() {
    if (touchMode || coarse) {
      const d = getDashButton();
      const r = 27;
      return { x: d.x, y: d.y - d.r - r - 24, r: r };
    }
    return { x: W - 58, y: H - 58, r: 27 };
  }

  function skillButtonAt(px, py) {
    const b = skillButtonRect();
    const dx = px - b.x;
    const dy = py - b.y;
    return dx * dx + dy * dy <= (b.r + 12) * (b.r + 12);
  }

  function useSkill() {
    if (!player || S.mode !== 'playing') return;
    if (player.skillCd > 0) {
      if (hitSoundOk()) SFX.hit(player.x);
      return;
    }
    const c = CHARACTERS[player.charIndex];
    if (!c) return;
    player.skillCd = c.cd;
    if (c.id === 'warrior') skillShockwave();
    else if (c.id === 'ranger') skillRangerDash();
    else skillNova();
    SFX.skill(c.id);
    S.banner = c.skillName;
    S.bannerT = 0.9;
  }

  function skillShockwave() {
    const p = player;
    const R = 250;
    spawnRing(p.x, p.y, R, '#ff6f91', 0.55, 5);
    burst(p.x, p.y, 26, '#ff6f91', 360, 0.7, 3);
    S.shake = Math.min(28, S.shake + 10);
    S.flash = Math.max(S.flash, 0.35);

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dx = e.x - p.x;
      const dy = e.y - p.y;
      const d = hyp(dx, dy);
      if (d > R + e.r || d < 0.001) continue;
      e.vx += (dx / d) * 620;
      e.vy += (dy / d) * 620;
      e.stunT = 0.7;
      damageEnemy(e, 3, e.x, e.y);
    }
    damageBossArea(p.x, p.y, R, 2);
  }

  function skillRangerDash() {
    const p = player;
    const a = p.ang;
    const dist = 200;

    for (let k = 0; k < 8; k++) {
      const t = k / 8;
      pushPart({
        x: p.x + Math.cos(a) * dist * t,
        y: p.y + Math.sin(a) * dist * t,
        vx: -Math.cos(a) * 60, vy: -Math.sin(a) * 60,
        life: 0.3, max: 0.3, color: '#7dffb3', size: rnd(1.4, 2.6), drag: 2.4
      });
    }

    p.x = clamp(p.x + Math.cos(a) * dist, p.r, W - p.r);
    p.y = clamp(p.y + Math.sin(a) * dist, p.r, H - p.r);
    p.inv = Math.max(p.inv, 0.5);
    spawnRing(p.x, p.y, 120, '#7dffb3', 0.35, 3);

    for (let k = -4; k <= 4; k++) {
      if (bullets.length > 150) break;
      const ang = a + k * 0.075;
      bullets.push({
        x: p.x + Math.cos(ang) * 16,
        y: p.y + Math.sin(ang) * 16,
        vx: Math.cos(ang) * 650,
        vy: Math.sin(ang) * 650,
        r: 4, life: 1.1, ang: ang, speed: 650,
        dmg: 1, homing: false, split: false, explode: false,
        pierceLeft: 0, shard: false, heavy: false, ricochetLeft: 0, bounced: 0
      });
    }
    burst(p.x, p.y, 16, '#7dffb3', 320, 0.5, 2.4);
    S.shake = Math.min(18, S.shake + 4);
  }

  function skillNova() {
    const p = player;
    const R = 330;
    spawnRing(p.x, p.y, R, '#c78bff', 0.75, 6);
    spawnRing(p.x, p.y, R * 0.62, '#8fe8ff', 0.55, 2);
    burst(p.x, p.y, 30, '#c78bff', 330, 0.9, 2.8);
    S.flash = Math.max(S.flash, 0.5);
    S.shake = Math.min(26, S.shake + 8);

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dx = e.x - p.x;
      const dy = e.y - p.y;
      if (dx * dx + dy * dy > (R + e.r) * (R + e.r)) continue;
      e.stunT = 0.9;
      damageEnemy(e, 3, e.x, e.y);
    }
    damageBossArea(p.x, p.y, R, 2);
  }

  function damageBossArea(x, y, R, dmg) {
    if (!S.bossActive) return;
    if (S.bossType === 'snake' && boss) {
      for (let i = 0; i < boss.parts.length && boss; i++) {
        const p = boss.parts[i];
        if (p.hp <= 0) continue;
        const rr = R + p.r;
        if ((p.x - x) ** 2 + (p.y - y) ** 2 <= rr * rr) damageBossPart(p, dmg, p.x, p.y);
      }
    } else if (S.bossType === 'twin' && twinBoss) {
      for (let i = 0; i < twinBoss.spheres.length && twinBoss; i++) {
        const s = twinBoss.spheres[i];
        if (s.hp <= 0) continue;
        const rr = R + s.r;
        if ((s.x - x) ** 2 + (s.y - y) ** 2 <= rr * rr) damageTwinSphere(s, dmg, s.x, s.y);
      }
    } else if (S.bossType === 'spider' && spiderBoss && spiderBoss.hp > 0) {
      const rr = R + spiderBoss.r;
      if ((spiderBoss.x - x) ** 2 + (spiderBoss.y - y) ** 2 <= rr * rr) {
        damageSpiderHead(dmg, spiderBoss.x, spiderBoss.y);
      }
    } else if (S.bossType === 'prism' && prismBoss) {
      const rr = R + prismBoss.r;
      if ((prismBoss.x - x) ** 2 + (prismBoss.y - y) ** 2 <= rr * rr) {
        damagePrism(dmg, prismBoss.x, prismBoss.y);
      }
      for (let i = 0; i < prismBoss.orbs.length; i++) {
        const o = prismBoss.orbs[i];
        if (o.hp <= 0) continue;
        const rr2 = R + o.r;
        if ((o.x - x) ** 2 + (o.y - y) ** 2 <= rr2 * rr2) damagePrismOrb(o, dmg, o.x, o.y);
      }
    }
  }

  // ---------------------------------------------------------------- 冲击波环
  function spawnRing(x, y, r1, color, life, width) {
    if (rings.length >= 10) rings.shift();
    rings.push({ x: x, y: y, r1: r1, life: life, max: life, color: color, width: width || 3 });
  }

  function updateRings(dt) {
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].life -= dt;
      if (rings[i].life <= 0) rings.splice(i, 1);
    }
  }

  function drawRings() {
    if (!rings.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < rings.length; i++) {
      const q = rings[i];
      const k = 1 - q.life / q.max;
      const rad = q.r1 * (k * (2 - k));
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = q.color;
      ctx.lineWidth = q.width * (1 - k * 0.5);
      ctx.beginPath();
      ctx.arc(q.x, q.y, Math.max(1, rad), 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- Boss 强力技能
  function bossSkillDef(id) {
    for (let i = 0; i < BOSS_SKILLS.length; i++) {
      if (BOSS_SKILLS[i].id === id) return BOSS_SKILLS[i];
    }
    return null;
  }

  function useBossSkill() {
    if (!player || S.mode !== 'playing') return;
    if (!S.qSkill) {
      showToast('击败 Boss 后可获得强力技能');
      return;
    }
    const def = bossSkillDef(S.qSkill);
    if (!def) return;
    if (S.qCd > 0) {
      if (hitSoundOk()) SFX.hit();
      return;
    }
    const lv = S.bossSkills[S.qSkill] || 1;
    S.qMax = def.cd[Math.min(lv - 1, def.cd.length - 1)];
    S.qCd = S.qMax;

    if (def.id === 'nova') bossSkillNova(lv);
    else if (def.id === 'bolt') bossSkillChain(lv);
    else if (def.id === 'phase') bossSkillPhase(lv);
    else bossSkillFrost(lv);

    if (SFX.ult) SFX.ult(def.id);
    S.banner = def.name;
    S.bannerT = 0.9;
  }

  function bossSkillNova(lv) {
    const dmg = 15 + (lv - 1) * 5;
    ebullets.length = 0;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (!e) continue;
      damageEnemy(e, dmg, e.x, e.y);
    }
    damageBossArea(player.x, player.y, 6000, dmg);
    spawnRing(player.x, player.y, Math.max(W, H), '#ffcf4d', 0.85, 8);
    burst(player.x, player.y, 55, COL.gold, 420, 1.0, 3.2);
    S.flash = Math.max(S.flash, 1.3);
    S.shake = Math.min(22, S.shake + 10);
  }

  function bossSkillChain(lv) {
    const jumps = 4 + lv;
    let dmg = 8 + (lv - 1) * 2;
    let fromX = player.x;
    let fromY = player.y;
    const used = [];

    for (let j = 0; j < jumps; j++) {
      let best = null;
      let bd = 560 * 560;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e || used.indexOf(e) >= 0) continue;
        const d = (e.x - fromX) ** 2 + (e.y - fromY) ** 2;
        if (d < bd) { bd = d; best = e; }
      }
      if (!best) {
        const t = nearestEnemyTo(fromX, fromY, 560);
        if (t && used.indexOf(t) < 0) best = t;
      }
      if (!best) break;

      spawnBolt(fromX, fromY, best.x, best.y, '#ffe9a8');
      if (enemies.indexOf(best) >= 0) damageEnemy(best, dmg, best.x, best.y);
      else damageBossArea(best.x, best.y, 12, dmg);

      used.push(best);
      fromX = best.x;
      fromY = best.y;
      dmg *= 0.8;
    }
    S.flash = Math.max(S.flash, 0.25);
  }

  function bossSkillPhase(lv) {
    S.phaseT = 2 + (lv - 1) * 0.5;
    S.phaseDmg = 4 + lv * 2;
    player.inv = Math.max(player.inv, S.phaseT);
    spawnRing(player.x, player.y, 90, COL.cyan, 0.55, 4);
    burst(player.x, player.y, 18, COL.cyan, 300, 0.6, 2.6);
  }

  function bossSkillFrost(lv) {
    const dur = 2 + (lv - 1) * 0.5;
    for (let i = 0; i < enemies.length; i++) {
      enemies[i].stunT = Math.max(enemies[i].stunT || 0, dur);
    }
    S.bossSlowT = Math.max(S.bossSlowT, dur);
    spawnRing(player.x, player.y, 420, '#8fe8ff', 0.8, 6);
    burst(player.x, player.y, 30, '#8fe8ff', 330, 0.8, 2.8);
    S.flash = Math.max(S.flash, 0.4);
  }

  function spawnBolt(x1, y1, x2, y2, color) {
    if (bolts.length >= 24) bolts.shift();
    bolts.push({ x1: x1, y1: y1, x2: x2, y2: y2, life: 0.18, max: 0.18, color: color });
  }

  function updateBolts(dt) {
    for (let i = bolts.length - 1; i >= 0; i--) {
      bolts[i].life -= dt;
      if (bolts[i].life <= 0) bolts.splice(i, 1);
    }
  }

  function drawBolts() {
    if (!bolts.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < bolts.length; i++) {
      const b = bolts[i];
      const a = Math.max(0, b.life / b.max);
      ctx.globalAlpha = a * 0.3;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
      ctx.globalAlpha = a;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function bossSkillButtonRect() {
    if (touchMode || coarse) {
      const e = skillButtonRect();
      return { x: e.x - 62, y: e.y, r: 24 };
    }
    return { x: W - 112, y: H - 58, r: 24 };
  }

  function bossSkillButtonAt(px, py) {
    const b = bossSkillButtonRect();
    const dx = px - b.x;
    const dy = py - b.y;
    return dx * dx + dy * dy <= (b.r + 10) * (b.r + 10);
  }

  function drawBossSkillButton() {
    if (!player || !S.qSkill) return;
    if (S.mode !== 'playing' && S.mode !== 'paused') return;
    const def = bossSkillDef(S.qSkill);
    if (!def) return;
    const b = bossSkillButtonRect();
    const col = RARITY_COLOR[def.rarity];
    const frac = S.qMax > 0 ? clamp(S.qCd / S.qMax, 0, 1) : 0;
    const ready = S.qCd <= 0;

    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = ready ? 'rgba(255,209,102,0.12)' : 'rgba(20,30,50,0.65)';
    ctx.fill();
    ctx.strokeStyle = ready ? col : 'rgba(150,180,220,0.35)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    if (!ready) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ready ? col : 'rgba(150,180,220,0.5)';
    drawGlyphOn(ctx, def.id, b.x, b.y - 1, b.r * 0.42, ready ? col : 'rgba(150,180,220,0.5)');
    ctx.font = font(8, 600);
    ctx.fillStyle = 'rgba(180,210,245,0.55)';
    ctx.fillText(ready ? 'Q' : Math.ceil(S.qCd) + 's', b.x, b.y + b.r + 9);
    ctx.restore();
  }

  function inputDir() {
    let ix = 0, iy = 0;
    if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
    if (keys.has('d') || keys.has('arrowright')) ix += 1;
    if (keys.has('w') || keys.has('arrowup')) iy -= 1;
    if (keys.has('s') || keys.has('arrowdown')) iy += 1;
    if (touch.on) {
      const dx = touch.x - touch.ax;
      const dy = touch.y - touch.ay;
      const d = hyp(dx, dy);
      if (d > 12) {
        const mag = Math.min(1, (d / 70) * settings.touchSensitivity);
        ix = (dx / d) * mag;
        iy = (dy / d) * mag;
      } else {
        ix = 0;
        iy = 0;
      }
    }
    const m = hyp(ix, iy);
    if (m > 1) { ix /= m; iy /= m; }
    return { ix, iy };
  }

  // ---------------------------------------------------------------- 新技能机制
  function dashCdMax() {
    return 1.05 * (1 - 0.12 * skillLv('dashcd'));
  }

  function slowRadius() {
    return 200 * (evolved('gravity') ? 1.6 : 1);
  }

  function slowRatio() {
    return 0.12 * skillLv('slowfield');
  }

  function critChanceNow() {
    return Math.min(0.75, 0.12 * skillLv('crit') + (S.dashCritT > 0 ? 0.1 : 0));
  }

  function damageTarget(t, dmg, x, y) {
    if (!t) return;
    if (enemies.indexOf(t) >= 0) { damageEnemy(t, dmg, x, y); return; }
    if (boss && boss.parts && boss.parts.indexOf(t) >= 0) { damageBossPart(t, dmg, x, y); return; }
    if (twinBoss && twinBoss.spheres.indexOf(t) >= 0) { damageTwinSphere(t, dmg, x, y); return; }
    if (t === spiderBoss) { damageSpiderHead(dmg, x, y); return; }
    if (t === prismBoss) { damagePrism(dmg, x, y); }
  }

  // 连锁闪电：从命中点开始找最近目标，每跳 ×0.7
  function chainFromBullet(x, y, jumps, baseDmg, skip) {
    let fx = x;
    let fy = y;
    let dmg = baseDmg;
    const used = [];
    if (evolved('arcstorm')) {
      jumps += 2;
      dmg *= 2;
    }

    for (let j = 0; j < jumps; j++) {
      let best = null;
      let bd = 300 * 300;

      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e || e === skip || used.indexOf(e) >= 0) continue;
        const d = (e.x - fx) * (e.x - fx) + (e.y - fy) * (e.y - fy);
        if (d < bd) { bd = d; best = e; }
      }
      if (S.bossActive) {
        if (S.bossType === 'snake' && boss) {
          for (let i = 0; i < boss.parts.length; i++) {
            const q = boss.parts[i];
            if (q.hp <= 0 || used.indexOf(q) >= 0) continue;
            const d = (q.x - fx) * (q.x - fx) + (q.y - fy) * (q.y - fy);
            if (d < bd) { bd = d; best = q; }
          }
        } else if (S.bossType === 'twin' && twinBoss) {
          for (let i = 0; i < twinBoss.spheres.length; i++) {
            const q = twinBoss.spheres[i];
            if (q.hp <= 0 || used.indexOf(q) >= 0) continue;
            const d = (q.x - fx) * (q.x - fx) + (q.y - fy) * (q.y - fy);
            if (d < bd) { bd = d; best = q; }
          }
        } else if (S.bossType === 'spider' && spiderBoss && spiderBoss.hp > 0 && used.indexOf(spiderBoss) < 0) {
          const d = (spiderBoss.x - fx) * (spiderBoss.x - fx) + (spiderBoss.y - fy) * (spiderBoss.y - fy);
          if (d < bd) { bd = d; best = spiderBoss; }
        } else if (S.bossType === 'prism' && prismBoss && prismBoss.hp > 0 && used.indexOf(prismBoss) < 0) {
          const d = (prismBoss.x - fx) * (prismBoss.x - fx) + (prismBoss.y - fy) * (prismBoss.y - fy);
          if (d < bd) { bd = d; best = prismBoss; }
        }
      }

      if (!best) break;
      spawnBolt(fx, fy, best.x, best.y, '#bfe9ff');
      damageTarget(best, dmg, best.x, best.y);
      used.push(best);
      fx = best.x;
      fy = best.y;
      dmg *= 0.7;
    }
  }

  function applyBurnEnemy(e, dps) {
    if (!e || e.hp <= 0 || !e.debuffs) return;
    const b = e.debuffs.burn;
    b.t = 3;
    b.dps = Math.max(b.dps, dps);
    if (b.tick <= 0) b.tick = 0.5;
  }

  function applyBurnBoss(obj, dps) {
    if (!obj || obj.hp <= 0) return;
    if (!obj.burn) obj.burn = { t: 0, dps: 0, tick: 0 };
    obj.burn.t = 3;
    obj.burn.dps = Math.max(obj.burn.dps, dps);
    if (obj.burn.tick <= 0) obj.burn.tick = 0.5;
  }

  function tickBossBurn(obj, dt) {
    const b = obj.burn;
    if (!b || b.t <= 0) return;
    b.t -= dt;
    b.tick -= dt;
    if (b.tick <= 0) {
      b.tick += 0.5;
      const dmg = b.dps * 0.5;
      if (S.bossType === 'snake') damageBossPart(obj, dmg, obj.x, obj.y);
      else if (S.bossType === 'twin') damageTwinSphere(obj, dmg, obj.x, obj.y);
      else if (S.bossType === 'spider') damageSpiderHead(dmg, obj.x, obj.y);
      else if (S.bossType === 'prism') damagePrism(dmg, obj.x, obj.y);
    }
    if (b.t <= 0) { b.t = 0; b.dps = 0; }
  }

  // 灼烧按正常游戏时间跳伤，不受减速力场影响
  function updateBossBurns(dt) {
    if (!S.bossActive) return;
    if (S.bossType === 'snake' && boss) {
      for (let i = 0; i < boss.parts.length; i++) {
        if (boss.parts[i].hp > 0) tickBossBurn(boss.parts[i], dt);
      }
    } else if (S.bossType === 'twin' && twinBoss) {
      for (let i = 0; i < twinBoss.spheres.length; i++) {
        if (twinBoss.spheres[i].hp > 0) tickBossBurn(twinBoss.spheres[i], dt);
      }
    } else if (S.bossType === 'spider' && spiderBoss && spiderBoss.hp > 0) {
      tickBossBurn(spiderBoss, dt);
    } else if (S.bossType === 'prism' && prismBoss && prismBoss.hp > 0) {
      tickBossBurn(prismBoss, dt);
    }
  }

  function updateSatellites(dt) {
    const lv = skillLv('orbital');
    if (lv <= 0) {
      if (S.satellites.length) S.satellites.length = 0;
      return;
    }
    while (S.satellites.length < lv) S.satellites.push({ x: player.x, y: player.y });
    while (S.satellites.length > lv) S.satellites.pop();

    const n = S.satellites.length;
    const dmg = 1 + lv * 0.5;
    for (let i = 0; i < n; i++) {
      const s = S.satellites[i];
      const a = S.t * 1.7 + (i / n) * TAU;
      const tx = player.x + Math.cos(a) * 64;
      const ty = player.y + Math.sin(a) * 64;
      // 平滑跟随：冲刺时也不会瞬移
      s.x += (tx - s.x) * 0.15;
      s.y += (ty - s.y) * 0.15;

      if (evolved('gravity')) {
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (!e) continue;
          const dx = s.x - e.x;
          const dy = s.y - e.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > 0.01 && d2 < 130 * 130) {
            const d = Math.sqrt(d2);
            e.x += (dx / d) * 42 * dt;
            e.y += (dy / d) * 42 * dt;
          }
        }
      }

      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!e || e.satCd > 0) continue;
        const rr = e.r + 10;
        if ((e.x - s.x) * (e.x - s.x) + (e.y - s.y) * (e.y - s.y) <= rr * rr) {
          damageEnemy(e, dmg, e.x, e.y);
          e.satCd = 0.5;
        }
      }
      if (S.bossActive && S.satBossCd <= 0) {
        damageBossArea(s.x, s.y, 10, dmg);
        S.satBossCd = 0.5;
      }
    }
  }

  function updateMines(dt) {
    const lv = skillLv('mine');
    if (lv <= 0) {
      if (S.mines.length) S.mines.length = 0;
      return;
    }
    S.mineT -= dt;
    if (S.mineT <= 0) {
      S.mineT = 3;
      if (S.mines.length < 5) {
        S.mines.push({ x: player.x, y: player.y, t: 8, arm: 0.4 });
      }
    }
    for (let i = S.mines.length - 1; i >= 0; i--) {
      const m = S.mines[i];
      m.t -= dt;
      m.arm -= dt;
      let boom = m.t <= 0;
      if (!boom && m.arm <= 0) {
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if ((e.x - m.x) * (e.x - m.x) + (e.y - m.y) * (e.y - m.y) <= (e.r + 22) * (e.r + 22)) {
            boom = true;
            break;
          }
        }
      }
      if (boom) {
        explodeAt(m.x, m.y, null, 80, 2 + lv);
        spawnRing(m.x, m.y, 80, COL.orange, 0.5, 3);
        S.mines.splice(i, 1);
      }
    }
  }

  function updateBlades(dt) {
    const lv = skillLv('boomerang');
    if (lv <= 0) {
      if (S.blades.length) S.blades.length = 0;
      return;
    }
    S.bladeT -= dt;
    if (S.bladeT <= 0) {
      S.bladeT = lv >= 3 ? 2.0 : 2.6;
      const n = lv >= 2 ? 2 : 1;
      for (let k = 0; k < n; k++) {
        const a = player.ang + (k - (n - 1) / 2) * 0.35;
        S.blades.push({ x: player.x, y: player.y, ang: a, phase: 'out', t: 0, dmg: 1.5, bossCd: 0, spin: 0 });
      }
    }
    for (let i = S.blades.length - 1; i >= 0; i--) {
      const b = S.blades[i];
      b.t += dt;
      b.spin += dt * 14;
      if (b.bossCd > 0) b.bossCd -= dt;

      if (b.phase === 'out') {
        b.x += Math.cos(b.ang) * 520 * dt;
        b.y += Math.sin(b.ang) * 520 * dt;
        if (b.t > 0.5) b.phase = 'back';
      } else {
        const a = Math.atan2(player.y - b.y, player.x - b.x);
        b.x += Math.cos(a) * 620 * dt;
        b.y += Math.sin(a) * 620 * dt;
        if (b.t > 0.55 && (b.x - player.x) * (b.x - player.x) + (b.y - player.y) * (b.y - player.y) < 24 * 24) {
          S.blades.splice(i, 1);
          continue;
        }
      }

      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (!e || e.bladeHit === b) continue;
        const rr = e.r + 12;
        if ((e.x - b.x) * (e.x - b.x) + (e.y - b.y) * (e.y - b.y) <= rr * rr) {
          damageEnemy(e, b.dmg, e.x, e.y);
          e.bladeHit = b;
        }
      }
      if (S.bossActive && b.bossCd <= 0) {
        damageBossArea(b.x, b.y, 12, b.dmg);
        b.bossCd = 0.25;
      }
      if (b.t > 3) S.blades.splice(i, 1);
    }
  }

  function updateShieldRegen(dt) {
    const lv = skillLv('shieldregen');
    if (lv <= 0) { S.shieldAcc = 0; return; }
    S.sinceHurt += dt;
    if (S.sinceHurt < 6 - lv || player.shield >= player.maxShield) {
      S.shieldAcc = 0;
      return;
    }
    S.shieldAcc += dt;
    if (S.shieldAcc >= 1) {
      S.shieldAcc -= 1;
      player.shield = Math.min(player.maxShield, player.shield + 1);
      spawnRing(player.x, player.y, 46, COL.cyan, 0.4, 2);
      if (hitSoundOk()) SFX.shield(player.x);
    }
  }

  // ---------------------------------------------------------------- update
  function update(dt) {
    S.t += dt;
    S.elapsed += dt;
    S.elapsedSec += dt;
    if (S.levelFlashT > 0) S.levelFlashT = Math.max(0, S.levelFlashT - dt);
    // 经验条先扫光再脉冲，走完才真正弹出技能选择
    if (S.xpSweepT > 0) {
      S.xpSweepT -= dt;
      if (S.xpSweepT <= 0) {
        S.xpSweepT = 0;
        if (S.levelPending > 0) {
          S.pendingSkillSelects = S.levelPending - 1;
          S.levelPending = 0;
          triggerSkillSelect();
        }
      }
    }
    S.qCd = Math.max(0, S.qCd - dt);
    S.phaseT = Math.max(0, S.phaseT - dt);
    S.dashCritT = Math.max(0, S.dashCritT - dt);
    S.satBossCd = Math.max(0, S.satBossCd - dt);
    updatePerfectDodge(dt);
    const bossSlow = S.bossSlowT > 0;
    S.bossSlowT = Math.max(0, S.bossSlowT - dt);
    stats.totalTime += dt;
    statsSaveAcc += dt;
    if (statsSaveAcc >= 5) {
      statsSaveAcc = 0;
      statsDirty = true;
      saveStats();
    }

    if (!S.bossActive) {
      S.waveT += dt;
      if (S.waveT >= 18) {
        S.waveT = 0;
        if (S.wave === 5 && !S.bossDone) {
          S.wave = 6;
          startBoss();
        } else if (S.wave === 9 && !S.boss2Done) {
          S.wave = 10;
          startTwinBoss();
        } else if (S.wave === 15 && !S.boss3Done) {
          S.wave = 16;
          startSpiderBoss();
        } else if (S.wave === 16 && !S.boss4Done) {
          S.wave = 17;
          startPrismBoss();
        } else {
          S.wave++;
          // 波次推进时清掉地雷，避免跨波残留
          S.mines.length = 0;
          clearScorePickups();
          S.banner = '第 ' + S.wave + ' 波' +
            (S.wave <= 3 ? ' · 击杀积攒经验' : '');
          S.bannerT = 2.4;
          SFX.wave();
        }
      }
    }

    S.bossFade = lerp(S.bossFade, S.bossActive ? 1 : 0, 1 - Math.exp(-3 * dt));

    if (S.bannerT > 0) S.bannerT -= dt;
    if (S.shake > 0) {
      S.shake *= Math.exp(-7 * dt);
      if (S.shake < 0.25) S.shake = 0;
    }
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.4);
    if (S.comboT > 0) {
      S.comboT -= dt;
      if (S.comboT <= 0) S.combo = 0;
    }

    updatePlayer(dt);
    updateShieldRegen(dt);
    updateSpawning(dt);
    updateEnemies(dt);
    updateSatellites(dt);
    updateMines(dt);
    updateBlades(dt);
    let bossDt = bossSlow ? dt * 0.5 : dt;
    if (skillLv('slowfield') > 0) bossDt *= (1 - slowRatio() * 0.66);
    updateBossBurns(dt);
    updateBoss(bossDt);
    updateBullets(dt);
    updateEnemyBullets(dt);
    updatePickups(dt);
    updateParticles(dt);
    updateTexts(dt);
    updatePendingBursts(dt);
    updateRings(dt);
    updateBolts(dt);
    checkWaveProgress();

    // 濒死心跳：只在 1 血时以约 1 秒间隔触发，避免持续叠音
    if (player.hp <= 1) {
      S.heartT -= dt;
      if (S.heartT <= 0) {
        S.heartT = 0.95;
        SFX.heartbeat();
      }
    } else {
      S.heartT = 0.35;
    }
  }

  function updatePlayer(dt) {
    const p = player;
    p.inv = Math.max(0, p.inv - dt);
    p.dashCd = Math.max(0, p.dashCd - dt);
    p.skillCd = Math.max(0, p.skillCd - dt);
    p.fireCd -= dt;

    // 游侠被动：连击同时提升移速与射速
    const comboBoost = p.charId === 'ranger' ? Math.min(0.2, S.combo * 0.01) : 0;
    p.moveMul = p.speedMul * (1 + comboBoost);
    p.fireBoost = p.fireMul * (1 + comboBoost);
    if (S.phaseT > 0) p.moveMul *= 2;

    const dir = inputDir();

    if (p.dashT > 0) {
      p.dashT -= dt;
      p.x += p.dashX * 1150 * dt;
      p.y += p.dashY * 1150 * dt;
      if (Math.random() < 0.8) {
        pushPart({
          x: p.x + rnd(-5, 5), y: p.y + rnd(-5, 5),
          vx: -p.dashX * rnd(40, 120), vy: -p.dashY * rnd(40, 120),
          life: 0.3, max: 0.3, color: COL.cyan, size: rnd(1, 2.4), drag: 2
        });
      }
    } else {
      p.vx += dir.ix * 2900 * p.moveMul * dt;
      p.vy += dir.iy * 2900 * p.moveMul * dt;
      const drag = Math.exp(-7.5 * dt);
      p.vx *= drag;
      p.vy *= drag;
      const sp = hyp(p.vx, p.vy);
      const maxSp = 470 * p.moveMul;
      if (sp > maxSp) { p.vx *= maxSp / sp; p.vy *= maxSp / sp; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    p.x = clamp(p.x, p.r, W - p.r);
    p.y = clamp(p.y, p.r, H - p.r);

    const aim = aimAngle();
    if (aim === null) {
      // 触屏没有可见目标时不空放子弹
      p.fireCd = Math.min(p.fireCd, 0.03);
    } else {
      p.ang = aim;
      if (p.fireCd <= 0) shoot();
    }
  }

  function aimAngle() {
    const p = player;
    // 触屏：只瞄屏幕内、且距离够近的敌人；否则停火，
    // 让敌人有机会真正进入画面，而不是刚露头就被点掉。
    if (coarse || touch.on) {
      const range = S.bossActive ? 1400 : Math.max(220, Math.min(W, H) * 0.55);
      const near = nearestEnemy(true, range);
      return near ? Math.atan2(near.y - p.y, near.x - p.x) : null;
    }
    if (mouse.known) return Math.atan2(mouse.y - p.y, mouse.x - p.x);
    const near = nearestEnemy(false, 1e9);
    return near ? Math.atan2(near.y - p.y, near.x - p.x) : p.ang;
  }

  function nearestEnemy(visibleOnly, maxDist) {
    const limit = maxDist || Infinity;
    let best = null;
    let bd = limit * limit;
    const margin = 20;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (visibleOnly && (e.x < -margin || e.x > W + margin || e.y < -margin || e.y > H + margin)) continue;
      const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    if (S.bossActive && S.bossType === 'snake' && boss) {
      for (let i = 0; i < boss.parts.length; i++) {
        const part = boss.parts[i];
        if (part.hp <= 0) continue;
        if (visibleOnly && (part.x < -margin || part.x > W + margin || part.y < -margin || part.y > H + margin)) continue;
        const d = (part.x - player.x) ** 2 + (part.y - player.y) ** 2;
        if (d < bd) { bd = d; best = part; }
      }
    } else if (S.bossActive && S.bossType === 'twin' && twinBoss) {
      for (let i = 0; i < twinBoss.spheres.length; i++) {
        const s = twinBoss.spheres[i];
        if (s.hp <= 0) continue;
        if (visibleOnly && (s.x < -margin || s.x > W + margin || s.y < -margin || s.y > H + margin)) continue;
        const d = (s.x - player.x) ** 2 + (s.y - player.y) ** 2;
        if (d < bd) { bd = d; best = s; }
      }
    } else if (S.bossActive && S.bossType === 'spider' && spiderBoss) {
      if (spiderBoss.hp > 0) {
        const d = (spiderBoss.x - player.x) ** 2 + (spiderBoss.y - player.y) ** 2;
        if (d < bd) { bd = d; best = spiderBoss; }
      }
    } else if (S.bossActive && S.bossType === 'prism' && prismBoss && prismBoss.hp > 0) {
      const d = (prismBoss.x - player.x) ** 2 + (prismBoss.y - player.y) ** 2;
      if (d < bd) { bd = d; best = prismBoss; }
    }
    return best;
  }

  function nearestEnemyTo(x, y, range, skip) {
    let best = null;
    let bd = range * range;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (skip && e === skip) continue;
      const d = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    if (S.bossActive && S.bossType === 'snake' && boss) {
      for (let i = 0; i < boss.parts.length; i++) {
        const part = boss.parts[i];
        if (part.hp <= 0) continue;
        if (skip && part === skip) continue;
        const d = (part.x - x) ** 2 + (part.y - y) ** 2;
        if (d < bd) { bd = d; best = part; }
      }
    } else if (S.bossActive && S.bossType === 'twin' && twinBoss) {
      for (let i = 0; i < twinBoss.spheres.length; i++) {
        const s = twinBoss.spheres[i];
        if (s.hp <= 0) continue;
        if (skip && s === skip) continue;
        const d = (s.x - x) ** 2 + (s.y - y) ** 2;
        if (d < bd) { bd = d; best = s; }
      }
    } else if (S.bossActive && S.bossType === 'spider' && spiderBoss && spiderBoss.hp > 0 && spiderBoss !== skip) {
      const d = (spiderBoss.x - x) ** 2 + (spiderBoss.y - y) ** 2;
      if (d < bd) { bd = d; best = spiderBoss; }
    } else if (S.bossActive && S.bossType === 'prism' && prismBoss && prismBoss.hp > 0 && prismBoss !== skip) {
      const d = (prismBoss.x - x) ** 2 + (prismBoss.y - y) ** 2;
      if (d < bd) { bd = d; best = prismBoss; }
    }
    return best;
  }

  function shoot() {
    const p = player;
    const lvHoming = skillLv('homing');
    const lvSplit = skillLv('split');
    const lvExplode = skillLv('explode');
    const lvPierce = skillLv('pierce');
    const lvSpread = skillLv('spread');
    const lvRapid = skillLv('rapid');
    const lvHeavy = skillLv('heavy');
    const lvRicochet = skillLv('ricochet');
    S.shots++;

    const dmg = 1 + lvHeavy;
    const heavy = lvHeavy > 0;
    let angles = [0];
    if (lvSpread === 1) angles = [-0.17, 0, 0.17];
    else if (lvSpread === 2) angles = [-0.26, -0.09, 0.09, 0.26];
    else if (lvSpread >= 3) angles = [-0.34, -0.17, 0, 0.17, 0.34];
    const speed = lvSpread ? 470 : 585;

    const railOn = evolved('rail');
    // 蜂群：散射时每发子弹分到一个不同目标
    let swarmTargets = null;
    if (evolved('swarm') && lvSpread > 0 && enemies.length) {
      swarmTargets = enemies.slice().sort(function (m, n) {
        const dm = (m.x - p.x) * (m.x - p.x) + (m.y - p.y) * (m.y - p.y);
        const dn = (n.x - p.x) * (n.x - p.x) + (n.y - p.y) * (n.y - p.y);
        return dm - dn;
      }).slice(0, angles.length);
    }

    for (let i = 0; i < angles.length; i++) {
      if (bullets.length > 160) break;
      const a = p.ang + angles[i] + rnd(-0.02, 0.02);
      bullets.push({
        x: p.x + Math.cos(a) * 18,
        y: p.y + Math.sin(a) * 18,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        r: heavy ? 5 + lvHeavy : 4,
        life: S.bossActive ? 1.9 : 1.2,
        ang: a,
        speed: speed,
        dmg: dmg,
        homing: lvHoming > 0,
        homingLv: lvHoming,
        split: lvSplit > 0,
        splitLv: lvSplit,
        explode: lvExplode > 0,
        explodeLv: lvExplode,
        pierceLeft: lvPierce + (railOn ? 1 : 0),
        armor: railOn,
        ricochetLeft: lvRicochet,
        bounced: 0,
        target: swarmTargets && swarmTargets[i] ? swarmTargets[i] : null,
        shard: false,
        heavy: heavy
      });
      pushPart({
        x: p.x + Math.cos(a) * 18, y: p.y + Math.sin(a) * 18,
        vx: Math.cos(a) * 100, vy: Math.sin(a) * 100,
        life: 0.16, max: 0.16, color: COL.cyan, size: 2.4, drag: 2
      });
    }

    p.fireCd = 0.135 * (1 - 0.12 * lvRapid) / Math.max(0.6, p.fireBoost);
    SFX.shoot();
  }

  function spawnShards(b, x, y) {
    if (bullets.length > 150) return;
    const n = 2 + (b.splitLv || 1);
    const cluster = evolved('cluster');
    for (let k = 0; k < n; k++) {
      const a = b.ang + (k - (n - 1) / 2) * 0.38;
      bullets.push({
        x, y,
        vx: Math.cos(a) * 600,
        vy: Math.sin(a) * 600,
        r: 3, life: 0.5, ang: a,
        dmg: 1,
        homing: false, homingLv: 0, split: false, splitLv: 0, explode: false, explodeLv: 0,
        pierceLeft: 0, shard: true, heavy: false, armor: false, target: null,
        ricochetLeft: 0, bounced: 0,
        cluster: cluster
      });
    }
    SFX.split();
  }

  function explodeRadius(b) {
    return 70 + (b.explodeLv || 1) * 18;
  }

  function explodeDamage(b) {
    return (b.explodeLv || 1) >= 3 ? 2 : 1;
  }

  function explodeAt(x, y, primary, radius, dmg) {
    const R = radius || 82;
    const D = dmg || 1;
    const magma = evolved('magma');
    const burnDps = magma ? 2 + Math.max(1, skillLv('burn')) : 0;
    burst(x, y, 22, COL.orange, 250, 0.55, 2.8);
    S.shake = Math.min(20, S.shake + 3);
    if (boomSoundOk()) SFX.boom(x);

    if (S.bossActive && S.bossType === 'snake' && boss) {
      for (let i = 0; i < boss.parts.length; i++) {
        const part = boss.parts[i];
        if (part.hp <= 0) continue;
        const rr = R + part.r;
        if ((part.x - x) ** 2 + (part.y - y) ** 2 <= rr * rr) {
          damageBossPart(part, D, part.x, part.y);
          if (magma) applyBurnBoss(part, burnDps);
        }
      }
    } else if (S.bossActive && S.bossType === 'twin' && twinBoss) {
      for (let i = 0; i < twinBoss.spheres.length; i++) {
        const s = twinBoss.spheres[i];
        if (s.hp <= 0) continue;
        const rr = R + s.r;
        if ((s.x - x) ** 2 + (s.y - y) ** 2 <= rr * rr) {
          damageTwinSphere(s, D, s.x, s.y);
          if (magma) applyBurnBoss(s, burnDps);
        }
      }
    } else if (S.bossActive && S.bossType === 'spider' && spiderBoss && spiderBoss.hp > 0) {
      const rr = R + spiderBoss.r;
      if ((spiderBoss.x - x) ** 2 + (spiderBoss.y - y) ** 2 <= rr * rr) {
        damageSpiderHead(D, spiderBoss.x, spiderBoss.y);
        if (magma) applyBurnBoss(spiderBoss, burnDps);
      }
    } else if (S.bossActive && S.bossType === 'prism' && prismBoss) {
      const rr = R + prismBoss.r;
      if ((prismBoss.x - x) ** 2 + (prismBoss.y - y) ** 2 <= rr * rr) {
        damagePrism(D, prismBoss.x, prismBoss.y);
        if (magma) applyBurnBoss(prismBoss, burnDps);
      }
      for (let i = 0; i < prismBoss.orbs.length; i++) {
        const o = prismBoss.orbs[i];
        if (o.hp <= 0) continue;
        const rr2 = R + o.r;
        if ((o.x - x) ** 2 + (o.y - y) ** 2 <= rr2 * rr2) damagePrismOrb(o, D, o.x, o.y);
      }
    }

    for (let k = enemies.length - 1; k >= 0; k--) {
      const o = enemies[k];
      if (!o) continue;
      if (o === primary) continue;
      let d2 = (o.x - x) ** 2 + (o.y - y) ** 2;
      if (o.type === 'snake' && o.segs) {
        for (let s = 0; s < o.segs.length; s++) {
          const dd = (o.segs[s].x - x) ** 2 + (o.segs[s].y - y) ** 2;
          if (dd < d2) d2 = dd;
        }
      }
      const rr = R + o.r;
      if (d2 <= rr * rr) {
        damageEnemy(o, D, x, y);
        if (magma) applyBurnEnemy(o, burnDps);
      }
    }
  }

  function updateSpawning(dt) {
    if (S.bossActive) return;
    if (enemies.length >= 70) return;
    spawnTimer -= dt;
    if (spawnTimer > 0) return;
    // 第 5 波之后生成速率固定，不再随波次加快
    const fixed = S.wave >= 5;
    const base = fixed ? 0.645 : Math.max(0.26, 1.02 - S.wave * 0.075);
    spawnTimer = base * rnd(0.65, 1.3);
    spawnEnemy();
    const extra = fixed ? 0.30 : Math.min(0.45, 0.06 * S.wave);
    if (Math.random() < extra) spawnEnemy();
  }

  function clearScorePickups() {
    for (let i = picks.length - 1; i >= 0; i--) {
      if (picks[i].kind === 'score') picks.splice(i, 1);
    }
  }

  function pickType() {
    const w = S.wave;
    const table = [
      ['chaser', Math.max(0.06, 0.85 - w * 0.05)],
      ['dasher', w >= 2 ? 0.26 + w * 0.015 : 0.1],
      ['tank', w >= 3 ? 0.09 + w * 0.012 : 0],
      ['gunner', w >= 4 ? 0.07 + w * 0.01 : 0],
      ['snake', w >= 4 ? 0.06 + (w >= 8 ? 0.02 : 0) : 0],
      ['spider', w >= 6 ? 0.07 + (w >= 9 ? 0.02 : 0) : 0],
      ['bomber', w >= 2 ? 0.18 : 0],
      ['splitter', w >= 3 ? 0.15 : 0],
      ['shield', w >= 5 ? 0.16 : 0],
      ['teleporter', w >= 7 ? 0.12 : 0],
      ['summoner', w >= 8 ? 0.07 : 0]
    ];
    let total = 0;
    for (const row of table) total += row[1];
    let roll = Math.random() * total;
    for (const row of table) {
      roll -= row[1];
      if (roll <= 0) return row[0];
    }
    return 'chaser';
  }

  function countType(t) {
    let n = 0;
    for (let i = 0; i < enemies.length; i++) if (enemies[i].type === t) n++;
    return n;
  }

  function newDebuffs() {
    return {
      burn: { t: 0, dps: 0, tick: 0 },
      slow: { t: 0, ratio: 0 }
    };
  }

  function spawnEnemy(forceType) {
    let type = forceType || pickType();
    // 蛇 / 蛛限制同时存在数量，避免堆满屏
    if (type === 'snake' && countType('snake') >= 2) type = 'chaser';
    if (type === 'spider' && countType('spider') >= 3) type = 'chaser';
    if (type === 'bomber' && countType('bomber') >= 4) type = 'chaser';
    if (type === 'splitter' && countType('splitter') >= 3) type = 'chaser';
    if (type === 'shield' && countType('shield') >= 3) type = 'chaser';
    if (type === 'teleporter' && countType('teleporter') >= 2) type = 'chaser';
    if (type === 'summoner' && countType('summoner') >= 1) type = 'chaser';

    const cfg = ENEMY[type];
    const edge = rint(0, 3);
    const m = 55;
    let x = 0, y = 0;
    if (edge === 0) { x = rnd(20, W - 20); y = -m; }
    else if (edge === 1) { x = W + m; y = rnd(20, H - 20); }
    else if (edge === 2) { x = rnd(20, W - 20); y = H + m; }
    else { x = -m; y = rnd(20, H - 20); }

    const sm = Math.min(1.9, 1 + (S.wave - 1) * 0.06);

    const e = {
      type, x, y,
      r: cfg.r, hp: cfg.hp, maxHp: cfg.hp,
      speed: cfg.speed * sm,
      color: cfg.color, score: cfg.score,
      vx: 0, vy: 0, ang: 0, hitT: 0, t: rnd(0, 10),
      state: 'chase', stateT: rnd(0.6, 1.6),
      dashX: 1, dashY: 0, fireCd: rnd(0.8, 1.6),
      segCount: type === 'snake' ? 7 : 0,
      path: type === 'snake' ? [] : null,
      segs: type === 'snake' ? [] : null,
      stunT: 0, gen: 0,
      shield: type === 'shield' ? 4 : 0,
      maxShield: type === 'shield' ? 4 : 0,
      blinkCd: rnd(2.4, 3.6), bx: 0, by: 0,
      summonCd: rnd(1.6, 2.4),
      debuffs: newDebuffs(), satCd: 0, bounceMark: null, bladeHit: null
    };
    if (type === 'snake') e.ang = Math.atan2(player.y - y, player.x - x);
    enemies.push(e);

    for (let i = 0; i < (type === 'snake' ? 16 : 8); i++) {
      const a = rnd(0, TAU);
      const sp = rnd(20, 90);
      pushPart({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.45, max: 0.45, color: cfg.color, size: rnd(1, 2.2), drag: 2
      });
    }
  }

  function enemyShot(x, y, ang, speedScale) {
    if (ebullets.length > 240) return;
    const s = SHOT.aim;
    const sp = s.speed * (speedScale || 1);
    ebullets.push({
      kind: 'aim', x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      r: s.r, life: s.life, t: 0,
      color: s.color
    });
  }

  // 蛇身：沿头部走过的路径按固定间距采样
  function snakeSegments(e) {
    const out = e.segs || (e.segs = []);
    let count = 0;
    const spacing = 15;
    const path = e.path || [];
    let need = spacing;
    let acc = 0;
    let prevX = e.x, prevY = e.y;

    for (let i = 0; i < path.length && count < e.segCount; i++) {
      const pt = path[i];
      const dx = pt.x - prevX;
      const dy = pt.y - prevY;
      const segLen = hyp(dx, dy);
      if (segLen > 0.0001) {
        while (acc + segLen >= need && count < e.segCount) {
          const t = (need - acc) / segLen;
          let s = out[count];
          if (!s) { s = { x: 0, y: 0, r: 0 }; out[count] = s; }
          s.x = prevX + dx * t;
          s.y = prevY + dy * t;
          s.r = Math.max(6, e.r * 0.72 - count * 0.85);
          count++;
          need += spacing;
        }
      }
      acc += segLen;
      prevX = pt.x;
      prevY = pt.y;
    }
    out.length = count;
    return out;
  }

  // ---------------------------------------------------------------- boss
  // 蛇王：一整圈环绕场景的巨蛇，每节独立血量、独立开火
  function startBoss() {
    // 清掉小怪；Boss 期间不再刷怪
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      burst(e.x, e.y, 10, e.color, 220, 0.5, 2.2);
      enemies.splice(i, 1);
    }
    ebullets.length = 0;
    clearScorePickups();
    S.mines.length = 0;

    const per = Math.PI * (3 * (W / 2 - 78 + H / 2 - 78) -
      Math.sqrt((3 * (W / 2 - 78) + (H / 2 - 78)) * ((W / 2 - 78) + 3 * (H / 2 - 78))));
    const count = clamp(Math.round(per / 140), 16, 30);

    boss = {
      cx: W / 2,
      cy: H / 2,
      rx: Math.max(160, W / 2 - 78),
      ry: Math.max(160, H / 2 - 78),
      ang: -Math.PI / 2,
      speed: 0.24,
      t: 0,
      count: count,
      parts: [],
      maxTotal: 0
    };

    const headHp = 160;
    const bodyHp = 80;
    for (let i = 0; i < count; i++) {
      const isHead = i === 0;
      boss.parts.push({
        index: i,
        head: isHead,
        x: boss.cx,
        y: boss.cy,
        ang: 0,
        r: isHead ? 27 : 20,
        hp: isHead ? headHp : bodyHp,
        maxHp: isHead ? headHp : bodyHp,
        cd: isHead ? 1.6 : rnd(1.5, 6),
        hitT: 0
      });
      boss.maxTotal += isHead ? headHp : bodyHp;
    }

    S.bossActive = true;
    S.bossType = 'snake';
    S.snakeBossMax = boss.maxTotal;
    S.banner = '蛇王降临';
    S.bannerT = 3.4;
    S.shake = 18;
    S.flash = 0.9;
    SFX.boss();
    updateBoss(0);
  }

  function bossShot(x, y, ang, speed) {
    if (ebullets.length > 260) return;
    const sp = speed || 245;
    ebullets.push({
      kind: 'aim', x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      r: 6, life: 6, t: 0,
      color: '#ff5a5a'
    });
  }

  function updateBoss(dt) {
    if (!S.bossActive) return;
    if (S.bossType === 'snake') updateSnakeBoss(dt);
    else if (S.bossType === 'twin') updateTwinBoss(dt);
    else if (S.bossType === 'spider') updateSpiderBoss(dt);
    else if (S.bossType === 'prism') updatePrismBoss(dt);
  }

  function updateSnakeBoss(dt) {
    if (!boss) return;

    boss.t += dt;
    boss.ang += boss.speed * dt;

    const step = TAU / boss.count;
    const p = player;

    for (let i = 0; i < boss.parts.length; i++) {
      const part = boss.parts[i];
      const a = boss.ang - i * step;
      const wobble = Math.sin(boss.t * 1.8 - i * 0.42) * 12;
      const rx = boss.rx + wobble;
      const ry = boss.ry + wobble;

      part.x = boss.cx + Math.cos(a) * rx;
      part.y = boss.cy + Math.sin(a) * ry;
      part.ang = Math.atan2(Math.cos(a) * ry, -Math.sin(a) * rx);
      part.hitT = Math.max(0, part.hitT - dt);

      if (part.hp <= 0) continue;

      part.cd -= dt;
      if (part.cd <= 0) {
        const base = Math.atan2(p.y - part.y, p.x - part.x);
        if (part.head) {
          part.cd = rnd(1.7, 2.4);
          for (let k = -1; k <= 1; k++) bossShot(part.x, part.y, base + k * 0.18);
        } else {
          part.cd = rnd(3.6, 6.4);
          bossShot(part.x, part.y, base + rnd(-0.09, 0.09));
        }
      }

      // 贴身会受伤
      if (p.inv <= 0 && hyp(p.x - part.x, p.y - part.y) < p.r + part.r * 0.8) {
        hurtPlayer(1);
      }
    }

    checkBossDeath();
  }

  function damageBossPart(part, dmg, x, y) {
    if (!part || part.hp <= 0) return;
    // 身体减伤 50%，头部正常承伤
    const applied = dmg * (part.head ? 1 : 0.5);
    part.hp = Math.max(0, part.hp - applied);
    part.hitT = 0.12;
    if (bossFxOk()) burst(x, y, part.head ? 8 : 5, part.head ? COL.orange : COL.pink, 160, 0.35, 2.2);
    if (hitSoundOk()) SFX.hit();

    if (part.hp <= 0) {
      part.cd = Infinity;
      burst(x, y, 22, COL.orange, 310, 0.8, 2.6);
      S.shake = Math.min(14, S.shake + 3);
      SFX.boom();
    }
  }

  function checkBossDeath() {
    if (!boss) return;
    for (let i = 0; i < boss.parts.length; i++) {
      if (boss.parts[i].hp > 0) return;
    }
    defeatBoss();
  }

  function defeatBoss() {
    const bonus = Math.round(1200 * comboMult());
    bossDeathVFX('snake', W / 2, H / 2, COL.orange);
    for (let i = 0; i < boss.parts.length; i++) {
      const part = boss.parts[i];
      burst(part.x, part.y, 12, part.head ? COL.orange : COL.pink, 260, 0.9, 2.6);
    }
    S.score += bonus;
    texts.push({
      x: W / 2, y: H * 0.45, vy: -30, life: 1.8, max: 1.8,
      str: '+' + bonus, color: COL.gold
    });
    player.hp = Math.min(player.maxHp, player.hp + 1);

    S.shake = 22;
    S.flash = 1.2;
    S.banner = '蛇王已被击杀';
    S.bannerT = 3;
    SFX.die();

    boss = null;
    S.bossActive = false;
    S.bossType = null;
    S.bossDone = true;
    S.wave = 6;
    S.waveT = 0;
    spawnTimer = 2.5;
    afterBossKill('snake', bonus);
  }

  function bossHp() {
    let sum = 0;
    if (S.bossType === 'snake' && boss) {
      for (let i = 0; i < boss.parts.length; i++) sum += Math.max(0, boss.parts[i].hp);
    } else if (S.bossType === 'twin' && twinBoss) {
      for (let i = 0; i < twinBoss.spheres.length; i++) sum += Math.max(0, twinBoss.spheres[i].hp);
    } else if (S.bossType === 'spider' && spiderBoss) {
      sum = Math.max(0, spiderBoss.hp);
    } else if (S.bossType === 'prism' && prismBoss) {
      sum = Math.max(0, prismBoss.hp);
    }
    return sum;
  }

  function bossMaxHp() {
    if (S.bossType === 'snake' && boss) return boss.maxTotal;
    if (S.bossType === 'twin' && twinBoss) {
      let s = 0;
      for (let i = 0; i < twinBoss.spheres.length; i++) s += twinBoss.spheres[i].maxHp;
      return s;
    }
    if (S.bossType === 'spider' && spiderBoss) return spiderBoss.maxHp;
    if (S.bossType === 'prism' && prismBoss) return prismBoss.maxHp;
    return 1;
  }

  // ---------------------------------------------------------------- 双子球王（第 10 波）
  function startTwinBoss() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];

    S.mines.length = 0;

    // 双子球：蛇王总血量 ×4

    twinBoss = {
      t: 0,
      spheres: [
        {
          kind: 'charger',
          x: W * 0.3, y: H * 0.5, vx: 0, vy: 0, ang: 0,

        }

    };
