        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * TAU + e.t * 0.5;
          ctx.moveTo(Math.cos(a) * e.r * 0.8, Math.sin(a) * e.r * 0.8);
          ctx.lineTo(Math.cos(a) * e.r * 1.5, Math.sin(a) * e.r * 1.5);
        }
        ctx.stroke();
        ctx.fillStyle = fuse
          ? 'rgba(255,150,90,' + (0.45 + 0.4 * Math.sin(S.t * 34)) + ')'
          : 'rgba(255,122,92,0.35)';
        ctx.beginPath();
        ctx.arc(0, 0, e.r * 0.55, 0, TAU);
        ctx.fill();
      } else if (e.type === 'splitter' || e.type === 'splitling') {
        const sides = e.gen ? 4 : 6;
        ctx.beginPath();
        for (let k = 0; k < sides; k++) {
          const a = (k / sides) * TAU + e.t * 0.6;
          const px = Math.cos(a) * e.r;
          const py = Math.sin(a) * e.r;
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.arc(0, 0, e.r * 0.34, 0, TAU);
        ctx.fill();
      } else if (e.type === 'shield') {
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, TAU);
        ctx.fill();
        ctx.stroke();
        if (e.shield > 0) {
          ctx.strokeStyle = '#8fe8ff';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(0, 0, e.r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * (e.shield / e.maxShield));
          ctx.stroke();
        }
      } else if (e.type === 'teleporter') {
        ctx.beginPath();
        ctx.moveTo(e.r, 0);
        ctx.lineTo(0, e.r * 0.9);
        ctx.lineTo(-e.r, 0);
        ctx.lineTo(0, -e.r * 0.9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        if (e.state === 'blink') {
          ctx.globalAlpha = 0.35 + 0.35 * Math.sin(S.t * 24);
          ctx.beginPath();
          ctx.arc(0, 0, e.r * 1.7, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else if (e.type === 'summoner') {
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * TAU + e.t * 0.35;
          const px = Math.cos(a) * e.r;
          const py = Math.sin(a) * e.r;
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = 'rgba(200,255,220,0.8)';
        ctx.lineWidth = 1.4;
        for (let k = 0; k < 3; k++) {
          const a = e.t * 1.8 + (k / 3) * TAU;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * (e.r + 8), Math.sin(a) * (e.r + 8), 2.4, 0, TAU);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    ctx.restore();
  }

  function drawBullets() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      const col = b.shard ? COL.gold : b.heavy ? COL.orange : COL.cyan;
      const len = b.shard ? 5 : b.heavy ? 11 : 8;

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.ang);

      // 用两层线代替 shadowBlur，省掉每发子弹的模糊
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = b.heavy ? 10 : 7;
      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.lineTo(len, 0);
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.strokeStyle = b.shard ? 'rgba(255,233,168,0.9)' : b.heavy ? '#fff1d6' : '#d9ffff';
      ctx.lineWidth = b.shard ? 2 : b.heavy ? 4.5 : 3;
      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.lineTo(len, 0);
      ctx.stroke();

      if (b.homing) {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = COL.cyan;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawEnemyBullets() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 弹幕密集时关掉逐发辉光，否则 200+ 个 shadowBlur 会把手机拖垮
    const heavy = ebullets.length > 80;
    for (let i = 0; i < ebullets.length; i++) {
      const b = ebullets[i];
      const col = b.color || COL.violet;
      ctx.shadowColor = col;
      ctx.shadowBlur = (glowMul && !heavy) ? 15 : 0;
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,255,0.9)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 2.2, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawPickups() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < picks.length; i++) {
      const k = picks[i];
      const col = k.kind === 'heal' ? COL.pink : COL.cyan;
      const pulse = 1 + 0.12 * Math.sin(k.t * 6);
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(k.t * 2.2);
      ctx.shadowColor = col;
      ctx.shadowBlur = glowMul ? 18 : 0;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -k.r * pulse);
      ctx.lineTo(k.r * pulse, 0);
      ctx.lineTo(0, k.r * pulse);
      ctx.lineTo(-k.r * pulse, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = k.kind === 'heal' ? 'rgba(255,95,143,0.5)' : 'rgba(111,246,255,0.4)';
      ctx.beginPath();
      ctx.arc(0, 0, 3.2, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < parts.length; i++) {
      const q = parts[i];
      ctx.globalAlpha = Math.pow(Math.max(0, q.life / q.max), 0.7);
      ctx.fillStyle = q.color;
      const d = q.size * 2;
      ctx.fillRect(q.x - q.size, q.y - q.size, d, d);
    }
    ctx.restore();
  }

  function drawTexts() {
    if (!texts.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < texts.length; i++) {
      const t = texts[i];
      ctx.globalAlpha = Math.max(0, t.life / t.max);
      ctx.font = font(15, 700);
      ctx.fillStyle = t.color;
      ctx.shadowColor = t.color;
      ctx.shadowBlur = glowMul ? 10 : 0;
      ctx.fillText(t.str, t.x, t.y);
    }
    ctx.restore();
  }

  function drawHeart(x, y, s, on) {
    ctx.save();
    ctx.translate(x, y);
    const k = s / 10;
    ctx.scale(k, k);
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-11, -1, -8, -9, 0, -4);
    ctx.bezierCurveTo(8, -9, 11, -1, 0, 8);
    ctx.closePath();
    if (on) {
      ctx.shadowColor = COL.pink;
      ctx.shadowBlur = glowMul ? 14 : 0;
      ctx.fillStyle = COL.pink;
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,95,143,0.32)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- 技能弹窗
  // 图标一律用 Canvas 几何图形绘制：emoji 在 Windows / Android / iOS 上字形差异太大
  const SKILL_CATEGORY = {
    homing: '弹头', split: '弹头', explode: '弹头', pierce: '弹头',
    spread: '弹头', rapid: '弹头', heavy: '弹头',
    chain: '弹头', ricochet: '弹头', crit: '弹头', boomerang: '弹头', burn: '弹头',
    orbital: '辅助', mine: '辅助', slowfield: '辅助', shieldregen: '辅助', dashcd: '辅助',
    magnet: '辅助', marker: '辅助', combo: '辅助',
    nova: '强力', bolt: '强力', phase: '强力', frost: '强力',
    cluster: '进化', rail: '进化', swarm: '进化',
    arcstorm: '进化', magma: '进化', gravity: '进化'
  };

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // y 传入的是文字垂直中心：基线用 alphabetic，再补 0.35 字高，跨平台更稳
  function uiText(g, str, x, y, size, weight, color, align) {
    g.font = font(size, weight);
    g.fillStyle = color;
    g.textAlign = align || 'center';
    g.textBaseline = 'alphabetic';
    g.fillText(str, x, y + size * 0.35);
  }

  function drawGlyphOn(g, id, x, y, r, color) {
    g.save();
    g.translate(x, y);
    g.strokeStyle = color;
    g.fillStyle = color;
    g.lineWidth = Math.max(1.2, r * 0.14);
    g.lineCap = 'round';
    g.lineJoin = 'round';

    if (id === 'homing') {
      g.beginPath(); g.arc(0, 0, r * 0.8, 0, TAU); g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.24, 0, TAU); g.fill();
      g.beginPath();
      g.moveTo(r * 0.96, -r * 0.6);
      g.lineTo(r * 0.6, -r * 0.34);
      g.moveTo(r * 0.96, -r * 0.6);
      g.lineTo(r * 0.66, -r * 0.9);
      g.stroke();
    } else if (id === 'split') {
      g.beginPath(); g.arc(-r * 0.34, -r * 0.32, r * 0.38, 0, TAU); g.stroke();
      g.beginPath(); g.arc(r * 0.46, -r * 0.1, r * 0.2, 0, TAU); g.fill();
      g.beginPath(); g.arc(r * 0.18, r * 0.52, r * 0.15, 0, TAU); g.fill();
    } else if (id === 'explode') {
      g.beginPath(); g.arc(0, 0, r * 0.26, 0, TAU); g.fill();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        g.beginPath();
        g.moveTo(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42);
        g.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
        g.stroke();
      }
    } else if (id === 'pierce') {
      g.beginPath();
      g.moveTo(-r * 0.92, -r * 0.62); g.lineTo(-r * 0.2, 0); g.lineTo(-r * 0.92, r * 0.62);
      g.moveTo(-r * 0.34, -r * 0.62); g.lineTo(r * 0.38, 0); g.lineTo(-r * 0.34, r * 0.62);
      g.stroke();
      g.beginPath(); g.arc(r * 0.74, 0, r * 0.16, 0, TAU); g.fill();
    } else if (id === 'spread') {
      for (let i = -1; i <= 1; i++) {
        const a = -Math.PI / 2 + i * 0.52;
        const ex = Math.cos(a) * r * 1.02;
        const ey = Math.sin(a) * r * 1.02;
        g.beginPath();
        g.moveTo(0, r * 0.74);
        g.lineTo(ex, ey);
        g.stroke();
        g.beginPath(); g.arc(ex, ey, r * 0.13, 0, TAU); g.fill();
      }
    } else if (id === 'rapid') {
      g.beginPath();
      g.moveTo(-r * 0.5, -r * 0.92);
      g.lineTo(r * 0.18, -r * 0.16);
      g.lineTo(-r * 0.12, r * 0.04);
      g.lineTo(r * 0.52, r * 0.92);
      g.stroke();
      g.lineWidth = Math.max(1, r * 0.1);
      g.beginPath();
      g.moveTo(-r * 0.98, -r * 0.4); g.lineTo(-r * 0.66, -r * 0.4);
      g.moveTo(-r * 0.98, r * 0.4); g.lineTo(-r * 0.66, r * 0.4);
      g.stroke();
    } else if (id === 'heavy') {
      g.beginPath(); g.arc(0, 0, r * 0.5, 0, TAU); g.fill();
      g.beginPath(); g.arc(0, 0, r * 0.9, 0, TAU); g.stroke();
      g.beginPath();
      g.moveTo(-r * 1.02, 0); g.lineTo(-r * 0.78, 0);
      g.moveTo(r * 0.78, 0); g.lineTo(r * 1.02, 0);
      g.stroke();
    } else if (id === 'magnet') {
      g.beginPath();
      g.arc(0, -r * 0.1, r * 0.66, Math.PI * 0.16, Math.PI * 1.84);
      g.stroke();
      g.fillRect(-r * 0.84, r * 0.42, r * 0.3, r * 0.42);
      g.fillRect(r * 0.54, r * 0.42, r * 0.3, r * 0.42);
    } else if (id === 'marker') {
      g.beginPath(); g.arc(0, 0, r * 0.54, 0, TAU); g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.12, 0, TAU); g.fill();
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        g.beginPath();
        g.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
        g.lineTo(Math.cos(a) * r * 1.04, Math.sin(a) * r * 1.04);
        g.stroke();
      }
    } else if (id === 'combo') {
      g.beginPath(); g.arc(0, 0, r * 0.78, 0, TAU); g.stroke();
      g.beginPath();
      g.moveTo(0, 0); g.lineTo(0, -r * 0.46);
      g.moveTo(0, 0); g.lineTo(r * 0.38, r * 0.12);
      g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.1, 0, TAU); g.fill();
    } else if (id === 'nova') {
      g.beginPath(); g.arc(0, 0, r * 0.4, 0, TAU); g.fill();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU + Math.PI / 8;
        g.beginPath();
        g.moveTo(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6);
        g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        g.stroke();
      }
    } else if (id === 'bolt' || id === 'chain') {
      g.beginPath();
      g.moveTo(-r * 0.75, -r * 0.85);
      g.lineTo(-r * 0.1, -r * 0.15);
      g.lineTo(-r * 0.4, r * 0.1);
      g.lineTo(r * 0.2, r * 0.75);
      g.stroke();
      g.beginPath(); g.arc(-r * 0.75, -r * 0.85, r * 0.14, 0, TAU); g.fill();
      g.beginPath(); g.arc(r * 0.2, r * 0.75, r * 0.14, 0, TAU); g.fill();
    } else if (id === 'phase') {
      g.beginPath();
      g.moveTo(0, -r * 0.86); g.lineTo(r * 0.86, 0);
      g.lineTo(0, r * 0.86); g.lineTo(-r * 0.86, 0);
      g.closePath(); g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.22, 0, TAU); g.fill();
    } else if (id === 'frost') {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI;
        g.beginPath();
        g.moveTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
        g.lineTo(-Math.cos(a) * r * 0.95, -Math.sin(a) * r * 0.95);
        g.stroke();
      }
      g.beginPath(); g.arc(0, 0, r * 0.18, 0, TAU); g.fill();
    } else if (id === 'cluster') {
      // 三颗集束 + 落点冲击
      g.beginPath(); g.arc(-r * 0.32, -r * 0.36, r * 0.26, 0, TAU); g.stroke();
      g.beginPath(); g.arc(r * 0.36, -r * 0.28, r * 0.2, 0, TAU); g.fill();
      g.beginPath(); g.arc(0, r * 0.36, r * 0.22, 0, TAU); g.fill();
      for (let i = 0; i < 3; i++) {
        const a = Math.PI * 0.15 + i * 0.28;
        g.beginPath();
        g.moveTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.72);
        g.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 1.02);
        g.stroke();
      }
    } else if (id === 'rail') {
      // 破甲：箭头穿过被击碎的护盾环
      g.beginPath();
      g.moveTo(-r * 0.95, 0);
      g.lineTo(r * 0.9, 0);
      g.moveTo(r * 0.5, -r * 0.34);
      g.lineTo(r * 0.94, 0);
      g.lineTo(r * 0.5, r * 0.34);
      g.stroke();
      g.beginPath();
      g.arc(0, 0, r * 0.62, Math.PI * 0.68, Math.PI * 0.32, true);
      g.stroke();
      g.beginPath();
      g.arc(0, 0, r * 0.62, -Math.PI * 0.32, -Math.PI * 0.68, true);
      g.stroke();
    } else if (id === 'swarm') {
      // 蜂群：一发子弹分成多路
      g.beginPath(); g.arc(0, r * 0.55, r * 0.2, 0, TAU); g.fill();
      for (let i = -2; i <= 2; i++) {
        const px = i * r * 0.36;
        const py = -r * 0.55 + Math.abs(i) * r * 0.12;
        g.beginPath(); g.arc(px, py, r * 0.13, 0, TAU); g.fill();
        g.beginPath();
        g.moveTo(0, r * 0.4);
        g.lineTo(px, py + r * 0.16);
        g.stroke();
      }
    } else if (id === 'ricochet') {
      g.beginPath();
      g.moveTo(-r * 0.9, r * 0.75);
      g.lineTo(r * 0.15, -r * 0.1);
      g.lineTo(r * 0.85, r * 0.72);
      g.stroke();
      g.beginPath();
      g.moveTo(r * 0.15, -r * 0.1);
      g.lineTo(r * 0.05, -r * 0.5);
      g.moveTo(r * 0.15, -r * 0.1);
      g.lineTo(r * 0.55, -r * 0.18);
      g.stroke();
      g.beginPath(); g.arc(r * 0.9, r * 0.82, r * 0.12, 0, TAU); g.fill();
    } else if (id === 'crit') {
      g.beginPath();
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * TAU - Math.PI / 2;
        const rr = i % 2 === 0 ? r : r * 0.42;
        if (i === 0) g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath(); g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.16, 0, TAU); g.fill();
    } else if (id === 'boomerang') {
      g.beginPath();
      g.arc(0, r * 0.2, r * 0.85, Math.PI * 1.15, Math.PI * 1.85);
      g.stroke();
      g.beginPath();
      g.moveTo(-r * 0.85, -r * 0.5); g.lineTo(-r * 0.45, -r * 0.5);
      g.moveTo(-r * 0.95, -r * 0.15); g.lineTo(-r * 0.55, -r * 0.15);
      g.stroke();
    } else if (id === 'orbital') {
      g.beginPath(); g.arc(0, 0, r * 0.42, 0, TAU); g.fill();
      g.beginPath();
      g.ellipse(0, 0, r * 1.02, r * 0.42, -0.5, 0, TAU);
      g.stroke();
      g.beginPath(); g.arc(r * 0.72, -r * 0.62, r * 0.14, 0, TAU); g.fill();
    } else if (id === 'mine') {
      g.beginPath(); g.arc(0, 0, r * 0.48, 0, TAU); g.stroke();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        g.beginPath();
        g.moveTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62);
        g.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
        g.stroke();
      }
      g.beginPath(); g.arc(0, 0, r * 0.14, 0, TAU); g.fill();
    } else if (id === 'slowfield') {
      for (let i = 0; i < 3; i++) {
        g.beginPath();
        g.arc(0, 0, r * (0.38 + i * 0.27), Math.PI * 1.1, Math.PI * 1.9);
        g.stroke();
      }
      g.beginPath();
      g.moveTo(-r * 0.22, r * 0.5); g.lineTo(0, r * 0.78); g.lineTo(r * 0.22, r * 0.5);
      g.stroke();
    } else if (id === 'shieldregen') {
      g.beginPath();
      g.moveTo(0, -r * 0.92);
      g.lineTo(r * 0.75, -r * 0.55);
      g.lineTo(r * 0.62, r * 0.25);
      g.lineTo(0, r * 0.92);
      g.lineTo(-r * 0.62, r * 0.25);
      g.lineTo(-r * 0.75, -r * 0.55);
      g.closePath();
      g.stroke();
      g.beginPath();
      g.moveTo(-r * 0.3, 0); g.lineTo(r * 0.3, 0);
      g.moveTo(0, -r * 0.3); g.lineTo(0, r * 0.3);
      g.stroke();
    } else if (id === 'dashcd') {
      g.beginPath();
      g.moveTo(-r * 0.85, -r * 0.7); g.lineTo(-r * 0.25, 0); g.lineTo(-r * 0.85, r * 0.7);
      g.moveTo(-r * 0.15, -r * 0.7); g.lineTo(r * 0.45, 0); g.lineTo(-r * 0.15, r * 0.7);
      g.stroke();
      g.beginPath(); g.arc(r * 0.55, 0, r * 0.34, -Math.PI * 0.4, Math.PI * 0.9); g.stroke();
    } else if (id === 'burn') {
      g.beginPath();
      g.moveTo(0, -r * 0.95);
      g.quadraticCurveTo(r * 0.75, -r * 0.1, r * 0.35, r * 0.6);
      g.quadraticCurveTo(0, r * 0.95, -r * 0.35, r * 0.6);
      g.quadraticCurveTo(-r * 0.75, -r * 0.1, 0, -r * 0.95);
      g.stroke();
      g.beginPath(); g.arc(0, r * 0.3, r * 0.2, 0, TAU); g.fill();
    } else if (id === 'arcstorm') {
      g.beginPath();
      g.moveTo(-r * 0.6, -r * 0.9);
      g.lineTo(-r * 0.05, -r * 0.2);
      g.lineTo(-r * 0.35, r * 0.05);
      g.lineTo(r * 0.25, r * 0.7);
      g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.95, 0, TAU); g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.55, Math.PI * 0.2, Math.PI * 1.1); g.stroke();
    } else if (id === 'magma') {
      g.beginPath();
      g.moveTo(0, -r * 0.9);
      g.lineTo(r * 0.8, 0);
      g.lineTo(0, r * 0.9);
      g.lineTo(-r * 0.8, 0);
      g.closePath(); g.stroke();
      g.beginPath();
      g.moveTo(-r * 0.35, r * 0.1); g.lineTo(0, -r * 0.2); g.lineTo(r * 0.35, r * 0.35);
      g.stroke();
      g.beginPath(); g.arc(0, r * 0.35, r * 0.14, 0, TAU); g.fill();
    } else if (id === 'gravity') {
      g.beginPath(); g.arc(0, 0, r * 0.85, 0, TAU); g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.42, 0, TAU); g.stroke();
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * TAU + Math.PI / 4;
        const x1 = Math.cos(a) * r * 0.92;
        const y1 = Math.sin(a) * r * 0.92;
        const x2 = Math.cos(a) * r * 0.55;
        const y2 = Math.sin(a) * r * 0.55;
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
        g.moveTo(x2, y2);
        g.lineTo(x2 - Math.cos(a + 0.5) * r * 0.2, y2 - Math.sin(a + 0.5) * r * 0.2);
        g.stroke();
      }
      g.beginPath(); g.arc(0, 0, r * 0.14, 0, TAU); g.fill();
    }
    g.restore();
  }

  // 折行：超过行数上限时末行加省略号
  function wrapLines(g, text, maxW, maxLines) {
    // 英文/数字连成一词，避免 "+60px" 被从中间拆开
    const tokens = [];
    let buf = '';
    for (let i = 0; i < text.length; i++) {
      const ch = text.charAt(i);
      if (/[A-Za-z0-9+%]/.test(ch)) {
        buf += ch;
      } else {
        if (buf) { tokens.push(buf); buf = ''; }
        tokens.push(ch);
      }
    }
    if (buf) tokens.push(buf);

    const lines = [];
    let line = '';
    for (let i = 0; i < tokens.length; i++) {
      const test = line + tokens[i];
      if (g.measureText(test).width > maxW && line) {
        lines.push(line);
        line = tokens[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    // 行数没超上限时再按平均宽度排一次，避免末行只剩一两个字
    if (lines.length > 1 && lines.length <= maxLines) {
      const target = Math.min(maxW, g.measureText(text).width / lines.length * 1.06);
      const bal = [];
      line = '';
      for (let i = 0; i < tokens.length; i++) {
        const test = line + tokens[i];
        if (g.measureText(test).width > target && line) {
          bal.push(line);
          line = tokens[i];
        } else {
          line = test;
        }
      }
      if (line) bal.push(line);
      if (bal.length === lines.length) {
        lines.length = 0;
        for (let i = 0; i < bal.length; i++) lines.push(bal[i]);
      }
    }
    if (lines.length > maxLines) {
      lines.length = maxLines;
      let last = lines[maxLines - 1];
      while (last.length > 1 && g.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      lines[maxLines - 1] = last + '…';
    }
    // 中文标点不能落在行首
    const noLead = '，。；、！？：）】」…';
    for (let i = 1; i < lines.length; i++) {
      while (lines[i] && noLead.indexOf(lines[i][0]) >= 0) {
        lines[i - 1] += lines[i][0];
        lines[i] = lines[i].slice(1);
      }
    }
    return lines;
  }

  // ---------------------------------------------------------------- 卡片离屏缓存
  const CARD_PAD = 12;
  let cardCache = null;

  function cardSignature() {
    let sig = Math.round(W) + 'x' + Math.round(H) + 'x' + DPR + 'x' + S.skillChoices.length;
    for (let i = 0; i < S.skillChoices.length; i++) {
      const c = S.skillChoices[i];
      sig += '|' + c.skill.id + ':' + c.nextLevel;
    }
    return sig;
  }

  function buildCardCanvas(c, L) {
    const w = L.cardW, h = L.cardH;
    const cv = document.createElement('canvas');
    cv.width = Math.round((w + CARD_PAD * 2) * DPR);
    cv.height = Math.round((h + CARD_PAD * 2) * DPR);
    const g = cv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.translate(CARD_PAD, CARD_PAD);

    const s = c.skill;
    const col = RARITY_COLOR[s.rarity];

    const bg = g.createLinearGradient(0, h * 0.3, 0, h);
    bg.addColorStop(0, 'rgba(9,14,28,0.97)');
    bg.addColorStop(1, s.rarity === 'epic' ? 'rgba(255,207,77,0.10)'
      : s.rarity === 'evolve' ? 'rgba(255,179,71,0.14)'
        : s.rarity === 'rare' ? 'rgba(197,139,255,0.06)' : 'rgba(143,216,255,0.05)');
    roundRect(g, 0, 0, w, h, 10);
    g.fillStyle = bg;
    g.fill();
    g.strokeStyle = s.rarity === 'common' ? 'rgba(143,216,255,0.45)' : col;
    g.lineWidth = 1.5;
    g.stroke();

    uiText(g, SKILL_CATEGORY[s.id] || '', 11, 16, 12, 600, 'rgba(185,210,240,0.45)', 'left');

    // 图标占据卡片上部；矮卡片（横屏手机）收紧间距，把空间留给描述
    const compact = h < 175;
    const k = clamp((h - 150) / 110, 0, 1);
    const iconY = h * (compact ? 0.2 : 0.235 + 0.06 * k);
    const iconR = Math.min(w * (compact ? 0.18 : 0.22), h * (compact ? 0.105 : 0.13));
    drawGlyphOn(g, s.glyph || s.id, w / 2, iconY, iconR, col);

    const nameY = iconY + iconR + (compact ? 10 : 12 + 8 * k);
    uiText(g, s.name, w / 2, nameY, compact ? 17 : 18, 800, '#eef7ff');

    const cur = c.nextLevel - 1;
    const lvText = s.isEvo
      ? (c.pity ? '保底进化 · 一次性' : '进化 · 一次性')
      : (cur > 0
        ? 'Lv.' + cur + ' → ' + c.nextLevel + ' / ' + s.maxLevel
        : '新技能 · Lv.' + c.nextLevel + ' / ' + s.maxLevel);
    const lvY = nameY + (compact ? 14 : 15 + 4 * k);
    uiText(g, lvText, w / 2, lvY, 12, 600, col);

    const descTop = lvY + (compact ? 8 : 13 + 6 * k);
    const rarityY = h - 12;
    const lineH = 18.5;
    const maxLines = Math.max(1, Math.min(3, Math.floor((rarityY - 10 - descTop) / lineH)));
    g.font = font(13, 400);
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    const lines = wrapLines(g, s.desc, w - 24, maxLines);
    g.fillStyle = 'rgba(196,216,242,0.72)';
    for (let i = 0; i < lines.length; i++) {
      g.fillText(lines[i], w / 2, descTop + i * lineH + lineH * 0.5 + 13 * 0.35);
    }

    uiText(g, RARITY_NAME[s.rarity], w / 2, rarityY, 11, 600,
      s.rarity === 'common' ? 'rgba(143,216,255,0.7)' : col);

    return cv;
  }

  function ensureCardCache(L) {
    const key = cardSignature() + '|' + Math.round(L.cardW) + 'x' + Math.round(L.cardH);
    if (cardCache && cardCache.key === key) return cardCache;
    const items = [];
    for (let i = 0; i < S.skillChoices.length; i++) {
      items.push(buildCardCanvas(S.skillChoices[i], L));
    }
    cardCache = { key: key, items: items };
    return cardCache;
  }

  function resetSkillModal() {
    S.skillSelected = 0;
    S.skillT = 0;
    S.skillAnim = 'in';
    S.skillConfirmI = -1;
    S.skillConfirmT = 0;
    S.skillHover = -1;
    S.skillPress = -1;
    // 上一张弹窗如果用过键盘，别把「键盘焦点」带进新弹窗，否则第一帧就画出焦点框
    S.skillFocusKey = false;
    S._skillCardRects = [];
    cardCache = null;
  }

  function cardIndexAt(rects, px, py, pad) {
    const ex = pad || 0;
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      if (px >= r.x - ex && px <= r.x + r.w + ex && py >= r.y - ex && py <= r.y + r.h + ex) {
        return i;
      }
    }
    return -1;
  }

  function skillSelectLayout() {
    const n = Math.max(1, S.skillChoices.length);
    // W < 700 一律 2×2，手机不做四横排；
    // 但矮横屏（高度不够放两行）必须退回单排，否则卡片会顶出屏幕
    const shortScreen = H < 480;
    const narrow = (W < 700 && !shortScreen) || (shortScreen && W < 520);
    const cols = narrow ? 2 : Math.min(n, 4);
    const rows = Math.ceil(n / cols);
    const gap = narrow ? 14 : 18;

    // 垂直分区：顶部 8% / 标题 12% / 卡片 60% / 提示 10% / 底部 10%
    // 矮屏（横屏手机）优先保证标题不被卡片压住
    const titleY = Math.max(30, H * 0.14);
    const bandTop = titleY + 48;
    const hintY = Math.max(bandTop + 90, Math.min(H - 22, H * 0.86));
    const bandH = Math.max(120, hintY - 18 - bandTop);

    const maxByW = narrow ? (W - 72) / 2.2 : (W - 80) / 4.5;
    let cardW = Math.min(200, maxByW);
    const availH = (bandH - gap * (rows - 1)) / rows;
    if (cardW * 1.3 > availH) cardW = availH / 1.3;
    cardW = Math.max(92, cardW);
    const cardH = cardW * 1.3;

    const totalH = cardH * rows + gap * (rows - 1);
    const y0 = bandTop + Math.max(0, (bandH - totalH) / 2);
    const rects = [];
    for (let i = 0; i < n; i++) {
      const colIdx = i % cols;
      const row = Math.floor(i / cols);
      // 最后一行不满时居中，三选一不会空出一整格
      const inRow = Math.min(cols, n - row * cols);
      const rowW = inRow * cardW + (inRow - 1) * gap;
      const rowX = (W - rowW) / 2;
      rects.push({
        x: rowX + colIdx * (cardW + gap),
        y: y0 + row * (cardH + gap),
        w: cardW, h: cardH, i: i
      });
    }
    return {
      rects: rects, cardW: cardW, cardH: cardH, gap: gap,
      cols: cols, rows: rows, narrow: narrow,
      titleY: titleY, hintY: hintY
    };
  }

  function drawHexPath(g, cx, cy, r) {
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + i * (TAU / 6);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.closePath();
  }

  // 稀有度的形状编码：rare/epic 四角小菱形，epic 加圆角外环；
  // 进化单独用金色六边形 + 脉冲，和 epic 明确区分
  function drawCardMarks(g, w, h, rarity, col, t) {
    if (rarity === 'common') return;
    const breathe = 0.5 + 0.32 * Math.sin(t * 2.6);
    if (rarity === 'evolve') {
      // 右上角小六边形徽记：和 epic 的圆角外环明确区分，也不压住卡片正文
      g.save();
      g.translate(w / 2 - 14, -h / 2 + 14);
      g.globalAlpha = 0.4 + 0.45 * breathe;
      g.strokeStyle = col;
      g.lineWidth = 1.6;
      drawHexPath(g, 0, 0, 6.4);
      g.stroke();
      g.globalAlpha = 0.2 + 0.2 * breathe;
      g.beginPath();
      drawHexPath(g, 0, 0, 9.2 + 1.6 * breathe);
      g.stroke();
      g.restore();
      return;
    }
    const d = 4;
    g.globalAlpha = breathe;
    g.fillStyle = col;
    const xs = [-w / 2 - 3, w / 2 + 3];
    const ys = [-h / 2 - 3, h / 2 + 3];
    for (let i = 0; i < 2; i++) {
      for (let j = 0; j < 2; j++) {
        g.beginPath();
        g.moveTo(xs[i], ys[j] - d);
        g.lineTo(xs[i] + d, ys[j]);
        g.lineTo(xs[i], ys[j] + d);
        g.lineTo(xs[i] - d, ys[j]);
        g.closePath();
        g.fill();
      }
    }
    if (rarity === 'epic') {
      g.globalAlpha = breathe * 0.75;
      g.strokeStyle = col;
      g.lineWidth = 1.2;
      roundRect(g, -w / 2 - 6, -h / 2 - 6, w + 12, h + 12, 13);
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  // 悬停音效 4 张卡共用一次，50ms 内不重复
  let hoverSoundAt = 0;
  function hoverTick() {
    const now = performance.now();
    if (now - hoverSoundAt < 50) return;
    hoverSoundAt = now;
    if (SFX.hover) SFX.hover();
  }

  function drawSkillSelect() {
    const n = S.skillChoices.length;
    if (!n) return;
    const L = skillSelectLayout();
    S._skillCardRects = L.rects;
    const cache = ensureCardCache(L);
    const bossKind = S.skillSelectKind === 'boss';
    const confirm = S.skillAnim === 'confirm';
    const ct = S.skillConfirmT;

    let hover = -1;
    // 键盘操作期间锁住悬停，避免光标停在哪张卡上就把焦点拽回去
    if (!(touchMode || coarse) && mouse.known && !confirm && !S.skillFocusKey) {
      for (let i = 0; i < L.rects.length; i++) {
        const r = L.rects[i];
        if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
          hover = i;
          break;
        }
      }
    }
    if (hover !== S.skillHover) {
      S.skillHover = hover;
      if (hover >= 0) { S.skillFocusKey = false; hoverTick(); }
    }
    // 悬停即选中：始终只有一张卡带光晕
    if (hover >= 0 && hover !== S.skillSelected) S.skillSelected = hover;

    const exitFade = confirm ? easeOutCubic(clamp((ct - 0.24) / 0.12, 0, 1)) : 0;

    ctx.save();

    // 遮罩：0 → 86%，ease-out；战场本身按原亮度绘制，压暗只由这一层负责
    const maskA = 0.86 * easeOutCubic(clamp(S.skillT / 0.2, 0, 1));
    ctx.fillStyle = 'rgba(2,3,10,' + maskA + ')';
    ctx.fillRect(0, 0, W, H);

    // 标题下落 10px
    const tk = easeOutCubic(clamp((S.skillT - 0.05) / 0.25, 0, 1));
    ctx.globalAlpha = tk * (1 - exitFade);
    uiText(ctx, bossKind ? 'BOSS 奖励' : 'LEVEL UP', W / 2, L.titleY - 10 * (1 - tk), 28, 800, '#ffe9b0');
    uiText(ctx, bossKind ? '选择一项强力技能' : '选择一项技能强化', W / 2, L.titleY + 30, 13, 400, 'rgba(214,232,255,0.66)');
    ctx.globalAlpha = 1;

    for (let i = 0; i < n; i++) {
      const c = S.skillChoices[i];
      const s = c.skill;
      const r = L.rects[i];
      const col = RARITY_COLOR[s.rarity];
      const k = easeOutCubic(clamp((S.skillT - i * 0.05) / 0.26, 0, 1));

      let cx = r.x + r.w / 2;
      let cy = r.y + r.h / 2;
      let scale = 0.9 + 0.1 * k;
      let alpha = k;
      let dy = (1 - k) * 20;

      if (confirm) {
        if (i === S.skillConfirmI) {
          const mv = easeOutCubic(clamp((ct - 0.04) / 0.2, 0, 1));
          cx += (W / 2 - cx) * mv;
          cy += (H / 2 - cy) * mv;
          scale = 1 + 0.12 * mv;
          alpha = 1 - easeOutCubic(clamp((ct - 0.26) / 0.1, 0, 1));
        } else {
          const out = easeOutCubic(clamp(ct / 0.16, 0, 1));
          scale *= 1 - 0.15 * out;
          alpha *= 1 - out;
        }
      } else {
        if (i === S.skillHover) dy -= 4;
        if (i === S.skillPress) { dy += 2; scale *= 0.97; }
      }
      if (alpha <= 0.01) continue;

      const focused = !confirm && i === S.skillSelected;
      const dw = r.w + CARD_PAD * 2;
      const dh = r.h + CARD_PAD * 2;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy + dy);
      ctx.scale(scale, scale);
      ctx.drawImage(cache.items[i], -dw / 2, -dh / 2, dw, dh);

      drawCardMarks(ctx, r.w, r.h, s.rarity, col, S.skillT + i * 0.7);

      // 只有当前卡开 shadowBlur，避免同帧多次模糊
      if (focused) {
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        if (glowMul) { ctx.shadowColor = col; ctx.shadowBlur = glowMul ? 26 : 0; }
        roundRect(ctx, -r.w / 2, -r.h / 2, r.w, r.h, 10);
        ctx.stroke();
        ctx.shadowBlur = glowMul ? 0 : 0;
      }
      // 键盘焦点框：显式绘制，不依赖高亮
      if (focused && S.skillFocusKey && i === S.skillSelected) {
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        roundRect(ctx, -r.w / 2 - 7, -r.h / 2 - 7, r.w + 14, r.h + 14, 14);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      // epic 上升光点：以 skillT 为时间基准，无累加状态
      if (s.rarity === 'epic' || s.rarity === 'evolve') {
        for (let j = 0; j < 3; j++) {
          const ph = (S.skillT * 0.55 + j * 0.37) % 1;
          const px = (j - 1) * r.w * 0.26;
          const py = r.h / 2 - 14 - ph * r.h * 0.6;
          ctx.globalAlpha = alpha * 0.55 * (1 - ph);
          ctx.fillStyle = col;
          ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
        }
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // 确认：炸开圆环 → 闪白 → 淡出
    if (confirm) {
      const ci = S.skillConfirmI;
      if (ci >= 0 && ci < L.rects.length && ct < 0.24) {
        const kr = easeOutCubic(ct / 0.24);
        const rr = L.rects[ci];
        ctx.globalAlpha = 0.6 * (1 - kr);
        ctx.strokeStyle = RARITY_COLOR[S.skillChoices[ci].skill.rarity];
        ctx.lineWidth = 3 + 3 * (1 - kr);
        ctx.beginPath();
        ctx.arc(rr.x + rr.w / 2, rr.y + rr.h / 2, 18 + kr * Math.max(W, H) * 0.5, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      let flash = 0;
      if (ct >= 0.16 && ct < 0.26) flash = easeOutCubic((ct - 0.16) / 0.1);
      else if (ct >= 0.26) flash = Math.max(0, 1 - (ct - 0.26) / 0.1);
      if (flash > 0) {
        ctx.globalAlpha = flash * 0.3;
        ctx.fillStyle = '#eaf6ff';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
    }

    // 底部提示
    ctx.globalAlpha = easeOutCubic(clamp((S.skillT - 0.15) / 0.2, 0, 1)) * (1 - exitFade);
    uiText(ctx,
      (touchMode || coarse) ? '点选一张卡片'
        : (n > 1 ? '1-' + n + ' 选择 · 方向键移动 · 回车确认' : '回车确认'),
      W / 2, L.hintY, 11, 400, 'rgba(170,205,240,0.55)');
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    ctx.textBaseline = 'top';

    for (let i = 0; i < player.maxHp; i++) {
      drawHeart(34 + i * 30, 34, 10, i < player.hp);
    }

    // 护盾点
    for (let i = 0; i < player.shield; i++) {
      ctx.save();
      ctx.strokeStyle = 'rgba(111,246,255,0.9)';
      ctx.fillStyle = 'rgba(111,246,255,0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(34 + player.maxHp * 30 + 8 + i * 16, 34, 5.5, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    ctx.textAlign = 'right';
    ctx.font = font(26, 700);
    ctx.shadowColor = COL.cyan;
    ctx.shadowBlur = glowMul ? 16 : 0;
    ctx.fillStyle = COL.white;
    ctx.fillText(String(S.score).padStart(5, '0'), W - 28, 18);
    ctx.shadowBlur = glowMul ? 0 : 0;
    ctx.font = font(12, 500);
    ctx.fillStyle = 'rgba(190,215,255,0.55)';
    ctx.fillText('最佳 ' + S.best, W - 28, 50);

    ctx.textAlign = 'center';
    ctx.font = font(12, 600);
    ctx.fillStyle = 'rgba(160,200,255,0.55)';
    ctx.fillText('第 ' + S.wave + ' 波', W / 2, 22);

    // Boss 总血条
    if (S.bossActive) {
      const frac = clamp(bossHp() / Math.max(1, bossMaxHp()), 0, 1);
      const bw = Math.min(220, W * 0.46);
      const bx = W / 2 - bw / 2;
      ctx.fillStyle = 'rgba(255,70,90,0.16)';
      ctx.fillRect(bx, 42, bw, 5);
      ctx.fillStyle = '#ff4d63';
      ctx.fillRect(bx, 42, bw * frac, 5);

      // 棱镜要塞的护盾条
      if (S.bossType === 'prism' && prismBoss && prismBoss.maxShield > 0) {
        const sf = clamp(prismBoss.shield / prismBoss.maxShield, 0, 1);
        ctx.fillStyle = 'rgba(140,240,255,0.14)';
        ctx.fillRect(bx, 50, bw, 3);
        ctx.fillStyle = '#8fe8ff';
        ctx.fillRect(bx, 50, bw * sf, 3);
      }
    }

    if (S.combo > 0) {
      ctx.textAlign = 'left';
      ctx.font = font(14, 700);
      ctx.fillStyle = 'rgba(255,209,102,' + Math.min(1, S.comboT) + ')';
      ctx.shadowColor = COL.gold;
      ctx.shadowBlur = glowMul ? 10 : 0;
      ctx.fillText('连击 x' + comboMult().toFixed(1), 30, 62);
      ctx.shadowBlur = glowMul ? 0 : 0;
    }

    // 键盘玩家的冲刺冷却条；触屏用右下角按钮显示
    if (!(touchMode || coarse)) {
      const cd = 1 - clamp(player.dashCd / dashCdMax(), 0, 1);
      const bw = 92, bh = 4;
      const bx = W / 2 - bw / 2;
      const by = H - 26;
      ctx.fillStyle = 'rgba(140,180,255,0.16)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = cd >= 1 ? COL.cyan : 'rgba(111,246,255,0.55)';
      ctx.fillRect(bx, by, bw * cd, bh);
      ctx.textAlign = 'center';
      ctx.font = font(10, 500);
      ctx.fillStyle = 'rgba(160,200,255,0.45)';
      ctx.fillText(cd >= 1 ? '冲刺就绪' : '冲刺冷却', W / 2, by - 14);
    }

    // 等级与经验：条宽不超过屏幕 20%，等级数字在条左端
    const barW = Math.min(220, Math.max(72, W * 0.2));
    const barH = 6;
    const barX = 26;
    const barY = H - 34;
    const sweepOn = S.xpSweepT > 0;
    const xpFrac = sweepOn ? 1 : clamp(S.xp / S.xpNeed, 0, 1);

    uiText(ctx, 'Lv.' + S.level, barX, barY - 12, 16, 800, COL.cyan, 'left');

    ctx.fillStyle = 'rgba(120,170,255,0.18)';
    roundRect(ctx, barX, barY, barW, barH, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(111,246,255,0.9)';
    roundRect(ctx, barX, barY, Math.max(3, barW * xpFrac), barH, 3);
    ctx.fill();

    if (sweepOn) {
      const sp = clamp(1 - S.xpSweepT / 0.38, 0, 1);
      // 满格后白色高光从左扫到右
      if (sp < 0.6) {
        const sx = barX + barW * clamp((sp / 0.6) * 1.15 - 0.08, 0, 1);
        const gr = ctx.createLinearGradient(sx - 20, 0, sx + 20, 0);
        gr.addColorStop(0, 'rgba(255,255,255,0)');
        gr.addColorStop(0.5, 'rgba(255,255,255,0.95)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gr;
        ctx.fillRect(sx - 20, barY - 1, 40, barH + 2);
      }
      // 再整体脉冲一次
      if (sp >= 0.55) {
        const k = (sp - 0.55) / 0.45;
        ctx.globalAlpha = 0.85 * (1 - k);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        roundRect(ctx, barX - 2 - 4 * k, barY - 2 - 4 * k, barW + 4 + 8 * k, barH + 4 + 8 * k, 5);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // 已获得技能：进化优先 → 等级高优先 → 同等级按获得顺序，最多 9 格 +N
    const list = S.hudOrder || [];
    if (list.length) {
      const shown = Math.min(9, list.length);
      const rowY = H - 15;
      for (let i = 0; i < shown; i++) {
        const it = list[i];
        const def = it.def;
        const col = it.evo ? RARITY_COLOR.evolve : RARITY_COLOR[def.rarity];
        let ox = 22 + i * 18;
        let flash = 0;
        if (S.iconAnim && S.iconAnim.id === it.id) {
          const k = clamp(S.iconAnim.t / 0.5, 0, 1);
          ox -= (1 - easeOutCubic(Math.min(1, k * 2.6))) * 14;
          flash = k < 0.45 ? 1 - k / 0.45 : 0;
        }

        // epic：金色圆角矩形外发光；进化：金色六边形 + 脉冲
        if (it.evo) {
          const pulse = 0.5 + 0.5 * Math.sin(S.t * 5 + i);
          ctx.save();
          if (glowMul) { ctx.shadowColor = col; ctx.shadowBlur = 8 + 6 * pulse; }
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.55 + 0.4 * pulse;
          ctx.lineWidth = 1.4;
          drawHexPath(ctx, ox, rowY, 9.2);
          ctx.stroke();
          ctx.restore();
        } else if (def.rarity === 'epic') {
          ctx.save();
          if (glowMul) { ctx.shadowColor = col; ctx.shadowBlur = 8; }
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.6;
          ctx.lineWidth = 1.2;
          roundRect(ctx, ox - 8.4, rowY - 8.4, 16.8, 16.8, 4);
          ctx.stroke();
          ctx.restore();
        }

        ctx.globalAlpha = it.evo ? 0.2 : 0.14;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(ox, rowY, 7, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (flash > 0) {
          ctx.globalAlpha = flash * 0.75;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ox, rowY, 7.5, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        drawGlyphOn(ctx, it.evo ? def.glyph : def.id, ox, rowY, 4.6, col);
      }
      if (list.length > 9) {
        uiText(ctx, '+' + (list.length - 9), 22 + 9 * 18, H - 15, 11, 600, 'rgba(190,220,255,0.7)');
      }
    }
    ctx.textBaseline = 'top';

    ctx.restore();
  }
  function drawBanner() {
    if (S.bannerT <= 0) return;
    // 技能弹窗盖住整个画面时不再画横幅，否则大字会透到弹窗标题后面
    if (S.mode === 'skillSelect') return;
    const a = Math.min(1, S.bannerT / 0.5);
    const bossBanner = S.banner.indexOf('蛇王') >= 0 || S.banner.indexOf('双球') >= 0 ||
      S.banner.indexOf('巨蛛') >= 0 || S.banner.indexOf('棱镜') >= 0;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(Math.round(Math.min(W * 0.06, 40)), 800);
    ctx.fillStyle = bossBanner ? 'rgba(255,205,205,0.95)' : 'rgba(200,245,255,0.92)';
    ctx.shadowColor = bossBanner ? '#ff4d63' : COL.cyan;
    ctx.shadowBlur = glowMul ? 26 : 0;
    ctx.fillText(S.banner, W / 2, H * 0.2);
    ctx.restore();
  }

  function drawFitted(text, x, y, size, weight, maxW, color) {
    let s = size;
    ctx.font = font(s, weight);
    while (s > 9 && ctx.measureText(text).width > maxW) {
      s -= 1;
      ctx.font = font(s, weight);
    }
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  // ---------------------------------------------------------------- 通用 UI
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function showToast(msg) {
    S.toast = { msg: msg, t: 0, maxT: 2.2 };
  }

  function drawToast() {
    if (!S.toast) return;
    const p = S.toast;
    const a = Math.min(1, Math.min(p.t / 0.15, (p.maxT - p.t) / 0.3));
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = font(12, 600);
    const tw = Math.min(W - 32, ctx.measureText(p.msg).width + 28);
    ctx.fillStyle = 'rgba(8,10,26,0.92)';
    ctx.strokeStyle = 'rgba(111,246,255,0.5)';
    ctx.lineWidth = 1;
    roundRect(ctx, W / 2 - tw / 2, H - 96, tw, 30, 6);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = COL.cyan;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.msg, W / 2, H - 81);
    ctx.restore();
  }

  function drawAchievementPopup() {
    const p = S.achievementPopup;
    if (!p) return;
    const progress = p.t / p.maxT;

    let offsetX;
    if (progress < 0.2) offsetX = lerp(300, 0, progress / 0.2);
    else if (progress < 0.8) offsetX = 0;
    else offsetX = lerp(0, 300, (progress - 0.8) / 0.2);

    const pw = 200;
    const x = W - pw - 20 + offsetX;
    const y = 116;

    ctx.save();
    ctx.globalAlpha = progress < 0.8 ? 1 : Math.max(0, 1 - (progress - 0.8) / 0.2);

    ctx.fillStyle = 'rgba(10,8,30,0.85)';
    ctx.strokeStyle = COL.gold;
    ctx.lineWidth = 2;
    if (glowMul > 0) { ctx.shadowColor = COL.gold; ctx.shadowBlur = 12 * glowMul; }
    roundRect(ctx, x, y, pw, 52, 8);
    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur = glowMul ? 0 : 0;
    ctx.font = font(20);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COL.gold;
    ctx.fillText(p.achievement.icon, x + 12, y + 26);

    ctx.font = font(14, 700);
    ctx.fillText(p.achievement.name, x + 40, y + 18);

    ctx.font = font(11, 400);
    ctx.fillStyle = 'rgba(200,220,255,0.7)';
    ctx.fillText(p.achievement.desc, x + 40, y + 36);

    ctx.restore();
  }

  // ---------------------------------------------------------------- 设置面板
  function setQuality(q) {
    settings.quality = q;
    glowMul = q === 'low' ? 0 : 1;
    saveSettings();
    resize();  // resize 内部会重建背景缓存，无需再调 makeBg
  }

  function settingsLayout() {
    const pw = Math.min(W - 24, 440);
    const ph = Math.min(H - 24, 430);
    const px = (W - pw) / 2;
    const py = (H - ph) / 2;
    const innerW = pw - 80;
    const tiny = ph < 360;
    const compact = ph < 400;
    const rowGap = tiny ? 42 : compact ? 52 : 62;
    const y0 = py + (tiny ? 52 : compact ? 66 : 68);
    const sliders = [
      { id: 'masterVol', label: '主音量', x: px + 40, y: y0, w: innerW, h: 20 },
      { id: 'sfxVol', label: '音效音量', x: px + 40, y: y0 + rowGap, w: innerW, h: 20 },
      { id: 'musicVol', label: '音乐音量', x: px + 40, y: y0 + rowGap * 2, w: innerW, h: 20 }
    ];
    // 极矮横屏下隐藏灵敏度滑块，保证其余控件不重叠
    if (!tiny) {
      sliders.push({
        id: 'touchSensitivity', label: '触屏灵敏度',
        x: px + 40, y: y0 + (compact ? 200 : 246), w: innerW, h: 20
      });
    }
    const qy = y0 + (tiny ? 126 : compact ? 140 : 168);
    const bw = (innerW - 18) / 4;
    const qualityBtns = [
      { value: 'low', label: '低', x: px + 40, y: qy, w: bw, h: 30 },
      { value: 'medium', label: '中', x: px + 40 + (bw + 6), y: qy, w: bw, h: 30 },
      { value: 'high', label: '高', x: px + 40 + (bw + 6) * 2, y: qy, w: bw, h: 30 },
      { value: 'auto', label: '自动', x: px + 40 + (bw + 6) * 3, y: qy, w: bw, h: 30 }
    ];
    return {
      px: px, py: py, pw: pw, ph: ph,
      titleY: py + (tiny ? 18 : compact ? 24 : 30),
      sliders: sliders,
      qualityY: qy,
      qualityBtns: qualityBtns,
      back: { x: W / 2 - 60, y: py + ph - 44, w: 120, h: 34 }
    };
  }

  function sliderFill(id) {
    if (id === 'masterVol') return clamp(settings.masterVol, 0, 1);
    if (id === 'sfxVol') return clamp(settings.sfxVol, 0, 1);
    if (id === 'musicVol') return clamp(settings.musicVol, 0, 1);
    return clamp((settings.touchSensitivity - 0.4) / 1.6, 0, 1);
  }

  function settingsSliderAt(px, py) {
    const L = settingsLayout();
    for (let i = 0; i < L.sliders.length; i++) {
      const s = L.sliders[i];
      if (px >= s.x - 10 && px <= s.x + s.w + 10 && py >= s.y - 16 && py <= s.y + 16) return s;
    }
    return null;
  }

  function settingsQualityBtnAt(px, py) {
    const L = settingsLayout();
    for (let i = 0; i < L.qualityBtns.length; i++) {
      const b = L.qualityBtns[i];
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.value;
    }
    return null;
  }

  function settingsBackBtnAt(px, py) {
    const b = settingsLayout().back;
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  }

  function updateSliderFromPointer(id, px) {
    const L = settingsLayout();
    let s = null;
    for (let i = 0; i < L.sliders.length; i++) {
      if (L.sliders[i].id === id) { s = L.sliders[i]; break; }
    }
    if (!s) return;
    const v = clamp((px - s.x) / s.w, 0, 1);
    if (id === 'masterVol') settings.masterVol = v;
    else if (id === 'sfxVol') settings.sfxVol = v;
    else if (id === 'musicVol') settings.musicVol = v;
    else settings.touchSensitivity = 0.4 + v * 1.6;
  }

  function drawSettings() {
    const L = settingsLayout();
    ctx.save();
    ctx.fillStyle = 'rgba(3,2,10,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(10,14,32,0.98)';
    ctx.strokeStyle = 'rgba(111,246,255,0.35)';
    ctx.lineWidth = 1.4;
    if (glowMul > 0) { ctx.shadowColor = COL.cyan; ctx.shadowBlur = 16 * glowMul; }
    roundRect(ctx, L.px, L.py, L.pw, L.ph, 10);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = glowMul ? 0 : 0;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(20, 800);
    ctx.fillStyle = '#e2fdff';
    ctx.fillText('设置', W / 2, L.titleY);

    for (let i = 0; i < L.sliders.length; i++) {
      const s = L.sliders[i];
      const v = sliderFill(s.id);

      ctx.textAlign = 'left';
      ctx.font = font(12, 600);
      ctx.fillStyle = 'rgba(190,220,255,0.8)';
      ctx.fillText(s.label, s.x, s.y - 16);

      ctx.textAlign = 'right';
      ctx.font = font(12, 600);
      ctx.fillStyle = COL.cyan;
      let txt = Math.round(v * 100) + '%';
      if (s.id === 'touchSensitivity') txt = settings.touchSensitivity.toFixed(1) + 'x';
      ctx.fillText(txt, s.x + s.w, s.y - 16);

      ctx.fillStyle = 'rgba(120,170,255,0.18)';
      roundRect(ctx, s.x, s.y - 3, s.w, 6, 3);
      ctx.fill();
      ctx.fillStyle = 'rgba(111,246,255,0.85)';
      roundRect(ctx, s.x, s.y - 3, Math.max(4, s.w * v), 6, 3);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(s.x + s.w * v, s.y, 7.5, 0, TAU);
      ctx.fillStyle = '#eaffff';
      ctx.shadowColor = COL.cyan;
      ctx.shadowBlur = glowMul ? 10 : 0;
      ctx.fill();
      ctx.shadowBlur = glowMul ? 0 : 0;
    }

    // 画质
    ctx.textAlign = 'left';
    ctx.font = font(12, 600);
    ctx.fillStyle = 'rgba(190,220,255,0.8)';
    ctx.fillText('画质', L.px + 40, L.qualityY - 20);

    for (let i = 0; i < L.qualityBtns.length; i++) {
      const b = L.qualityBtns[i];
      const on = settings.quality === b.value;
      ctx.fillStyle = on ? 'rgba(111,246,255,0.18)' : 'rgba(120,170,255,0.06)';
      ctx.strokeStyle = on ? COL.cyan : 'rgba(140,200,255,0.3)';
      ctx.lineWidth = 1.2;
      roundRect(ctx, b.x, b.y, b.w, b.h, 5);
      ctx.fill();
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.font = font(12, on ? 700 : 500);
      ctx.fillStyle = on ? COL.cyan : 'rgba(190,220,255,0.65)';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 0.5);
    }

    const back = L.back;
    ctx.fillStyle = 'rgba(120,170,255,0.08)';
    ctx.strokeStyle = 'rgba(140,200,255,0.4)';
    ctx.lineWidth = 1.2;
    roundRect(ctx, back.x, back.y, back.w, back.h, 6);
    ctx.fill();
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = font(13, 600);
    ctx.fillStyle = '#cfeaff';
    ctx.fillText('返回', back.x + back.w / 2, back.y + back.h / 2 + 0.5);

    ctx.restore();
  }

  function pauseSettingsBtnRect() {
    return { x: W / 2 - 62, y: H * 0.44 + 86, w: 124, h: 34 };
  }

  function pauseSettingsBtnAt(px, py) {
    const b = pauseSettingsBtnRect();
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  }

  // ---------------------------------------------------------------- 选角界面
  function openSelect() {
    if (S.mode !== 'title' && S.mode !== 'dead') return;
    S.mode = 'select';
    S.selectT = 0;
    S.tutorialStep = -1;
    if (hitSoundOk()) SFX.start();
  }

  function selectCharacter(i) {
    if (i < 0 || i >= CHARACTERS.length) return;
    selectedChar = i;
    settings.character = CHARACTERS[i].id;
    saveSettings();
    if (hitSoundOk()) SFX.pickup(null);
  }

  function selectLayout() {
    const rows = W < 780 && H >= 560;
    const compact = !rows && (W < 900 || H < 560);
    const cards = [];
    const startW = 184, startH = 44;
    if (rows) {
      const cw = Math.min(W - 44, 520);
      const ch = Math.min(112, (H - 250) / 3 - 10);
      const y0 = Math.max(130, H * 0.16);
      for (let i = 0; i < 3; i++) {
        cards.push({ x: (W - cw) / 2, y: y0 + i * (ch + 10), w: cw, h: ch, i: i });
      }
      const sy = Math.min(H - 64, y0 + 3 * (ch + 10) + 18);
      return {
        rows: rows, compact: false, cards: cards,
        start: { x: (W - startW) / 2, y: sy, w: startW, h: startH },
        back: { x: 16, y: 14, w: 72, h: 32 }
      };
    }

    if (compact) {
      const gap = 16;
      const cw = Math.min(200, (W - 88 - gap * 2) / 3);
      const ch = Math.min(150, H * 0.34);
      const total = cw * 3 + gap * 2;
      const x0 = (W - total) / 2;
      const blockH = ch + 16 + 36 + 40;
      const y0 = Math.max(88, (H - blockH) / 2 + 10);
      for (let i = 0; i < 3; i++) {
        cards.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch, i: i, compact: true });
      }
      const detailY = y0 + ch + 16;
      return {
        rows: false, compact: true, cards: cards, detailY: detailY,
        start: { x: (W - startW) / 2, y: detailY + 36, w: startW, h: 40 },
        back: { x: 16, y: 14, w: 72, h: 32 }
      };
    }

    const gap = 16;
    const cw = Math.min(280, (W - 80 - gap * 2) / 3);
    const y0 = Math.max(100, H * 0.24);
    const ch = Math.min(320, Math.max(150, H - y0 - 96));
    const total = cw * 3 + gap * 2;
    const x0 = (W - total) / 2;
    for (let i = 0; i < 3; i++) {
      cards.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch, i: i });
    }
    const sy = Math.min(H - 56, y0 + ch + 16);
    return {
      rows: false, compact: false, cards: cards,
      start: { x: (W - startW) / 2, y: sy, w: startW, h: startH },
      back: { x: 16, y: 14, w: 72, h: 32 }
    };
  }

  function handleSelectClick(px, py) {
    const L = selectLayout();
    const b = L.back;
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
      S.mode = 'title';
      clearFieldEntities();
      return;
    }
    for (let i = 0; i < L.cards.length; i++) {
      const c = L.cards[i];
      if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) {
        selectCharacter(c.i);
        return;
      }
    }
    const s = L.start;
    if (px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h) startGame();
  }

  function drawHpPips(x, y, hp, color) {
    for (let i = 0; i < hp; i++) {
      ctx.beginPath();
      ctx.arc(x + i * 11, y, 3.4, 0, TAU);
      ctx.fillStyle = color;
      ctx.fill();
    }
  }

  function drawSelectCard(card) {
    const c = CHARACTERS[card.i];
    const on = card.i === selectedChar;

    ctx.fillStyle = on ? 'rgba(18,34,54,0.96)' : 'rgba(9,14,30,0.92)';
    ctx.strokeStyle = on ? c.color : 'rgba(120,180,255,0.26)';
    ctx.lineWidth = on ? 2 : 1.2;
    if (on && glowMul) {
      ctx.shadowColor = c.color;
      ctx.shadowBlur = glowMul ? 18 : 0;
    }
    roundRect(ctx, card.x, card.y, card.w, card.h, 10);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = glowMul ? 0 : 0;

    const cx = card.x + 34;
    const cy = card.y + card.h / 2;

    if (card.compact) {
      // 窄屏横排：卡片只保留身份信息，说明放在下方详情栏
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.font = font(16, 800);
      ctx.fillStyle = c.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.textAlign = 'left';
      ctx.font = font(14, 800);
      ctx.fillStyle = '#e6f7ff';

      ctx.font = font(9.5, 700);
      ctx.fillStyle = c.color;
      drawFitted(c.skillName, card.x + 12, cy + 34, 9.5, 700, card.w - 24, c.color);
    } else if (card.h < 300) {
      // 横屏矮卡片：单行紧凑布局
      const ty = card.y + Math.max(20, (card.h - 100) / 2);
      ctx.beginPath();
      ctx.arc(cx, card.y + card.h / 2, 16, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.font = font(16, 800);
      ctx.fillStyle = c.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

        c.skillDesc, card.x + 60, ty + 62,

      );

    } else {
      // 竖版卡片
      ctx.beginPath();
      ctx.arc(card.x + card.w / 2, card.y + 52, 26, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.font = font(24, 800);
      ctx.fillStyle = c.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(c.glyph, card.x + card.w / 2, card.y + 54);

      ctx.font = font(18, 800);
      ctx.fillStyle = '#e6f7ff';
      ctx.fillText(c.name, card.x + card.w / 2, card.y + 96);
      ctx.font = font(11, 500);
      ctx.fillStyle = 'rgba(150,200,255,0.65)';
      ctx.fillText(c.role, card.x + card.w / 2, card.y + 118);

      const pw = c.hp * 11;
      drawHpPips(card.x + card.w / 2 - pw / 2 + 3, card.y + 142, c.hp, c.color);

      ctx.strokeStyle = 'rgba(140,200,255,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(card.x + 20, card.y + 160);
      ctx.lineTo(card.x + card.w - 20, card.y + 160);

      ctx.textAlign = 'left';
      ctx.font = font(10, 600);
      ctx.fillStyle = 'rgba(150,200,255,0.55)';

      ctx.fillStyle = 'rgba(150,200,255,0.55)';
      ctx.fillText('被动天赋', card.x + 20, card.y + 256);
      ctx.font = font(13, 700);
      ctx.fillStyle = '#9df0c4';
      ctx.fillText(c.passiveName, card.x + 20, card.y + 276);
      ctx.font = font(9.5, 400);
      ctx.fillStyle = 'rgba(180,220,200,0.62)';

      );

  // ---------------------------------------------------------------- 新手教程
  const TUTORIAL_STEPS = [
    { title: '移动', body: '拖动屏幕 / WASD 控制移动' },
    { title: '射击', body: '自动瞄准最近的敌人射击' },
    { title: '冲刺', body: '冲刺躲避弹幕，冲刺期间有无敌帧' },
    { title: '成长', body: '击杀积累经验，升级后四选一强化技能' }
  ];

  function isFirstRun() {
    try { return !localStorage.getItem('neon-ring-tutorial-done'); }
    catch (e) { return true; }
  }

  function markTutorialDone() {
    try { localStorage.setItem('neon-ring-tutorial-done', '1'); }
    catch (e) { /* 忽略 */ }
    S.tutorialStep = -1;
  }

  function tutorialLayout() {
    const pw = Math.min(W - 32, 460);
    const ph = Math.min(H - 32, 330);
    const px = (W - pw) / 2;
    const py = (H - ph) / 2;
    return {
      px: px, py: py, pw: pw, ph: ph,
      next: { x: W / 2 - 70, y: py + ph - 62, w: 140, h: 38 },
      skip: { x: px + pw - 76, y: py + 16, w: 60, h: 26 }
    };
  }

  function advanceTutorial() {
    if (S.tutorialStep < 0) return;
    if (S.tutorialStep >= TUTORIAL_STEPS.length - 1) {
      markTutorialDone();
      return;
    }
    S.tutorialStep++;
  }

  function handleTutorialClick(px, py) {
    const L = tutorialLayout();
    const n = L.next, s = L.skip;
    if (px >= n.x && px <= n.x + n.w && py >= n.y && py <= n.y + n.h) {
      advanceTutorial();
      return;
    }
    if (px >= s.x - 8 && px <= s.x + s.w + 8 && py >= s.y - 8 && py <= s.y + s.h + 8) {
      markTutorialDone();
    }
  }

  function drawTutorial() {
    const step = TUTORIAL_STEPS[S.tutorialStep];
    if (!step) return;
    const L = tutorialLayout();
    ctx.save();
    ctx.fillStyle = 'rgba(3,2,10,0.62)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(10,14,32,0.97)';
    ctx.strokeStyle = 'rgba(111,246,255,0.4)';
    ctx.lineWidth = 1.4;
    if (glowMul > 0) { ctx.shadowColor = COL.cyan; ctx.shadowBlur = 18 * glowMul; }
    roundRect(ctx, L.px, L.py, L.pw, L.ph, 10);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = glowMul ? 0 : 0;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(11, 600);
    ctx.fillStyle = 'rgba(140,200,255,0.55)';
    ctx.fillText('新手引导 ' + (S.tutorialStep + 1) + ' / ' + TUTORIAL_STEPS.length, W / 2, L.py + 40);

    ctx.font = font(28, 800);
    ctx.fillStyle = '#e2fdff';
    ctx.fillText(step.title, W / 2, L.py + 92);

    ctx.font = font(14, 500);
    ctx.fillStyle = 'rgba(210,232,255,0.85)';
    drawFitted(step.body, W / 2, L.py + 138, 14, 500, L.pw - 48, 'rgba(210,232,255,0.85)');

    // 步骤指示点
    const dots = TUTORIAL_STEPS.length;
    const dw = 12, gap = 8;
    const dx0 = W / 2 - (dots * dw + (dots - 1) * gap) / 2 + dw / 2;
    for (let i = 0; i < dots; i++) {
      ctx.beginPath();
      ctx.arc(dx0 + i * (dw + gap), L.py + 182, 3.4, 0, TAU);
      ctx.fillStyle = i === S.tutorialStep ? COL.cyan : 'rgba(140,200,255,0.28)';
      ctx.fill();
    }

    const n = L.next;
    ctx.fillStyle = 'rgba(111,246,255,0.16)';
    ctx.strokeStyle = COL.cyan;
    ctx.lineWidth = 1.3;
    roundRect(ctx, n.x, n.y, n.w, n.h, 7);
    ctx.fill();
    ctx.stroke();
    ctx.font = font(13, 700);
    ctx.fillStyle = COL.cyan;
    ctx.fillText(
      S.tutorialStep === TUTORIAL_STEPS.length - 1 ? '完成引导' : '下一步',
      n.x + n.w / 2, n.y + n.h / 2 + 0.5
    );

    const s = L.skip;
    ctx.font = font(11, 500);
    ctx.fillStyle = 'rgba(150,200,255,0.5)';
    ctx.fillText('跳过', s.x + s.w / 2, s.y + s.h / 2);
    ctx.restore();
  }

  // ---------------------------------------------------------------- 死亡战绩卡
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fmtTime(sec) {
    const t = Math.max(0, Math.floor(sec || 0));
    return Math.floor(t / 60) + ':' + pad2(t % 60);
  }

  function deathCardButtonRect() {
    const bw = 168, bh = 38;
    const y = Math.min(H * 0.72, H - 100);
    return { x: (W - bw) / 2, y: y, w: bw, h: bh };
  }

  function deathCardButtonAt(px, py) {
    const b = deathCardButtonRect();
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  }

  function changeCharBtnRect() {
    return { x: 18, y: H - 50, w: 92, h: 30 };
  }

  function changeCharAt(px, py) {
    const b = changeCharBtnRect();
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  }

  function drawDeathCard(c, cw, ch) {
    const g = c.createLinearGradient(0, 0, 0, ch);
    g.addColorStop(0, '#050318');
    g.addColorStop(1, '#0b0828');
    c.fillStyle = g;
    c.fillRect(0, 0, cw, ch);

    const halo = c.createRadialGradient(cw / 2, 130, 0, cw / 2, 130, 380);
    halo.addColorStop(0, 'rgba(80,240,255,0.15)');
    halo.addColorStop(1, 'rgba(80,240,255,0)');
    c.fillStyle = halo;
    c.fillRect(0, 0, cw, 460);

    for (let i = 0; i < 15; i++) {
      c.fillStyle = 'rgba(180,220,255,' + rnd(0.15, 0.5) + ')';
      c.beginPath();
      c.arc(rnd(0, cw), rnd(0, ch), rnd(0.6, 1.8), 0, TAU);
      c.fill();
    }

    c.textAlign = 'center';
    c.textBaseline = 'middle';

    c.font = '700 44px "Segoe UI", system-ui, sans-serif';
    c.fillStyle = '#6ff6ff';
    c.shadowColor = '#6ff6ff';
    c.shadowBlur = glowMul ? 24 : 0;
    c.fillText('霓虹星环', cw / 2, 116);
    c.shadowBlur = glowMul ? 0 : 0;

    c.font = '400 16px sans-serif';
    c.fillStyle = 'rgba(160,220,255,0.6)';
    c.fillText('NEON RING', cw / 2, 154);

    if (player && CHARACTERS[player.charIndex]) {
      const pc = CHARACTERS[player.charIndex];
      c.font = '500 14px sans-serif';
      c.fillStyle = 'rgba(180,220,255,0.55)';
      c.fillText(pc.name + ' · ' + pc.role, cw / 2, 182);
    }

    c.font = '800 96px "Segoe UI", system-ui, sans-serif';
    c.fillStyle = '#ffffff';
    c.shadowColor = '#6ff6ff';
    c.shadowBlur = glowMul ? 30 : 0;
    c.fillText(String(S.score), cw / 2, 300);
    c.shadowBlur = glowMul ? 0 : 0;

    c.font = '500 18px sans-serif';
    c.fillStyle = 'rgba(200,230,255,0.7)';
    c.fillText('本局得分', cw / 2, 350);

    c.strokeStyle = 'rgba(140,220,255,0.18)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(cw / 2 - 220, 392);
    c.lineTo(cw / 2 + 220, 392);
    c.stroke();

    const stats2 = [
      ['存活时间', fmtTime(S.elapsedSec)],
      ['到达波次', '第 ' + S.wave + ' 波'],
      ['击杀总数', String(S.totalKills || 0)],
      ['最高连击', String(S.maxCombo || 0)]
    ];
    for (let i = 0; i < stats2.length; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const x = cw / 2 + (col === 0 ? -160 : 160);
      const y = 446 + row * 78;
      c.font = '400 18px sans-serif';
      c.fillStyle = 'rgba(150,200,255,0.55)';
      c.fillText(stats2[i][0], x, y);
      c.font = '600 26px sans-serif';
      c.fillStyle = '#dff4ff';
      c.fillText(stats2[i][1], x, y + 32);
    }

    const gotIds = Object.keys(S.sessionAch || {});
    if (gotIds.length) {
      c.font = '500 16px sans-serif';
      c.fillStyle = 'rgba(255,210,120,0.8)';
      c.fillText('本局解锁', cw / 2, 606);

      const perRow = 4;
      for (let i = 0; i < gotIds.length; i++) {
        const def = ACHIEVEMENTS.find(function (a) { return a.id === gotIds[i]; });
        if (!def) continue;
        const col = i % perRow;
        const row = Math.floor(i / perRow);
        const x = cw / 2 - 302 + col * 156;
        // 行距收紧到 52：一局最多 15 个成就时，第 4 行也不会压到下面的分隔线
        const y = 628 + row * 52;
        c.fillStyle = 'rgba(255,200,90,0.12)';
        c.strokeStyle = 'rgba(255,200,90,0.6)';
        c.lineWidth = 1.5;
        roundRect(c, x, y, 142, 44, 8);
        c.fill();
        c.stroke();

        let label = def.icon + ' ' + def.name;
        let fs = 14;
        c.font = fs + 'px sans-serif';
        while (fs > 10 && c.measureText(label).width > 124) {
          fs -= 1;
          c.font = fs + 'px sans-serif';
        }
        c.fillStyle = '#ffd77a';
        c.fillText(label, x + 71, y + 23);
      }
    }

    c.strokeStyle = 'rgba(140,220,255,0.14)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(cw / 2 - 220, ch - 168);
    c.lineTo(cw / 2 + 220, ch - 168);
    c.stroke();

    if (S.score >= S.best && S.score > 0) {
      c.font = '600 18px sans-serif';
      c.fillStyle = '#ffd77a';
      c.fillText('★ 新纪录 ★', cw / 2, ch - 128);
    } else {
      c.font = '500 15px sans-serif';
      c.fillStyle = 'rgba(180,210,245,0.6)';
      c.fillText('最高分 ' + S.best, cw / 2, ch - 128);
    }

    const d = new Date();
    c.font = '400 14px sans-serif';
    c.fillStyle = 'rgba(150,180,220,0.5)';
    c.fillText(
      d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()),
      cw / 2, ch - 78
    );

    c.font = '400 12px sans-serif';
    c.fillStyle = 'rgba(120,160,210,0.42)';
    c.fillText('NEON RING · 生存记录', cw / 2, ch - 46);
  }

  function showCardOverlay(dataURL) {
    let box = document.getElementById('cardOverlay');
    if (!box) {
      box = document.createElement('div');
      box.id = 'cardOverlay';
      box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;';
      box.innerHTML = '<img style="max-width:86vw;max-height:74vh;border-radius:8px;"><div style="color:#6ff6ff;font:14px sans-serif;">长按图片保存 · 点击空白关闭</div>';
      box.addEventListener('pointerdown', function (ev) {
        // 长按图片保存时不要关闭弹层
        if (ev.target && ev.target.tagName === 'IMG') return;
        box.remove();
      });
      document.body.appendChild(box);
    }
    box.querySelector('img').src = dataURL;
  }

  function exportDeathCard() {
    let dataURL;
    try {
      const cardW = 750, cardH = 1000;
      const off = document.createElement('canvas');
      off.width = cardW;
      off.height = cardH;
      const oc = off.getContext('2d');
      drawDeathCard(oc, cardW, cardH);
      dataURL = off.toDataURL('image/png');
    } catch (e) {
      showToast('当前环境不支持导出');
      return;
    }

    // iOS Safari 等环境 a.download 无效，改为图片层长按保存
    if (touchMode || coarse) {
      showCardOverlay(dataURL);
      return;
    }

    try {
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = 'neon-ring-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('战绩卡已保存');
    } catch (e) {
      showToast('当前环境不支持导出');
    }
  }

  // ---------------------------------------------------------------- 主界面
  const HOME_ITEMS = ['开始游戏', '选择角色', '成就', '设置', '玩法说明'];

  function homeLayout() {
    const stacked = W < 760 && H >= 560;
    const n = HOME_ITEMS.length;
    const buttons = [];

    if (stacked) {
      const bw = Math.min(W - 64, 320);
      const bh = clamp((H - 360) / 6, 36, 50);
      const gap = 10;
      const totalH = n * bh + (n - 1) * gap;
      const y0 = clamp(H * 0.36, 250, 320);
      for (let i = 0; i < n; i++) {
        buttons.push({ x: (W - bw) / 2, y: y0 + i * (bh + gap), w: bw, h: bh, i: i });
      }
      return {
        stacked: true, buttons: buttons, leftX: W / 2,
        logoY: Math.max(96, H * 0.17), logoSize: Math.min(W * 0.17, 64),
        metaY: Math.min(H - 84, y0 + totalH + 18)
      };
    }

    const bw = Math.min(280, W * 0.3);
    const bh = H < 420 ? 38 : 48;
    const gap = H < 420 ? 6 : 10;
    const totalH = n * bh + (n - 1) * gap;
    const bx = W - bw - Math.max(28, W * 0.08);
    const y0 = (H - totalH) / 2;
    for (let i = 0; i < n; i++) {
      buttons.push({ x: bx, y: y0 + i * (bh + gap), w: bw, h: bh, i: i });
    }
    return {
      stacked: false, buttons: buttons, leftX: W * 0.32,
      logoY: H * 0.3, logoSize: Math.min(W * 0.075, 74),
      metaY: H * 0.47
    };
  }

  function homeButtonAt(px, py) {
    const L = homeLayout();
    for (let i = 0; i < L.buttons.length; i++) {
      const b = L.buttons[i];
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return i;
    }
    return -1;
  }

  function activateHome() {
    if (hitSoundOk()) SFX.pickup(null);
    if (S.homeIndex === 0) startGame();
    else if (S.homeIndex === 1) openSelect();
    else if (S.homeIndex === 2) S.achOpen = true;
    else if (S.homeIndex === 3) S.settingsOpen = true;
    else S.helpOpen = true;
  }

  function handleHomeClick(px, py) {
    const i = homeButtonAt(px, py);
    if (i < 0) return;
    S.homeIndex = i;
    activateHome();
  }

  // ---------------------------------------------------------------- loop
  let last = performance.now();

  // 连续掉帧就关闭所有辉光，优先保证帧率
  function trackPerf(dt) {
    if (!glowMul) return;
    perfAcc += dt;
    perfN++;
    if (dt > 0.030) perfSlow++;
    if (perfN >= 120) {
      const avg = perfAcc / perfN;
      if (avg > 0.020 || perfSlow > 15) glowMul = 0;
      perfAcc = 0;
      perfN = 0;
      perfSlow = 0;
    }
  }

  function frame(now) {
    const rdt = Math.min(0.04, Math.max(0.0001, (now - last) / 1000));
    last = now;
    // 兜底：任何情况下技能选择态没有卡片都不能把游戏锁死
    if (S.mode === 'skillSelect' && (!S.skillChoices || S.skillChoices.length === 0)) {
      S.mode = 'playing';
    }
    S.hitstopCd = Math.max(0, S.hitstopCd - rdt);

    // 慢动作只缩放模拟时间，UI/弹窗仍按真实时间推进
    let dt = rdt;
    if (S.slowT > 0) {
      S.slowT = Math.max(0, S.slowT - rdt);
      dt = rdt * S.slowScale;
    }

    if (BGM.boss !== S.bossActive) {
      BGM.boss = S.bossActive;
      BGM.step = 0;
      if (actx) BGM.next = actx.currentTime + 0.05;
    }

    if (S.mode === 'skillSelect') {
      S.skillT += rdt;
      if (S.skillAnim === 'confirm') {
        S.skillConfirmT += rdt;
        if (S.skillConfirmT >= 0.36) {
          const ci = S.skillConfirmI;
          S.skillAnim = 'idle';
          S.skillConfirmI = -1;
          S.skillConfirmT = 0;
          applySkillChoice(ci);
        }
      }
    } else if (S.mode === 'playing') {
      if (S.hitstop > 0) {
        // 冻结时跳过 update，但渲染与计时继续
        S.hitstop = Math.max(0, S.hitstop - rdt);
        S.t += rdt;
      } else {
        update(dt);
        trackPerf(dt);
      }
    } else {
      S.t += rdt;
      if (S.mode === 'dead') {
        S.deadT += rdt;
        updateParticles(rdt);
        updateTexts(rdt);
      }
      if (S.shake > 0) S.shake *= Math.exp(-7 * rdt);
      if (S.flash > 0) S.flash = Math.max(0, S.flash - rdt * 2.4);
      if (S.bannerT > 0) S.bannerT -= rdt;
    }

    // 成就弹窗按真实时长推进，不受顿帧 / 暂停影响
    // 技能弹窗期间冻结计时，选完技能后再继续显示
    const popupFrozen = S.mode === 'skillSelect';
    if (S.achievementPopup && !popupFrozen) {
      const p = S.achievementPopup;
      p.t += rdt;
      if (p.t >= p.maxT) S.achievementPopup = null;
    }
    if (S.toast && !popupFrozen) {
      S.toast.t += rdt;
      if (S.toast.t >= S.toast.maxT) S.toast = null;
    }
    if (S.iconAnim) {
      S.iconAnim.t += rdt;
      if (S.iconAnim.t >= 0.5) S.iconAnim = null;
    }

    render();
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- boot
  resize();
  window.addEventListener('resize', resize);
  player = makePlayer();
  requestAnimationFrame(frame);

  // 调试桥：便于控制台与自动化自测，不影响正常游玩
  window.__neonRing = {
    S: S,
    ACH_DATA: ACH_DATA,
    ACHIEVEMENTS: ACHIEVEMENTS,
    stats: stats,
    settings: settings,
    SKILL_POOL: SKILL_POOL,
    HIDDEN_SKILLS: HIDDEN_SKILLS,
    EVOLUTIONS: EVOLUTIONS,
    startGame: startGame,
    clearFieldEntities: clearFieldEntities,
    die: die,
    unlockAchievement: unlockAchievement,
    killVFX: killVFX,
    killEnemy: killEnemy,
    exportDeathCard: exportDeathCard,
    setQuality: setQuality,
    applyHitstop: applyHitstop,
    saveStats: saveStats,
    settingsLayout: settingsLayout,
    updateSliderFromPointer: updateSliderFromPointer,
    deathCardButtonRect: deathCardButtonRect,
    pauseSettingsBtnRect: pauseSettingsBtnRect,
    tutorialLayout: tutorialLayout,
    advanceTutorial: advanceTutorial,
    markTutorialDone: markTutorialDone,
    drawDeathCard: drawDeathCard,
    useSkill: useSkill,
    openSelect: openSelect,
    selectCharacter: selectCharacter,
    selectLayout: selectLayout,
    homeLayout: homeLayout,
    activateHome: activateHome,
    achPanelLayout: achPanelLayout,
    helpPanelLayout: helpPanelLayout,
    spawnEnemy: spawnEnemy,
    spawnRing: spawnRing,
    damageEnemy: damageEnemy,
    damageBossArea: damageBossArea,
    bossHp: bossHp,
    bossMaxHp: bossMaxHp,
    gainXP: gainXP,
    evoReady: evoReady,
    pityEvoPick: pityEvoPick,
    updateHudOrder: updateHudOrder,
    dashCdMax: dashCdMax,
    chainFromBullet: chainFromBullet,
    applyBurnEnemy: applyBurnEnemy,
    applyBurnBoss: applyBurnBoss,
    critChanceNow: critChanceNow,
    slowRadius: slowRadius,
    slowRatio: slowRatio,
    triggerSkillSelect: triggerSkillSelect,
    triggerBossSkillSelect: triggerBossSkillSelect,
    chooseSkill: pickSkill,
    pickSkill: pickSkill,
    applySkillChoice: applySkillChoice,
    resetSkillModal: resetSkillModal,
    useBossSkill: useBossSkill,
    skillLv: skillLv,
    skillSelectLayout: skillSelectLayout,
    bossSkillButtonRect: bossSkillButtonRect,
    startBoss: startBoss,
    startTwinBoss: startTwinBoss,
    startSpiderBoss: startSpiderBoss,
    startPrismBoss: startPrismBoss,
    damageBossPart: damageBossPart,
    defeatBoss: defeatBoss,
    pickType: pickType,
    audioPitch: audioPitch,
    panFor: panFor,
    CHARACTERS: CHARACTERS,
    bgm: BGM,
    setGlow: function (v) { glowMul = v ? 1 : 0; },
    get audioState() { return actx ? actx.state : 'none'; },
    get player() { return player; },
    get selectedChar() { return selectedChar; },
    get rings() { return rings; },
    get parts() { return parts; },
    get bullets() { return bullets; },
    get ebullets() { return ebullets; },
    get bolts() { return bolts; },
    get boss() { return boss; },
    get twinBoss() { return twinBoss; },
    get spiderBoss() { return spiderBoss; },
    get prismBoss() { return prismBoss; },
    pauseButtonRect: pauseButtonRect,
    get enemies() { return enemies; }
  };

  // 便于自动化回归验证：以 #play 打开时直接进入游戏
  if (location.hash === '#play') {
    try { localStorage.setItem('neon-ring-tutorial-done', '1'); } catch (e) { /* 忽略 */ }
    S.tutorialStep = -1;
    startGame();
  } else if (isFirstRun()) {
    S.tutorialStep = 0;
  }

  // 调试参数：?debug=evolve 直接进入电弧风暴测试；?debug=pity 验证保底进化
  if (location.search.indexOf('debug=evolve') >= 0) {
    if (S.mode !== 'playing') startGame();
    S.level = 8;
    S.skills = { chain: 2, rapid: 2 };
    S.skillOrder = ['chain', 'rapid'];
    S.skillPicks = 7;
    S.xp = 0;
    S.xpNeed = 3;
    updateHudOrder();
    S.banner = '调试：电弧风暴就绪';
    S.bannerT = 3;
  } else if (location.search.indexOf('debug=pity') >= 0) {
    if (S.mode !== 'playing') startGame();
    S.level = 9;
    S.skills = { homing: 1, magnet: 1 };
    S.skillOrder = ['homing', 'magnet'];
    S.skillPicks = 7;
    S.xp = 0;
    S.xpNeed = 3;
    updateHudOrder();
    S.banner = '调试：下一次升级触发保底';
    S.bannerT = 3;
  }
})();
</script>
</body>
</html>
