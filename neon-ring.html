  function updateTwinBoss(dt) {
    if (!twinBoss) return;
    twinBoss.t += dt;
    const p = player;

    for (let i = 0; i < twinBoss.spheres.length; i++) {
      const s = twinBoss.spheres[i];
      s.hitT = Math.max(0, s.hitT - dt);
      if (s.hp <= 0) continue;

      const dx = p.x - s.x;
      const dy = p.y - s.y;
      const d = Math.max(1, hyp(dx, dy));
      const nx = dx / d;
      const ny = dy / d;
      let moved = false;

      if (s.kind === 'charger') {
        s.stateT -= dt;
        if (s.state === 'idle') {
          s.vx = lerp(s.vx, nx * 95, 1 - Math.exp(-3 * dt));
          s.vy = lerp(s.vy, ny * 95, 1 - Math.exp(-3 * dt));
          s.ang = Math.atan2(s.vy, s.vx);
          if (s.stateT <= 0) { s.state = 'wind'; s.stateT = 0.6; }
        } else if (s.state === 'wind') {
          s.vx *= Math.exp(-6 * dt);
          s.vy *= Math.exp(-6 * dt);
          s.ang = Math.atan2(ny, nx);
          if (s.stateT <= 0) {
            s.state = 'dash';
            s.stateT = 0.55;
            s.dashX = nx;
            s.dashY = ny;
          }
        } else if (s.state === 'dash') {
          moved = true;
          s.x += s.dashX * 900 * dt;
          s.y += s.dashY * 900 * dt;
          if (Math.random() < 0.6) {
            pushPart({
              x: s.x, y: s.y, vx: rnd(-60, 60), vy: rnd(-60, 60),
              life: 0.3, max: 0.3, color: COL.orange, size: 2.6, drag: 2
            });
          }
          if (s.stateT <= 0) { s.state = 'recover'; s.stateT = 0.9; }
        } else {
          s.vx *= Math.exp(-3 * dt);
          s.vy *= Math.exp(-3 * dt);
          if (s.stateT <= 0) { s.state = 'idle'; s.stateT = rnd(1.0, 1.8); }
        }
      } else {
        // 远程球：保持距离、横移、扇形弹幕
        const want = Math.max(240, Math.min(W, H) * 0.36);
        let mx = 0, my = 0;
        if (d > want + 40) { mx = nx; my = ny; }
        else if (d < want - 40) { mx = -nx; my = -ny; }
        const strafe = Math.sin(twinBoss.t * 1.2) >= 0 ? 1 : -1;
        mx += -ny * strafe * 0.9;
        my += nx * strafe * 0.9;
        const mm = Math.max(1, hyp(mx, my));
        s.vx = lerp(s.vx, (mx / mm) * 110, 1 - Math.exp(-2.5 * dt));
        s.vy = lerp(s.vy, (my / mm) * 110, 1 - Math.exp(-2.5 * dt));
        s.ang = Math.atan2(ny, nx);

        s.fireCd -= dt;
        s.burstCd -= dt;
        if (s.fireCd <= 0) {
          s.fireCd = rnd(1.8, 2.6);
          const base = Math.atan2(dy, dx);
          for (let k = -2; k <= 2; k++) bossShot(s.x, s.y, base + k * 0.22, 235);
        }
        if (s.burstCd <= 0) {
          s.burstCd = rnd(3.4, 4.6);
          const base = Math.atan2(dy, dx);
          for (let k = -1; k <= 1; k++) bossShot(s.x, s.y, base + k * 0.14, 300);
        }
      }

      if (!moved) {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
      }
      s.x = clamp(s.x, s.r, W - s.r);
      s.y = clamp(s.y, s.r, H - s.r);

      if (p.inv <= 0 && hyp(p.x - s.x, p.y - s.y) < p.r + s.r * 0.82) {
        hurtPlayer(1);
      }
    }

    checkTwinDeath();
  }

  function twinHitPoint(b) {
    if (!twinBoss) return null;
    for (let i = 0; i < twinBoss.spheres.length; i++) {
      const s = twinBoss.spheres[i];
      if (s.hp <= 0) continue;
      const rr = s.r + b.r;
      if ((b.x - s.x) ** 2 + (b.y - s.y) ** 2 <= rr * rr) {
        return { sphere: s, x: s.x, y: s.y };
      }
    }
    return null;
  }

  function damageTwinSphere(s, dmg, x, y) {

  function checkTwinDeath() {

  // ---------------------------------------------------------------- 巨蛛女王（第 16 波）
  function startSpiderBoss() {
    for (let i = enemies.length - 1; i >= 0; i--) {

    spiderBoss = {

    };

    for (let i = 0; i < 4; i++) {
      const a = -Math.PI / 2 + i * (TAU / 4);
      spiderBoss.legs.push({
        baseA: a,
        x: cx + Math.cos(a) * r * 2.2,
        y: cy + Math.sin(a) * r * 2.2,
        r: r * 0.5,
        state: 'idle',

        hitT: 0
      });

    S.bossActive = true;

    S.bannerT = 3.4;
    S.shake = 20;
    S.flash = 0.9;
    SFX.boss();
  }

  function updateSpiderBoss(dt) {
    if (!spiderBoss) return;
    const s = spiderBoss;
    const p = player;
    s.t += dt;
    s.hitT = Math.max(0, s.hitT - dt);

    const dx = p.x - s.x;
    const dy = p.y - s.y;
    const d = Math.max(1, hyp(dx, dy));
    const nx = dx / d;
    const ny = dy / d;

    // 头部保持中距离
    const want = 300;
    let mx = 0, my = 0;
    if (d > want + 50) { mx = nx; my = ny; }
    else if (d < want - 50) { mx = -nx; my = -ny; }
    const strafe = Math.sin(s.t * 0.8) >= 0 ? 1 : -1;
    mx += -ny * strafe * 0.5;
    my += nx * strafe * 0.5;
    const mm = Math.max(1, hyp(mx, my));
    s.x += (mx / mm) * 55 * dt;
    s.y += (my / mm) * 55 * dt;
    s.x = clamp(s.x, s.r + 20, W - s.r - 20);
    s.y = clamp(s.y, s.r + 20, H - s.r - 20);
    s.ang = Math.atan2(ny, nx);

    // 头部弹幕
    s.fireCd -= dt;
    s.ringCd -= dt;
    if (s.fireCd <= 0) {
      s.fireCd = rnd(2.0, 2.8);
      const base = Math.atan2(p.y - s.y, p.x - s.x);
      for (let k = -2; k <= 2; k++) bossShot(s.x, s.y, base + k * 0.2, 240);
    }
    if (s.ringCd <= 0) {
      s.ringCd = rnd(4.6, 6.2);
      const n = 12;
      for (let k = 0; k < n; k++) bossShot(s.x, s.y, (k / n) * TAU + rnd(-0.05, 0.05), 210);
    }

    // 四条腿：蓄力 → 朝玩家冲撞 → 收回
    for (let i = 0; i < s.legs.length; i++) {
      const leg = s.legs[i];
      leg.hitT = Math.max(0, leg.hitT - dt);
      leg.stateT -= dt;

      const restA = leg.baseA + Math.sin(s.t * 1.4 + i) * 0.18;
      const restX = s.x + Math.cos(restA) * s.r * 2.1;
      const restY = s.y + Math.sin(restA) * s.r * 2.1;

      if (leg.state === 'idle') {
        leg.x += (restX - leg.x) * Math.min(1, 8 * dt);
        leg.y += (restY - leg.y) * Math.min(1, 8 * dt);
        if (leg.stateT <= 0) { leg.state = 'wind'; leg.stateT = 0.55; }
      } else if (leg.state === 'wind') {
        leg.x += (s.x + Math.cos(restA) * s.r * 1.4 - leg.x) * Math.min(1, 6 * dt);
        leg.y += (s.y + Math.sin(restA) * s.r * 1.4 - leg.y) * Math.min(1, 6 * dt);
        if (leg.stateT <= 0) {
          leg.state = 'dash';
          leg.stateT = 0.4;
          leg.dashX = nx;
          leg.dashY = ny;
        }
      } else if (leg.state === 'dash') {
        leg.x += leg.dashX * 760 * dt;
        leg.y += leg.dashY * 760 * dt;
        if (Math.random() < 0.5) {
          pushPart({
            x: leg.x, y: leg.y, vx: rnd(-50, 50), vy: rnd(-50, 50),
            life: 0.3, max: 0.3, color: COL.rose, size: 2.4, drag: 2
          });
        }
        if (leg.stateT <= 0) { leg.state = 'return'; leg.stateT = 0.7; }
      } else {
        leg.x += (restX - leg.x) * Math.min(1, 5 * dt);
        leg.y += (restY - leg.y) * Math.min(1, 5 * dt);
        if (leg.stateT <= 0) { leg.state = 'idle'; leg.stateT = rnd(2.0, 3.6); }
      }

      if (p.inv <= 0 && hyp(p.x - leg.x, p.y - leg.y) < p.r + leg.r * 0.9) {
        hurtPlayer(1);
      }
    }

    if (p.inv <= 0 && hyp(p.x - s.x, p.y - s.y) < p.r + s.r * 0.9) {
      hurtPlayer(1);
    }

    if (s.hp <= 0) defeatSpiderBoss();
  }

  function spiderHitPoint(b) {

    const rr = spiderBoss.r + b.r;
    if ((b.x - spiderBoss.x) ** 2 + (b.y - spiderBoss.y) ** 2 <= rr * rr) {

  // ---------------------------------------------------------------- 棱镜要塞（第 17 波）
  function startPrismBoss() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      burst(e.x, e.y, 10, e.color, 220, 0.5, 2.2);

    // 血量 = 巨蛛（第三个 Boss）的 2 倍
    const hp = Math.max(1, (S.snakeBossMax || 480) * 16);
    const r = clamp(Math.min(W, H) * 0.09, 56, 86);
    const shield = Math.round(hp * 0.18);

    prismBoss = {
      t: 0,
      x: W * 0.24,
      y: H * 0.3,
      r: r,
      hp: hp,
      maxHp: hp,
      shield: shield,
      maxShield: shield,
      hitT: 0,
      ang: -Math.PI / 2,
      spin: 0,
      mode: 1,
      modeT: 6.0,
      beamAng: rnd(0, TAU),
      wallTimer: 0.2,
      wallShots: 0,
      orbs: [],
      teleT: 7,
      lastHitT: 99
    };

    S.bossActive = true;
    S.bossType = 'prism';
    S.banner = '棱镜要塞降临';
    S.bannerT = 3.4;
    S.shake = 20;
    S.flash = 0.9;
    SFX.boss();
  }

  function prismTeleport() {
    const s = prismBoss;
    if (!s) return;
    const pts = [
      { x: W * 0.24, y: H * 0.3 },
      { x: W * 0.76, y: H * 0.3 },
      { x: W * 0.24, y: H * 0.66 },
      { x: W * 0.76, y: H * 0.66 }
    ];
    let pick = pts[Math.floor(Math.random() * pts.length)];
    for (let i = 0; i < 4 && hyp(pick.x - s.x, pick.y - s.y) < 140; i++) {
      pick = pts[Math.floor(Math.random() * pts.length)];
    }
    burst(s.x, s.y, 20, '#8fe8ff', 240, 0.6, 2.4);
    s.x = pick.x;
    s.y = pick.y;
    burst(s.x, s.y, 20, '#8fe8ff', 240, 0.6, 2.4);
    S.shake = Math.min(20, S.shake + 5);
  }

  function spawnPrismOrbs() {
    const s = prismBoss;
    if (!s) return;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * TAU;
      s.orbs.push({
        x: s.x + Math.cos(a) * (s.r + 56),
        y: s.y + Math.sin(a) * (s.r + 56),
        r: 16,
        hp: 3,
        maxHp: 3,
        baseA: a,
        t: 0,
        life: 8,
        hitT: 0
      });
    }
  }

  function prismRayHit(p, s, ang) {
    const len = 1600;
    const dx = p.x - s.x;
    const dy = p.y - s.y;
    const t = dx * Math.cos(ang) + dy * Math.sin(ang);
    if (t < 0 || t > len) return false;
    const hx = s.x + Math.cos(ang) * t;
    const hy = s.y + Math.sin(ang) * t;
    return hyp(p.x - hx, p.y - hy) < 13;
  }

  function updatePrismOrbs(dt) {
    const s = prismBoss;
    if (!s) return;
    const p = player;
    for (let i = s.orbs.length - 1; i >= 0; i--) {
      const o = s.orbs[i];
      o.t += dt;
      o.life -= dt;
      o.hitT = Math.max(0, o.hitT - dt);

      if (o.life <= 0 || o.hp <= 0) {
        burst(o.x, o.y, 10, COL.violet, 210, 0.5, 2.2);
        s.orbs.splice(i, 1);
        continue;
      }

      if (o.t < 1.3) {
        const a = o.baseA + o.t * 2.0;
        o.x = s.x + Math.cos(a) * (s.r + 56);
        o.y = s.y + Math.sin(a) * (s.r + 56);
      } else {
        const a = Math.atan2(p.y - o.y, p.x - o.x);
        o.x += Math.cos(a) * 195 * dt;
        o.y += Math.sin(a) * 195 * dt;
      }

      if (Math.random() < 0.25) {
        pushPart({
          x: o.x, y: o.y, vx: rnd(-25, 25), vy: rnd(-25, 25),
          life: 0.28, max: 0.28, color: COL.violet, size: 1.8, drag: 2
        });
      }

      if (p.inv <= 0 && hyp(p.x - o.x, p.y - o.y) < p.r + o.r) hurtPlayer(1);
    }
  }

  function updatePrismBoss(dt) {
    const s = prismBoss;
    if (!s) return;
    const p = player;

    s.t += dt;
    s.spin += dt * 0.9;
    s.hitT = Math.max(0, s.hitT - dt);
    s.lastHitT += dt;

    // 护盾脱战 4 秒后缓慢回充
    if (s.shield < s.maxShield && s.lastHitT > 4) {
      s.shield = Math.min(s.maxShield, s.shield + s.maxShield * 0.02 * dt);
    }

    // 定期传送到四个角
    s.teleT -= dt;
    if (s.teleT <= 0) {
      s.teleT = rnd(6, 9);
      prismTeleport();
    }

    // 三种攻击轮换
    s.modeT -= dt;
    if (s.modeT <= 0) {
      s.mode = (s.mode + 1) % 3;
      // Boss 转阶段：清掉地雷
      S.mines.length = 0;
      s.modeT = 6.5;
      s.beamAng = rnd(0, TAU);
      s.wallShots = 0;
      s.wallTimer = 0.2;
      if (s.mode === 2) spawnPrismOrbs();
    }

    if (s.mode === 0) {
      // 双旋转激光
      s.beamAng += 1.1 * dt;
      if (p.inv <= 0 && (prismRayHit(p, s, s.beamAng) || prismRayHit(p, s, s.beamAng + Math.PI))) {
        hurtPlayer(1);
      }
    } else if (s.mode === 1) {
      // 带缺口的环形弹幕墙，三连发
      s.wallTimer -= dt;
      if (s.wallTimer <= 0 && s.wallShots < 3) {
        s.wallTimer = 0.75;
        s.wallShots++;
        const n = 20;
        const gapStart = rint(0, n - 1);
        for (let k = 0; k < n; k++) {
          if ((k - gapStart + n) % n < 4) continue;
          bossShot(s.x, s.y, (k / n) * TAU + rnd(-0.03, 0.03), 175);
        }
      }
    }

    // 光球一旦出场就按自己的寿命持续追击；之前只在光球模式下更新，
    // 模式切走后会整片定格在画面上（不移动、也不伤人）
    updatePrismOrbs(dt);

    if (p.inv <= 0 && hyp(p.x - s.x, p.y - s.y) < p.r + s.r * 0.9) hurtPlayer(1);

    if (s.hp <= 0) defeatPrismBoss();
  }

  function damagePrism(dmg, x, y, armor) {
    const s = prismBoss;
    if (!s || s.hp <= 0) return;
    s.lastHitT = 0;

    let rest = dmg;
    if (s.shield > 0 && !armor) {
      const absorbed = Math.min(s.shield, rest);
      s.shield -= absorbed;
      rest -= absorbed;
      if (bossFxOk()) burst(x, y, 4, '#8fe8ff', 150, 0.3, 2);
    }
    if (rest > 0) s.hp = Math.max(0, s.hp - rest);

    s.hitT = 0.12;
    if (bossFxOk()) burst(x, y, 5, COL.cyan, 160, 0.32, 2.2);
    if (hitSoundOk()) SFX.hit();

    if (s.hp <= 0) {
      burst(s.x, s.y, 40, '#8fe8ff', 380, 1, 3);
      S.shake = Math.min(16, S.shake + 4);
      SFX.boom();
    }
  }

  function damagePrismOrb(o, dmg, x, y) {
    if (!o || o.hp <= 0) return;
    o.hp -= dmg;
    o.hitT = 0.12;
    if (bossFxOk()) burst(x, y, 5, COL.violet, 160, 0.3, 2);
    if (hitSoundOk()) SFX.hit();
    if (o.hp <= 0) {
      burst(o.x, o.y, 16, COL.violet, 250, 0.6, 2.4);
      S.score += 40;
    }
  }

  function prismHitPoint(b) {
    const s = prismBoss;
    if (!s || s.hp <= 0) return null;
    for (let i = 0; i < s.orbs.length; i++) {
      const o = s.orbs[i];
      if (o.hp <= 0) continue;
      const rr = o.r + b.r;
      if ((b.x - o.x) ** 2 + (b.y - o.y) ** 2 <= rr * rr) {
        return { orb: o, x: o.x, y: o.y };
      }
    }
    const rr = s.r + b.r;
    if ((b.x - s.x) ** 2 + (b.y - s.y) ** 2 <= rr * rr) {
      return { orb: null, x: s.x, y: s.y };
    }
    return null;
  }

  function defeatPrismBoss() {
    const s = prismBoss;
    if (!s) return;
    const bonus = Math.round(6000 * comboMult());
    bossDeathVFX('prism', s.x, s.y, '#8fe8ff');
    for (let i = 0; i < s.orbs.length; i++) {
      burst(s.orbs[i].x, s.orbs[i].y, 12, COL.violet, 260, 0.7, 2.4);
    }
    burst(s.x, s.y, 60, '#8fe8ff', 420, 1.1, 3);
    S.score += bonus;
    texts.push({
      x: W / 2, y: H * 0.45, vy: -30, life: 1.8, max: 1.8,
      str: '+' + bonus, color: COL.gold
    });
    player.hp = Math.min(player.maxHp, player.hp + 1);

    S.shake = 22;
    S.flash = 1.2;
    S.banner = '棱镜要塞已瓦解';
    S.bannerT = 3;
    SFX.die();

    prismBoss = null;
    S.bossActive = false;
    S.bossType = null;
    S.boss4Done = true;
    S.wave = 17;
    S.waveT = 0;
    spawnTimer = 2.5;
    afterBossKill('prism', bonus);
  }

  function updateEnemies(dt) {
    const p = player;

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.t += dt;
      e.hitT = Math.max(0, e.hitT - dt);
      if (e.satCd > 0) e.satCd = Math.max(0, e.satCd - dt);

      // 燃烧按正常游戏时间跳伤，不受减速力场影响
      const db = e.debuffs;
      if (db) {
        if (db.slow.t > 0) db.slow.t = Math.max(0, db.slow.t - dt);
        const br = db.burn;
        if (br.t > 0) {
          br.t -= dt;
          br.tick -= dt;
          if (br.tick <= 0) {
            br.tick += 0.5;
            damageEnemy(e, br.dps * 0.5, e.x, e.y);
            if (e.hp <= 0 || enemies.indexOf(e) < 0) continue;
          }
          if (br.t <= 0) { br.t = 0; br.dps = 0; }
        }
      }

      const dx = p.x - e.x;
      const dy = p.y - e.y;
      const d = Math.max(1, hyp(dx, dy));
      const nx = dx / d;
      const ny = dy / d;
      let moveByV = true;

      if (e.stunT > 0) {
        e.stunT -= dt;
        e.vx *= Math.exp(-6 * dt);
        e.vy *= Math.exp(-6 * dt);
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        continue;
      }
      const prevX = e.x;
      const prevY = e.y;

      if (e.type === 'chaser') {
        e.vx = lerp(e.vx, nx * e.speed, 1 - Math.exp(-5 * dt));
        e.vy = lerp(e.vy, ny * e.speed, 1 - Math.exp(-5 * dt));
        e.ang = Math.atan2(e.vy, e.vx);
      } else if (e.type === 'dasher') {
        if (e.state === 'dash') {
          moveByV = false;
          e.stateT -= dt;
          e.x += e.dashX * e.speed * 8 * dt;
          e.y += e.dashY * e.speed * 8 * dt;
          e.ang = Math.atan2(e.dashY, e.dashX);
          if (Math.random() < 0.15) {
            pushPart({
              x: e.x, y: e.y, vx: rnd(-30, 30), vy: rnd(-30, 30),
              life: 0.25, max: 0.25, color: COL.gold, size: 2, drag: 2
            });
          }
          if (e.stateT <= 0) { e.state = 'chase'; e.stateT = rnd(0.9, 1.5); }
        } else if (e.state === 'wind') {
          e.stateT -= dt;
          e.vx *= Math.exp(-9 * dt);
          e.vy *= Math.exp(-9 * dt);
          e.ang = Math.atan2(ny, nx);
          if (e.stateT <= 0) {
            e.state = 'dash';
            e.stateT = 0.31;
            e.dashX = nx;
            e.dashY = ny;
          }
        } else {
          e.stateT -= dt;
          e.vx = lerp(e.vx, nx * e.speed, 1 - Math.exp(-3 * dt));
          e.vy = lerp(e.vy, ny * e.speed, 1 - Math.exp(-3 * dt));
          e.ang = Math.atan2(e.vy, e.vx);
          if (e.stateT <= 0) { e.state = 'wind'; e.stateT = 0.5; }
        }
      } else if (e.type === 'tank') {
        e.vx = lerp(e.vx, nx * e.speed, 1 - Math.exp(-2.2 * dt));
        e.vy = lerp(e.vy, ny * e.speed, 1 - Math.exp(-2.2 * dt));
        e.ang = Math.atan2(e.vy, e.vx);
      } else if (e.type === 'gunner') {
        const want = 270;
        let mx = 0, my = 0;
        if (d > want + 45) { mx = nx; my = ny; }
        else if (d < want - 45) { mx = -nx; my = -ny; }
        const strafeDir = Math.floor(e.t * 0.7) % 2 === 0 ? 1 : -1;
        mx += -ny * strafeDir * 0.75;
        my += nx * strafeDir * 0.75;
        const mm = Math.max(1, hyp(mx, my));
        e.vx = lerp(e.vx, (mx / mm) * e.speed, 1 - Math.exp(-2.5 * dt));
        e.vy = lerp(e.vy, (my / mm) * e.speed, 1 - Math.exp(-2.5 * dt));
        e.ang = Math.atan2(ny, nx);

        e.fireCd -= dt;
        if (e.fireCd <= 0 && d < 760) {
          e.fireCd = rnd(1.5, 2.4);
          enemyShot(e.x, e.y, Math.atan2(dy, dx) + rnd(-0.06, 0.06));
        }
      } else if (e.type === 'snake') {
        const desired = Math.atan2(dy, dx);
        let diff = desired - e.ang;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const maxTurn = 2.3 * dt;
        e.ang += clamp(diff, -maxTurn, maxTurn);
        e.x += Math.cos(e.ang) * e.speed * dt;
        e.y += Math.sin(e.ang) * e.speed * dt;
        moveByV = false;

        e.path.unshift({ x: e.x, y: e.y });
        if (e.path.length > 260) e.path.pop();
        e.segs = snakeSegments(e);
      } else if (e.type === 'spider') {
        const want = 250;
        let mx = 0, my = 0;
        if (d > want + 40) { mx = nx; my = ny; }
        else if (d < want - 40) { mx = -nx; my = -ny; }
        const strafe = Math.sin(e.t * 1.7) >= 0 ? 1 : -1;
        mx += -ny * strafe * 0.9;
        my += nx * strafe * 0.9;
        const mm = Math.max(1, hyp(mx, my));
        e.vx = lerp(e.vx, (mx / mm) * e.speed, 1 - Math.exp(-3 * dt));
        e.vy = lerp(e.vy, (my / mm) * e.speed, 1 - Math.exp(-3 * dt));
        e.ang = Math.atan2(ny, nx);

        e.fireCd -= dt;
        if (e.fireCd <= 0 && d < 640) {
          e.fireCd = rnd(2.2, 3.2);
          const a = Math.atan2(dy, dx);
          for (let k = -2; k <= 2; k++) enemyShot(e.x, e.y, a + k * 0.22);
        }
      } else if (e.type === 'bomber') {
        if (e.state === 'fuse') {
          e.stateT -= dt;
          e.vx *= Math.exp(-9 * dt);
          e.vy *= Math.exp(-9 * dt);
          if (e.stateT <= 0) {
            explodeBomber(e, i);
            continue;
          }
        } else {
          e.vx = lerp(e.vx, nx * e.speed, 1 - Math.exp(-6 * dt));
          e.vy = lerp(e.vy, ny * e.speed, 1 - Math.exp(-6 * dt));
          e.ang = Math.atan2(e.vy, e.vx);
          if (d < 95) {
            e.state = 'fuse';
            e.stateT = 0.5;
          }
        }
      } else if (e.type === 'splitter' || e.type === 'splitling') {
        e.vx = lerp(e.vx, nx * e.speed, 1 - Math.exp(-4 * dt));
        e.vy = lerp(e.vy, ny * e.speed, 1 - Math.exp(-4 * dt));
        e.ang = Math.atan2(e.vy, e.vx);
      } else if (e.type === 'shield') {
        e.vx = lerp(e.vx, nx * e.speed, 1 - Math.exp(-2.8 * dt));
        e.vy = lerp(e.vy, ny * e.speed, 1 - Math.exp(-2.8 * dt));
        e.ang = Math.atan2(e.vy, e.vx);
      } else if (e.type === 'teleporter') {
        if (e.state === 'blink') {
          moveByV = false;
          e.stateT -= dt;
          e.vx *= Math.exp(-10 * dt);
          e.vy *= Math.exp(-10 * dt);
          e.ang = Math.atan2(ny, nx);
          if (e.stateT <= 0) {
            burst(e.x, e.y, 10, e.color, 200, 0.4, 2);
            e.x = e.bx;
            e.y = e.by;
            e.state = 'chase';
            e.blinkCd = rnd(3.0, 4.4);
            spawnRing(e.x, e.y, 46, e.color, 0.35, 2);
            burst(e.x, e.y, 14, e.color, 260, 0.5, 2.4);
            if (hitSoundOk()) SFX.blink(e.x);
          }
        } else {
          e.vx = lerp(e.vx, nx * e.speed, 1 - Math.exp(-3 * dt));
          e.vy = lerp(e.vy, ny * e.speed, 1 - Math.exp(-3 * dt));
          e.ang = Math.atan2(e.vy, e.vx);
          e.blinkCd -= dt;
          if (e.blinkCd <= 0 && d > 150) {
            const ba = rnd(0, TAU);
            const br = rnd(110, 165);
            e.bx = clamp(p.x + Math.cos(ba) * br, 28, W - 28);
            e.by = clamp(p.y + Math.sin(ba) * br, 28, H - 28);
            e.state = 'blink';
            e.stateT = 0.45;
            spawnRing(e.bx, e.by, 34, e.color, 0.45, 2);
          }
        }
      } else if (e.type === 'summoner') {
        moveByV = false;
        e.vx *= Math.exp(-6 * dt);
        e.vy *= Math.exp(-6 * dt);
        e.ang = Math.atan2(ny, nx);
        e.summonCd -= dt;
        if (e.summonCd <= 0) {
          e.summonCd = 2.9;
          if (enemies.length < 62) {
            summonMinion(e);
            burst(e.x, e.y, 8, e.color, 180, 0.45, 2);
            spawnRing(e.x, e.y, 40, e.color, 0.4, 2);
          }
        }
      }

      if (moveByV) {
        e.x += e.vx * dt;
        e.y += e.vy * dt;
      }

      // 减速力场：按本帧位移回拉，对冲刺 / 传送之外的所有移动都生效
      const sfLv = skillLv('slowfield');
      if (sfLv > 0) {
        const sr = slowRadius();
        const sdx = e.x - p.x;
        const sdy = e.y - p.y;
        if (sdx * sdx + sdy * sdy <= sr * sr) {
          const ratio = slowRatio();
          e.x = prevX + (e.x - prevX) * (1 - ratio);
          e.y = prevY + (e.y - prevY) * (1 - ratio);
          e.debuffs.slow.t = 0.15;
          e.debuffs.slow.ratio = ratio;
        }
      }

      // 相位闪避：无敌期间撞到敌人会造成伤害
      if (S.phaseT > 0 && hyp(p.x - e.x, p.y - e.y) < p.r + e.r + 4) {
        damageEnemy(e, S.phaseDmg, e.x, e.y);
        if (enemies.indexOf(e) < 0) continue;
      }

      if (p.inv <= 0) {
        let contact = hyp(p.x - e.x, p.y - e.y) < p.r + e.r;
        if (contact && e.type === 'teleporter' && e.state === 'blink') contact = false;
        if (!contact && e.type === 'snake' && e.segs) {
          for (let k = 0; k < e.segs.length; k++) {
            const s = e.segs[k];
            if (hyp(p.x - s.x, p.y - s.y) < p.r + s.r) { contact = true; break; }
          }
        }

        if (contact) {
          hurtPlayer(1);
          if (e.type === 'bomber') {
            explodeBomber(e, i);
            continue;
          }
          const sturdy = e.type === 'tank' || e.type === 'snake' || e.type === 'spider' ||
            e.type === 'splitter' || e.type === 'splitling' || e.type === 'shield' ||
            e.type === 'teleporter' || e.type === 'summoner';
          if (!sturdy) {
            burst(e.x, e.y, 16, e.color, 260, 0.6, 2.4);
            enemies.splice(i, 1);
            continue;
          } else {
            e.x -= nx * 26;
            e.y -= ny * 26;
            e.vx = -nx * 300;
            e.vy = -ny * 300;
          }
        }
      }

      if (Math.abs(e.x) > 4000 || Math.abs(e.y) > 4000) enemies.splice(i, 1);
    }
  }

  // 完美闪避：冲刺起手窗口内擦到敌人/弹幕，抵消这次接触并给奖励
  function updatePerfectDodge(dt) {
    if (S.perfectT <= 0 || !player) return;
    S.perfectT -= dt;
    const p = player;
    const pad = p.r + 6;
    let hit = false;

    for (let i = 0; i < ebullets.length && !hit; i++) {
      const b = ebullets[i];
      const rr = b.r + pad;
      if ((b.x - p.x) * (b.x - p.x) + (b.y - p.y) * (b.y - p.y) <= rr * rr) hit = true;
    }
    for (let i = 0; i < enemies.length && !hit; i++) {
      const e = enemies[i];
      const rr = e.r + pad;
      if ((e.x - p.x) * (e.x - p.x) + (e.y - p.y) * (e.y - p.y) <= rr * rr) hit = true;
    }
    if (!hit && S.bossActive) {
      if (S.bossType === 'snake' && boss) {
        for (let i = 0; i < boss.parts.length && !hit; i++) {
          const q = boss.parts[i];
          if (q.hp <= 0) continue;
          const rr = q.r + pad;
          if ((q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y) <= rr * rr) hit = true;
        }
      } else if (S.bossType === 'twin' && twinBoss) {
        for (let i = 0; i < twinBoss.spheres.length && !hit; i++) {
          const q = twinBoss.spheres[i];
          if (q.hp <= 0) continue;
          const rr = q.r + pad;
          if ((q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y) <= rr * rr) hit = true;
        }
      } else if (S.bossType === 'spider' && spiderBoss && spiderBoss.hp > 0) {
        const rr = spiderBoss.r + pad;
        if ((spiderBoss.x - p.x) * (spiderBoss.x - p.x) + (spiderBoss.y - p.y) * (spiderBoss.y - p.y) <= rr * rr) hit = true;
      } else if (S.bossType === 'prism' && prismBoss && prismBoss.hp > 0) {
        const rr = prismBoss.r + pad;
        if ((prismBoss.x - p.x) * (prismBoss.x - p.x) + (prismBoss.y - p.y) * (prismBoss.y - p.y) <= rr * rr) hit = true;
      }
    }
    if (hit) triggerPerfectDodge();
  }

  function triggerPerfectDodge() {
    S.perfectT = 0;
    S.perfectCount++;
    S.slowT = Math.max(S.slowT, 0.3);
    S.flash = Math.max(S.flash, 0.3);
    S.shake = Math.min(14, S.shake + 4);
    player.inv = Math.max(player.inv, 0.4);
    spawnRing(player.x, player.y, 130, COL.cyan, 0.45, 4);
    burst(player.x, player.y, 18, COL.cyan, 240, 0.5, 2.4);
    texts.push({
      x: player.x, y: player.y - 26, vy: -34, life: 1.1, max: 1.1,
      str: '完美闪避', color: COL.cyan
    });
    gainXP(1);
    if (SFX.perfect) SFX.perfect();
  }

  function hurtPlayer(n) {
    const p = player;
    if (p.inv > 0) return;
    applyHitstop(0.06);

    let rest = n;
    if (p.shield > 0) {
      const absorbed = Math.min(p.shield, rest);
      p.shield -= absorbed;
      rest -= absorbed;
      burst(p.x, p.y, 14, COL.cyan, 240, 0.55, 2.4);
    }
    if (rest > 0) p.hp -= rest;
    S.wasHit = true;  // 护盾吸收同样算受伤
    S.sinceHurt = 0;
    S.shieldAcc = 0;

    p.inv = 1.0;
    S.shake = 20;
    S.flash = 0.7;
    S.combo = 0;
    S.comboT = 0;
    burst(p.x, p.y, 24, COL.pink, 300, 0.7, 2.6);
    SFX.hurt();
    if (p.hp <= 0) die();
  }

  function die() {
    S.mode = 'dead';
    S.deadT = 0;
    S.hitstop = 0;
    S.pendingBursts.length = 0;
    clearFieldEntities();
    S.shake = 26;
    bgmStop();
    burst(player.x, player.y, 70, COL.cyan, 430, 1.3, 2.8);
    burst(player.x, player.y, 30, COL.pink, 300, 1.1, 2.4);
    SFX.die();
    if (S.score > S.best) {
      S.best = S.score;
      S.newBest = true;
      saveBest();
    }
    saveStats();
  }

  function bulletHitPoint(e, b) {
    if (e.type === 'snake' && e.segs) {
      const headRR = e.r + b.r;
      if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 <= headRR * headRR) return { x: e.x, y: e.y };
      for (let k = 0; k < e.segs.length; k++) {
        const s = e.segs[k];
        const rr = s.r + b.r;
        if ((b.x - s.x) ** 2 + (b.y - s.y) ** 2 <= rr * rr) return { x: s.x, y: s.y };
      }
      return null;
    }
    const rr = e.r + b.r;
    return (b.x - e.x) ** 2 + (b.y - e.y) ** 2 <= rr * rr ? { x: e.x, y: e.y } : null;
  }

  function bossHitPoint(b) {
    if (!boss) return null;

    // 先判定体节圆
    for (let i = 0; i < boss.parts.length; i++) {
      const p = boss.parts[i];
      if (p.hp <= 0) continue;
      const rr = p.r + b.r;
      if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 <= rr * rr) {
        return { part: p, x: p.x, y: p.y };
      }
    }

    // 再判定相邻两节之间的「躯干」，避免子弹从节与节之间穿过去
    let best = null;
    let bestD = Infinity;
    let bestPart = null;
    for (let i = 0; i < boss.parts.length - 1; i++) {
      const a = boss.parts[i];
      const c = boss.parts[i + 1];
      if (a.hp <= 0 || c.hp <= 0) continue;

      const dx = c.x - a.x;
      const dy = c.y - a.y;
      const len2 = dx * dx + dy * dy || 1;
      const t = clamp(((b.x - a.x) * dx + (b.y - a.y) * dy) / len2, 0, 1);
      const hx = a.x + dx * t;
      const hy = a.y + dy * t;
      const rr = Math.min(a.r, c.r) * 0.85 + b.r;
      const d = (b.x - hx) ** 2 + (b.y - hy) ** 2;

      if (d <= rr * rr && d < bestD) {
        bestD = d;
        best = { x: hx, y: hy };
        const da = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
        const dc = (b.x - c.x) ** 2 + (b.y - c.y) ** 2;
        bestPart = da <= dc ? a : c;
      }
    }
    return best ? { part: bestPart, x: best.x, y: best.y } : null;
  }

  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];

      // 追踪：只追附近目标，转向速度有限，不会 180 度急拐
      if (b.homing && !b.shard) {
        const hlv = b.homingLv || 1;
        // 蜂群会指定各自目标，目标死了再回落到最近的敌人
        const t = (b.target && b.target.hp > 0 && enemies.indexOf(b.target) >= 0)
          ? b.target
          : nearestEnemyTo(b.x, b.y, 280 + hlv * 60);
        if (t) {
          const desired = Math.atan2(t.y - b.y, t.x - b.x);
          let cur = Math.atan2(b.vy, b.vx);
          let diff = desired - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          const turn = 2.4 + hlv * 0.6;
          cur += clamp(diff, -turn * dt, turn * dt);
          const sp = b.speed || 585;
          b.vx = Math.cos(cur) * sp;
          b.vy = Math.sin(cur) * sp;
          b.ang = cur;
        }
      }

      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      // 集束雷：碎片自然落地时二次爆炸
      if (b.life <= 0) {
        if (b.cluster) explodeAt(b.x, b.y, null, 58, 1);
        bullets.splice(i, 1);
        continue;
      }
      if (b.x < -80 || b.x > W + 80 || b.y < -80 || b.y > H + 80) {
        bullets.splice(i, 1);
        continue;
      }

      let consumed = false;
      const critChance = critChanceNow();
      const isCrit = critChance > 0 && Math.random() < critChance;
      const hitDmg = b.dmg * (isCrit ? 1.8 : 1);
      const burnLv = skillLv('burn');
      const chainLv = skillLv('chain');
      if (isCrit && critTextOk()) {
        texts.push({
          x: b.x, y: b.y - 10, vy: -34, life: 0.6, max: 0.6,
          str: '暴击', color: COL.gold
        });
      }

      // 打 Boss：蛇王体节减伤 50%，双子球没有减伤
      if (S.bossActive && S.bossType === 'snake' && boss) {
        const bp = bossHitPoint(b);
        if (bp) {
          damageBossPart(bp.part, hitDmg, bp.x, bp.y);
          if (burnLv > 0) applyBurnBoss(bp.part, 2 + burnLv);
          if (chainLv > 0 && !b.shard) chainFromBullet(bp.x, bp.y, chainLv, 1, bp.part);
          if (b.explode) explodeAt(bp.x, bp.y, null, explodeRadius(b), explodeDamage(b));
          if (b.split && !b.shard) spawnShards(b, bp.x, bp.y);
          if (b.pierceLeft > 0) {
            b.pierceLeft -= 1;
            b.x += b.vx * dt * 2;
            b.y += b.vy * dt * 2;
          } else {
            bullets.splice(i, 1);
            consumed = true;
          }
        }
      } else if (S.bossActive && S.bossType === 'twin' && twinBoss) {
        const tp = twinHitPoint(b);
        if (tp) {
          damageTwinSphere(tp.sphere, hitDmg, tp.x, tp.y);
          if (burnLv > 0) applyBurnBoss(tp.sphere, 2 + burnLv);
          if (chainLv > 0 && !b.shard) chainFromBullet(tp.x, tp.y, chainLv, 1, tp.sphere);
          if (b.explode) explodeAt(tp.x, tp.y, null, explodeRadius(b), explodeDamage(b));
          if (b.split && !b.shard) spawnShards(b, tp.x, tp.y);
          if (b.pierceLeft > 0) {
            b.pierceLeft -= 1;
            b.x += b.vx * dt * 2;
            b.y += b.vy * dt * 2;
          } else {
            bullets.splice(i, 1);
            consumed = true;
          }
        }
      } else if (S.bossActive && S.bossType === 'spider' && spiderBoss) {
        const sp = spiderHitPoint(b);
        if (sp) {
          damageSpiderHead(hitDmg, sp.x, sp.y);
          if (burnLv > 0) applyBurnBoss(spiderBoss, 2 + burnLv);
          if (chainLv > 0 && !b.shard) chainFromBullet(sp.x, sp.y, chainLv, 1, spiderBoss);
          if (b.explode) explodeAt(sp.x, sp.y, null, explodeRadius(b), explodeDamage(b));
          if (b.split && !b.shard) spawnShards(b, sp.x, sp.y);
          if (b.pierceLeft > 0) {
            b.pierceLeft -= 1;
            b.x += b.vx * dt * 2;
            b.y += b.vy * dt * 2;
          } else {
            bullets.splice(i, 1);
            consumed = true;
          }
        }
      } else if (S.bossActive && S.bossType === 'prism' && prismBoss) {
        const pp = prismHitPoint(b);
        if (pp) {
          if (pp.orb) damagePrismOrb(pp.orb, hitDmg, pp.x, pp.y);
          else {
            damagePrism(hitDmg, pp.x, pp.y, b.armor);
            if (burnLv > 0) applyBurnBoss(prismBoss, 2 + burnLv);
          }
          if (chainLv > 0 && !b.shard) chainFromBullet(pp.x, pp.y, chainLv, 1, pp.orb || prismBoss);
          if (b.explode) explodeAt(pp.x, pp.y, null, explodeRadius(b), explodeDamage(b));
          if (b.split && !b.shard) spawnShards(b, pp.x, pp.y);
          if (b.pierceLeft > 0) {
            b.pierceLeft -= 1;
            b.x += b.vx * dt * 2;
            b.y += b.vy * dt * 2;
          } else {
            bullets.splice(i, 1);
            consumed = true;
          }
        }
      }
      if (consumed) continue;

      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!e) continue;
        if (b.ricochetLeft > 0 && e.bounceMark === b) continue;
        const pt = bulletHitPoint(e, b);
        if (!pt) continue;

        damageEnemy(e, hitDmg, pt.x, pt.y, b.armor);
        if (burnLv > 0) applyBurnEnemy(e, 2 + burnLv);
        if (chainLv > 0 && !b.shard) chainFromBullet(pt.x, pt.y, chainLv, 1, e);
        if (hitSoundOk()) SFX.hit(pt.x);

        if (b.explode) explodeAt(pt.x, pt.y, e, explodeRadius(b), explodeDamage(b));
        if (b.cluster) explodeAt(pt.x, pt.y, e, 58, 1);
        if (b.split && !b.shard) spawnShards(b, pt.x, pt.y);

        if (b.ricochetLeft > 0) {
          const next = nearestEnemyTo(pt.x, pt.y, 420, e);
          e.bounceMark = b;
          if (next) {
            if (b.bounced > 0) b.dmg *= 0.75;
            b.bounced++;
            b.ricochetLeft--;
            const ang = Math.atan2(next.y - pt.y, next.x - pt.x);
            b.x = pt.x + Math.cos(ang) * 14;
            b.y = pt.y + Math.sin(ang) * 14;
            b.ang = ang;
            const sp2 = b.speed || 585;
            b.vx = Math.cos(ang) * sp2;
            b.vy = Math.sin(ang) * sp2;
            break;
          }
        }

        if (b.pierceLeft > 0) {
          b.pierceLeft -= 1;
          b.x += b.vx * dt * 2;
          b.y += b.vy * dt * 2;
        } else {
          bullets.splice(i, 1);
          consumed = true;
          break;
        }
      }
      if (consumed) continue;
    }
  }

  // 统一伤害入口：护盾兵先扣护盾，再扣血；破甲弹直接穿透护盾
  function damageEnemy(e, dmg, x, y, armor) {
    if (!e) return;
    let rest = dmg;
    if (e.shield > 0 && !armor) {
      const absorbed = Math.min(e.shield, rest);
      e.shield -= absorbed;
      rest -= absorbed;
      burst(x, y, 6, '#8fe8ff', 150, 0.3, 2.2);
      if (e.shield <= 0) {
        burst(x, y, 14, '#8fe8ff', 260, 0.55, 2.6);
        spawnRing(x, y, 46, '#8fe8ff', 0.35, 3);
        SFX.shieldBreak(x);
      }
    }
    e.hitT = 0.09;
    if (rest <= 0) return;
    e.hp -= rest;
    burst(x, y, 5, e.color, 150, 0.3, 2);
    if (e.hp <= 0) killEnemyRef(e);
  }

  function explodeBomber(e, idx) {
    const R = 118;
    spawnRing(e.x, e.y, R, '#ff7a5c', 0.45, 4);
    burst(e.x, e.y, 22, '#ff7a5c', 330, 0.7, 2.8);
    S.shake = Math.min(14, S.shake + 5);
    SFX.boom(e.x);
    if (player.inv <= 0) {
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      if (dx * dx + dy * dy <= (R + player.r) * (R + player.r)) hurtPlayer(1);
    }
    if (enemies[idx] === e) enemies.splice(idx, 1);
  }

      vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
      ang: a, hitT: 0, t: rnd(0, 10),

      segCount: 0, path: null, segs: null,
      stunT: 0, gen: 0, shield: 0, maxShield: 0,
      blinkCd: 0, bx: 0, by: 0, summonCd: 0,

    });

  function spawnSplitChildren(e) {
    const gen = (e.gen || 0) + 1;
    const cfg = ENEMY.splitling;
    for (let k = 0; k < 2; k++) {
      if (enemies.length >= 68) break;

        x: e.x + Math.cos(a) * (e.r + 6),

        hp: 1, maxHp: 1,
        speed: cfg.speed * (gen === 2 ? 1.15 : 1),
        color: cfg.color, score: gen === 2 ? 6 : 10,
        vx: Math.cos(a) * 140, vy: Math.sin(a) * 140,
        ang: a, hitT: 0, t: rnd(0, 10),
        state: 'chase', stateT: 0.8, dashX: 1, dashY: 0, fireCd: 1.2,
        segCount: 0, path: null, segs: null,
        stunT: 0, shield: 0, maxShield: 0,
        blinkCd: 0, bx: 0, by: 0, summonCd: 0,
        debuffs: newDebuffs(), satCd: 0, bounceMark: null, bladeHit: null
      });
    }
    spawnRing(e.x, e.y, 34, '#b48cff', 0.35, 2);
  }

  function killEnemy(idx) {
    const e = enemies[idx];
    if (!e) return;
    enemies.splice(idx, 1);
    applyHitstop(0.05);

    S.combo++;
    S.comboT = 3.0;
    const gain = Math.round(e.score * comboMult());
    S.score += gain;
    gainXP(XP_REWARD[e.type] || 1);
    S.totalKills++;
    S.maxCombo = Math.max(S.maxCombo, S.combo);
    texts.push({
      x: e.x, y: e.y, vy: -46, life: 0.85, max: 0.85,
      str: '+' + gain, color: e.color
    });

    if (e.type === 'snake' && e.segs) {
      for (let k = 0; k < e.segs.length; k++) {
        burst(e.segs[k].x, e.segs[k].y, 6, e.color, 190, 0.6, 2);
      }
    }
    killVFX(e);
    if ((e.type === 'splitter' || e.type === 'splitling') && (e.gen || 0) < 2) {
      spawnSplitChildren(e);
    }

    if (S.totalKills === 1) unlockAchievement('first_blood');
    if (S.combo >= 10) unlockAchievement('combo_10');
    if (S.combo >= 20) unlockAchievement('combo_20');
    if (S.score >= 10000) unlockAchievement('score_10k');
    if (S.score >= 50000) unlockAchievement('score_50k');

    stats.totalKillsAll++;
    stats.totalScore += gain;
    stats.bestCombo = Math.max(stats.bestCombo, S.combo);
    statsDirty = true;

    // 角色被动
    if (player && player.charId === 'warrior' && S.totalKills % 10 === 0) {
      if (player.shield < player.maxShield) {
        player.shield++;
        spawnRing(player.x, player.y, 54, COL.cyan, 0.45, 3);
        if (hitSoundOk()) SFX.shield(player.x);
      }
    } else if (player && player.charId === 'mage' && player.skillCd > 0) {
      player.skillCd = Math.max(0, player.skillCd - 0.6);
    }

    if (killSoundOk()) SFX.kill(e.x);

    const roll = Math.random();
    if (roll < 0.07) spawnPickup(e.x, e.y, 'heal');
    else if (roll < 0.28) spawnPickup(e.x, e.y, 'score');
  }

  function killEnemyRef(e) {
    const idx = enemies.indexOf(e);
    if (idx >= 0) killEnemy(idx);
  }

  function updateEnemyBullets(dt) {
    const p = player;
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.t += dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      if (b.life <= 0 || b.x < -80 || b.x > W + 80 || b.y < -80 || b.y > H + 80) {
        ebullets.splice(i, 1);
        continue;
      }

      const rr = p.r + b.r;
      if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= rr * rr) {
        if (p.inv <= 0) hurtPlayer(1);
        burst(b.x, b.y, 10, b.color || COL.violet, 200, 0.5, 2);
        ebullets.splice(i, 1);
      }
    }
  }

  function spawnPickup(x, y, kind) {
    picks.push({
      x, y, kind, vx: rnd(-40, 40), vy: rnd(-40, 40),
      r: 9, t: 0, life: 14
    });
  }

  function updatePickups(dt) {
    const p = player;
    const magnetLv = skillLv('magnet');
    const pullR = 175 + magnetLv * 60;
    const pullBase = 560 + magnetLv * 40;
    const pullMin = 140 + magnetLv * 15;
    for (let i = picks.length - 1; i >= 0; i--) {
      const k = picks[i];
      k.t += dt;
      k.life -= dt;

      const dx = p.x - k.x;
      const dy = p.y - k.y;
      const d = Math.max(1, hyp(dx, dy));

      if (d < pullR) {
        const pull = pullBase * (1 - d / pullR) + pullMin;
        k.vx += (dx / d) * pull * dt;
        k.vy += (dy / d) * pull * dt;
      }
      const drag = Math.exp(-2.2 * dt);
      k.vx *= drag;
      k.vy *= drag;
      k.x += k.vx * dt;
      k.y += k.vy * dt;

      if (d < p.r + k.r + 6) {
        if (k.kind === 'heal') {
          if (p.hp < p.maxHp) {
            p.hp = Math.min(p.maxHp, p.hp + 1);
            texts.push({ x: k.x, y: k.y, vy: -46, life: 0.9, max: 0.9, str: '+1 HP', color: COL.pink });
          } else if (p.shield < p.maxShield) {
            p.shield = Math.min(p.maxShield, p.shield + 1);
            texts.push({ x: k.x, y: k.y, vy: -46, life: 0.9, max: 0.9, str: '+1 护盾', color: COL.cyan });
          } else {
            texts.push({ x: k.x, y: k.y, vy: -46, life: 0.9, max: 0.9, str: '满护盾', color: 'rgba(160,220,255,0.8)' });
          }
        } else {
          const g = Math.round(30 * comboMult());
          S.score += g;
          texts.push({ x: k.x, y: k.y, vy: -46, life: 0.9, max: 0.9, str: '+' + g, color: COL.cyan });
        }
        burst(k.x, k.y, 12, k.kind === 'heal' ? COL.pink : COL.cyan, 170, 0.5, 2);
        SFX.pickup(k.x);
        picks.splice(i, 1);
        continue;
      }
      if (k.life <= 0) picks.splice(i, 1);
    }
  }

  // 粒子统一入口：全局上限 300，超出时丢弃最老的
  function pushPart(q) {
    if (parts.length >= 300) parts.shift();
    parts.push(q);
  }

  function burst(x, y, n, color, speed, life, size) {
    if (!glowMul) n = Math.max(2, Math.round(n * 0.5));
    // 接近上限时降密度，避免多杀瞬间拉高绘制与 GC 压力
    if (parts.length > 260) n = Math.max(2, Math.round(n * 0.6));
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU);
      const s = rnd(speed * 0.2, speed);
      const l = rnd(life * 0.5, life);
      pushPart({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: l, max: l,
        color, size: rnd(1.2, size || 2.4),
        drag: rnd(1.6, 4)
      });
    }
  }

  // ---------------------------------------------------------------- 顿帧 / 击杀特效
  function applyHitstop(dur, force) {
    if (S.hitstopCd > 0 && !force) return;  // 冷却中，避免高频命中累积卡顿
    S.hitstop = Math.max(S.hitstop, dur);
    S.hitstopCd = 0.1;
  }

  function scheduleBurst(delay, opts) {
    S.pendingBursts.push({
      t: delay,
      x: opts.x, y: opts.y, n: opts.n, color: opts.color,
      speed: opts.speed, life: opts.life, size: opts.size,
      shake: opts.shake || 0
    });
  }

  // 延迟爆炸随 update 一起冻结：暂停 / 死亡后不会再冒粒子
  function updatePendingBursts(dt) {
    for (let i = S.pendingBursts.length - 1; i >= 0; i--) {
      const b = S.pendingBursts[i];
      b.t -= dt;
      if (b.t <= 0) {
        burst(b.x, b.y, b.n, b.color, b.speed, b.life, b.size);
        if (b.shake) S.shake = Math.min(30, S.shake + b.shake);
        S.pendingBursts.splice(i, 1);
      }
    }
  }

  // 击杀特效分级：S / A / B / C
  function killVFX(e) {
    if (!e) return;
    switch (e.type) {
      case 'tank':
      case 'snake':
      case 'spider':
      case 'splitter':
      case 'summoner':
        // A 级：厚实目标，延迟二次爆炸
        burst(e.x, e.y, 35, e.color, 340, 0.9, 2.8);
        if (S.pendingBursts.length < 6) {
          scheduleBurst(0.15, {
            x: e.x + rnd(-20, 20), y: e.y + rnd(-20, 20),
            n: 20, color: e.color,
            speed: 260, life: 0.6, size: 2.2,
            shake: 4
          });
        }
        S.shake = Math.min(12, S.shake + 4);
        break;

      case 'gunner':
      case 'dasher':
      case 'shield':
      case 'teleporter': {
        // B 级：方向性碎片
        burst(e.x, e.y, 22, e.color, 280, 0.7, 2.4);
        const frags = glowMul ? 6 : 3;
        for (let i = 0; i < frags; i++) {
          const a = rnd(0, TAU);
          pushPart({
            x: e.x, y: e.y,
            vx: Math.cos(a) * rnd(180, 350),
            vy: Math.sin(a) * rnd(180, 350),
            life: rnd(0.3, 0.6), max: 0.6,
            color: e.color, size: rnd(1.5, 3), drag: 1.5
          });
        }
        S.shake = Math.min(10, S.shake + 2.5);
        break;
      }

      default:
        // C 级：最轻的追踪者
        burst(e.x, e.y, 14, e.color, 300, 0.7, 2.6);
        S.shake = Math.min(8, S.shake + 1.5);
    }
  }

  // Boss 死亡：冻结 + 多层爆炸 + 延迟冲击波
  function bossDeathVFX(type, x, y, color) {
    applyHitstop(0.12, true);
    S.slowT = 0.8;
    const baseCount = type === 'prism' ? 120 : type === 'spider' ? 100 : 80;
    burst(x, y, baseCount, color, 400, 1.0, 3.0);
    S.flash = Math.max(S.flash, 1.2);
    S.shake = Math.min(22, S.shake + 6);
    for (let w = 1; w <= 3; w++) {
      scheduleBurst(w * 0.2, {
        x: x + rnd(-80, 80), y: y + rnd(-80, 80),
        n: 30, color: color,
        speed: 400, life: 1.0, size: 3.0,
        shake: 10
      });
    }
  }

  // ---------------------------------------------------------------- 成就
  function unlockAchievement(id) {
    if (S.sessionAch[id]) return;  // 本局已解锁，防重复弹窗
    const def = ACHIEVEMENTS.find(function (a) { return a.id === id; });
    if (!def) return;
    S.sessionAch[id] = true;
    ACH_DATA[id] = Date.now();
    saveAchievements();
    S.achievementPopup = { achievement: def, t: 0, maxT: 2.5 };
    if (SFX.achievement) SFX.achievement();
  }

  function checkWaveProgress() {
    if (S.wave > stats.bestWave) {
      stats.bestWave = S.wave;
      statsDirty = true;
    }
    if (S.wave >= 10 && S.dashCount === 0) unlockAchievement('no_dash');
    if (S.wave >= 20) unlockAchievement('wave_20');
  }

  // 每个 Boss 击杀后统一结算成就与统计
  function afterBossKill(kind, bonus) {
    const map = {
      snake: 'boss_snake',
      twin: 'boss_twin',
      spider: 'boss_spider',
      prism: 'boss_prism'
    };
    if (map[kind]) unlockAchievement(map[kind]);
    if (S.score >= 10000) unlockAchievement('score_10k');
    if (S.score >= 50000) unlockAchievement('score_50k');
    if (!S.wasHit) unlockAchievement('no_hit_boss');
    if (S.boss4Done && S.elapsedSec <= 120) unlockAchievement('speedrun');
    if (S.boss4Done && Object.keys(S.skills).length <= 1) unlockAchievement('pure_bullet');
    triggerBossSkillSelect();

    stats.bossKills++;
    stats.totalScore += bonus;
    statsDirty = true;
  }

  function updateParticles(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life -= dt;
      if (q.life <= 0) { parts.splice(i, 1); continue; }
      const drag = Math.exp(-q.drag * dt);
      q.vx *= drag;
      q.vy *= drag;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }
  }

  function updateTexts(dt) {
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.life -= dt;
      t.y += t.vy * dt;
      t.vy *= Math.exp(-3 * dt);
      if (t.life <= 0) texts.splice(i, 1);
    }
  }

  // ---------------------------------------------------------------- render
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (bgCanvas) {
      ctx.drawImage(bgCanvas, 0, 0, W, H);
    } else {
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);
    }

    drawStars();

    // Boss 期间背景转红
    if (S.bossFade > 0.01) {
      const f = S.bossFade;
      const pulse = 0.5 + 0.5 * Math.sin(S.t * 2.4);
      ctx.fillStyle = 'rgba(128,6,18,' + (0.30 * f) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,44,66,' + (0.06 * f * pulse) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    const sh = S.shake;
    // 正弦偏移比每帧随机抖动更平滑，也少了两次随机数调用
    const ox = sh ? Math.sin(S.t * 23) * sh * 0.45 : 0;
    const oy = sh ? Math.cos(S.t * 19) * sh * 0.45 : 0;

    // 弹窗打开时战场整体压暗。这里只负责先画战场，压暗统一交给弹窗遮罩，
    // 不再依赖 globalAlpha —— 各绘制函数内部会把它改成 1，压暗会时有时无。
    const modalOpen = S.mode === 'skillSelect';
    ctx.save();
    ctx.translate(ox, oy);
    if (S.mode !== 'dead') drawRing();
    drawGrid();
    drawMines();
    drawPickups();
    drawEnemies();
    drawBoss();
    drawTargetMarker();
    drawBullets();
    drawEnemyBullets();
    drawBlades();
    drawSatellites();
    drawPlayer();
    drawReticle();
    drawComboTimer();
    drawParticles();
    drawTexts();
    drawRings();
    drawBolts();
    ctx.restore();
    ctx.globalAlpha = 1;

    if (S.flash > 0) {
      ctx.fillStyle = 'rgba(255,60,110,' + (S.flash * 0.2) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 濒死红色脉冲：单次 fillRect，成本极低
    if (S.mode === 'playing' && player && player.hp <= 1) {
      const pulse = 0.5 + 0.5 * Math.sin(S.t * 5.2);
      ctx.fillStyle = 'rgba(255,40,80,' + (0.05 + 0.05 * pulse) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (vigCanvas) {
      ctx.drawImage(vigCanvas, 0, 0, W, H);
    } else {
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
    }

    // 触屏控件画在暗角之上，保持清晰；弹窗期间整层让位
    if (!modalOpen) {
      drawJoystick();
      drawDashButton();
      drawSkillButton();
      drawBossSkillButton();

      if (S.mode !== 'title' && S.mode !== 'select') drawHUD();
      if (S.mode !== 'dead' && S.mode !== 'select') drawBanner();
      drawPauseButton();

      // 升级瞬间：屏幕四周蓝色内发光描边
      if (S.levelFlashT > 0) {
        const la = S.levelFlashT / 0.4;
        ctx.save();
        ctx.strokeStyle = 'rgba(120,220,255,' + (0.42 * la) + ')';
        ctx.lineWidth = 10;
        if (glowMul) { ctx.shadowColor = '#6ff6ff'; ctx.shadowBlur = glowMul ? 28 : 0; }
        ctx.strokeRect(5, 5, W - 10, H - 10);
        ctx.strokeStyle = 'rgba(200,245,255,' + (0.5 * la) + ')';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 4, W - 8, H - 8);
        ctx.restore();
      }
    }

    if (S.mode === 'title') drawTitle();
    if (S.mode === 'title' && S.achOpen) drawAchievementsPanel();
    if (S.mode === 'title' && S.helpOpen) drawHelpPanel();
    if (S.mode === 'select') drawSelect();
    if (S.mode === 'paused') drawPaused();
    if (S.mode === 'dead') drawDead();
    if (S.mode === 'title' && S.tutorialStep >= 0) drawTutorial();
    if (S.settingsOpen && (S.mode === 'paused' || S.mode === 'title')) drawSettings();
    if (S.mode === 'skillSelect') drawSkillSelect();
    // 技能弹窗期间压住右上角提示，否则会和弹窗标题叠在一起
    if (S.mode !== 'skillSelect') {
      drawAchievementPopup();
      drawToast();
    }
  }

  function drawBoss() {
    if (S.bossFade <= 0.01) return;
    // 弹幕/粒子密集时临时关闭 Boss 辉光，优先保证帧率
    const savedGlow = glowMul;
    if (glowMul && (parts.length > 240 || ebullets.length > 150)) glowMul = 0;
    if (S.bossType === 'snake') drawSnakeBoss();
    else if (S.bossType === 'twin') drawTwinBoss();
    else if (S.bossType === 'spider') drawSpiderBoss();
    else if (S.bossType === 'prism') drawPrismBoss();
    glowMul = savedGlow;
  }

  function drawSnakeBoss() {
    if (!boss) return;
    const parts = boss.parts;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // 相邻体节之间的躯干
    for (let i = 0; i < parts.length - 1; i++) {
      const a = parts[i];
      const c = parts[i + 1];
      if (a.hp <= 0 || c.hp <= 0) continue;
      ctx.strokeStyle = a.head || c.head ? 'rgba(255,120,90,0.35)' : 'rgba(255,60,80,0.30)';
      ctx.lineWidth = 26;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(c.x, c.y);
      ctx.stroke();
    }

    // 从尾到头画节点
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      const alive = p.hp > 0;
      const col = !alive ? 'rgba(110,80,90,0.55)' : p.head ? '#ff8a6a' : '#ff4d63';

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.ang);
      ctx.shadowColor = col;
      ctx.shadowBlur = alive && glowMul ? (p.head ? 28 : 14) : 0;
      ctx.strokeStyle = col;
      ctx.lineWidth = p.head ? 3 : 2;

      ctx.beginPath();
      ctx.ellipse(0, 0, p.head ? p.r * 1.2 : p.r * 1.45, p.head ? p.r * 0.95 : p.r * 0.9, 0, 0, TAU);
      ctx.fillStyle = alive
        ? (p.hitT > 0 ? 'rgba(255,255,255,0.4)' : (p.head ? 'rgba(255,120,90,0.24)' : 'rgba(255,60,80,0.18)'))
        : 'rgba(70,45,55,0.3)';
      ctx.fill();
      ctx.stroke();

      if (p.head && alive) {
        ctx.fillStyle = '#fff1e8';
        ctx.beginPath();
        ctx.arc(p.r * 0.45, -6, 3.4, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.r * 0.45, 6, 3.4, 0, TAU);
        ctx.fill();
      }

      if (alive && p.hp < p.maxHp) {
        ctx.shadowBlur = glowMul ? 0 : 0;
        ctx.strokeStyle = 'rgba(255,170,150,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, p.r + 7, -Math.PI / 2, -Math.PI / 2 + TAU * (p.hp / p.maxHp));
        ctx.stroke();
      }
      ctx.restore();
      if (p.burn && p.burn.t > 0) drawBurnMark(p.x, p.y, p.r);
    }

    ctx.restore();
  }

  function drawTwinBoss() {
    if (!twinBoss) return;
    for (let i = 0; i < twinBoss.spheres.length; i++) {
      const s = twinBoss.spheres[i];
      const alive = s.hp > 0;
      const col = !alive ? 'rgba(110,80,90,0.55)' : (s.kind === 'charger' ? '#ff6b5a' : '#ff9ad5');

      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.ang);
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = col;
      ctx.shadowBlur = alive && glowMul ? 30 : 0;
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.arc(0, 0, s.r, 0, TAU);
      ctx.fillStyle = alive
        ? (s.hitT > 0 ? 'rgba(255,255,255,0.35)' : 'rgba(255,90,70,0.18)')
        : 'rgba(70,45,55,0.3)';
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, s.r * 0.55, 0, TAU);
      ctx.strokeStyle = alive ? 'rgba(255,220,200,0.5)' : 'rgba(120,100,110,0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (alive && s.kind === 'charger') {
        if (s.state === 'wind') {
          const k = 1 - Math.max(0, s.stateT) / 0.6;
          ctx.globalAlpha = 0.5 + 0.4 * Math.sin(S.t * 30);
          ctx.strokeStyle = '#ffd9b0';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, s.r + 10 + k * 14, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        } else if (s.state === 'dash') {
          ctx.strokeStyle = 'rgba(255,220,180,0.8)';
          ctx.beginPath();
          ctx.arc(0, 0, s.r + 6, 0, TAU);
          ctx.stroke();
        }
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * TAU;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * s.r, Math.sin(a) * s.r);
          ctx.lineTo(Math.cos(a) * (s.r + 12), Math.sin(a) * (s.r + 12));
          ctx.stroke();
        }
      } else if (alive) {
        ctx.fillStyle = '#fff0f6';
        ctx.beginPath();
        ctx.arc(s.r * 0.35, 0, s.r * 0.22, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#5a1020';
        ctx.beginPath();
        ctx.arc(s.r * 0.42, 0, s.r * 0.1, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,200,230,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, s.r + 8, S.t * 2, S.t * 2 + 2.4);
        ctx.stroke();
      }

      if (alive && s.hp < s.maxHp) {
        ctx.shadowBlur = glowMul ? 0 : 0;
        ctx.strokeStyle = 'rgba(255,200,170,0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, s.r + 14, -Math.PI / 2, -Math.PI / 2 + TAU * (s.hp / s.maxHp));
        ctx.stroke();
      }
      ctx.restore();
      if (s.burn && s.burn.t > 0) drawBurnMark(s.x, s.y, s.r);
    }
  }

  function drawSpiderBoss() {
    const s = spiderBoss;
    if (!s) return;
    const alive = s.hp > 0;
    const col = alive ? '#ff9ad5' : 'rgba(110,80,90,0.55)';

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // 四条腿 + 末端
    for (let i = 0; i < s.legs.length; i++) {
      const leg = s.legs[i];
      const lcol = !alive ? 'rgba(110,80,90,0.5)'
        : leg.state === 'dash' ? '#ffd166'
          : leg.state === 'wind' ? '#fff0f6'
            : 'rgba(255,154,213,0.72)';

      ctx.strokeStyle = lcol;
      ctx.lineWidth = Math.max(6, s.r * 0.16);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(leg.x, leg.y);
      ctx.stroke();

      ctx.save();
      ctx.translate(leg.x, leg.y);
      ctx.rotate(Math.atan2(leg.y - s.y, leg.x - s.x));
      ctx.shadowColor = lcol;
      ctx.shadowBlur = glowMul ? 18 : 0;
      ctx.strokeStyle = lcol;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, leg.r, 0, TAU);
      ctx.fillStyle = 'rgba(255,120,180,0.18)';
      ctx.fill();
      ctx.stroke();

      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * leg.r, Math.sin(a) * leg.r);
        ctx.lineTo(Math.cos(a) * (leg.r + 9), Math.sin(a) * (leg.r + 9));
        ctx.stroke();
      }

      if (leg.state === 'wind') {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(S.t * 30);
        ctx.beginPath();
        ctx.arc(0, 0, leg.r + 10, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    // 头部
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.ang);
    ctx.shadowColor = col;
    ctx.shadowBlur = alive && glowMul ? 34 : 0;
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, s.r, 0, TAU);
    ctx.fillStyle = alive
      ? (s.hitT > 0 ? 'rgba(255,255,255,0.35)' : 'rgba(255,90,140,0.2)')
      : 'rgba(70,45,55,0.3)';
    ctx.fill();
    ctx.stroke();

    if (alive) {
      ctx.fillStyle = '#fff0f6';
      for (let ky = -1; ky <= 1; ky += 2) {
        for (let j = 0; j < 2; j++) {
          ctx.beginPath();
          ctx.arc(s.r * 0.35 + j * 10, ky * 12, 3.5, 0, TAU);
          ctx.fill();
        }
      }
      ctx.strokeStyle = '#ffd0e2';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(s.r * 0.7, -14);
      ctx.lineTo(s.r * 1.15, -4);
      ctx.moveTo(s.r * 0.7, 14);
      ctx.lineTo(s.r * 1.15, 4);
      ctx.stroke();
    }
    ctx.restore();
    if (alive && s.burn && s.burn.t > 0) drawBurnMark(s.x, s.y, s.r);

    if (alive) {
      ctx.strokeStyle = 'rgba(255,200,230,0.85)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + 12, -Math.PI / 2, -Math.PI / 2 + TAU * (s.hp / s.maxHp));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPrismBoss() {
    const s = prismBoss;
    if (!s) return;
    const alive = s.hp > 0;
    const col = alive ? '#8fe8ff' : 'rgba(110,80,90,0.55)';

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 双旋转激光
    if (alive && s.mode === 0) {
      for (let k = 0; k < 2; k++) {
        const a = s.beamAng + k * Math.PI;
        const x2 = s.x + Math.cos(a) * 1600;
        const y2 = s.y + Math.sin(a) * 1600;
        ctx.strokeStyle = 'rgba(140,240,255,0.28)';
        ctx.lineWidth = 18;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(235,255,255,0.95)';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }

    // 核心：星形八边形
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.spin);
    ctx.shadowColor = col;
    ctx.shadowBlur = alive && glowMul ? 30 : 0;
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.fillStyle = alive ? (s.hitT > 0 ? 'rgba(255,255,255,0.35)' : 'rgba(120,220,255,0.16)') : 'rgba(60,50,70,0.3)';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU - Math.PI / 2;
      const rr = i % 2 === 0 ? s.r : s.r * 0.72;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 内圈
    ctx.beginPath();
    ctx.arc(0, 0, s.r * 0.45, 0, TAU);
    ctx.strokeStyle = alive ? 'rgba(230,255,255,0.6)' : 'rgba(120,100,110,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    if (alive && prismBoss.burn && prismBoss.burn.t > 0) drawBurnMark(s.x, s.y, s.r);

    // 环绕的 4 片棱镜
    if (alive) {
      for (let i = 0; i < 4; i++) {
        const a = s.spin * 1.6 + i * (TAU / 4);
        const px = s.x + Math.cos(a) * (s.r + 30);
        const py = s.y + Math.sin(a) * (s.r + 30);
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a + Math.PI / 2);
        ctx.strokeStyle = 'rgba(180,140,255,0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -9);
        ctx.lineTo(6, 0);
        ctx.lineTo(0, 9);
        ctx.lineTo(-6, 0);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }

    // 护盾环
    if (alive && s.shield > 0) {
      const f = s.shield / s.maxShield;
      ctx.strokeStyle = 'rgba(140,240,255,' + (0.25 + 0.45 * f) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + 16, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(140,240,255,0.22)';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + 16, -Math.PI / 2, -Math.PI / 2 + TAU * f);
      ctx.stroke();
    }

    // 浮游炮
    for (let i = 0; i < s.orbs.length; i++) {
      const o = s.orbs[i];
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.shadowColor = COL.violet;
      ctx.shadowBlur = glowMul ? 16 : 0;
      ctx.strokeStyle = COL.violet;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, TAU);
      ctx.fillStyle = o.hitT > 0 ? 'rgba(255,255,255,0.4)' : 'rgba(199,139,255,0.22)';
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, o.r * 0.45, 0, TAU);
      ctx.fillStyle = '#f0e6ff';
      ctx.fill();
      ctx.restore();
    }

    // 血条
    if (alive) {
      ctx.strokeStyle = 'rgba(180,240,255,0.85)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + 26, -Math.PI / 2, -Math.PI / 2 + TAU * (s.hp / s.maxHp));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStars() {
    ctx.save();
    ctx.fillStyle = '#9fd8ff';
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(S.t * 1.6 * s.sp + s.ph));
      const d = s.r * 2;
      ctx.fillRect(s.x - s.r, s.y - s.r, d, d);
    }
    ctx.restore();
  }

  function drawGrid() {
    const step = 64;
    const off = (S.t * 10) % step;
    ctx.save();
    ctx.strokeStyle = 'rgba(110,160,255,0.085)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = -off; x <= W + step; x += step) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
    }
    for (let y = -off; y <= H + step; y += step) {
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawRing() {
    const R = Math.min(W, H) * 0.36;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(S.t * 0.06);
    ctx.strokeStyle = 'rgba(120,240,255,0.07)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,130,255,0.10)';
    ctx.lineWidth = 9;
    for (let i = 0; i < 6; i++) {
      const a0 = (i / 6) * TAU;
      ctx.beginPath();
      ctx.arc(0, 0, R, a0, a0 + 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer() {
    if (!player || S.mode === 'dead' || S.mode === 'title' || S.mode === 'select') return;
    const p = player;
    const blink = p.inv > 0 && Math.floor(S.t * 22) % 2 === 0;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.ang);
    ctx.scale(p.charId === 'warrior' ? 1.12 : p.charId === 'ranger' ? 0.94 : 1, p.charId === 'warrior' ? 1.12 : p.charId === 'ranger' ? 0.94 : 1);
    ctx.globalCompositeOperation = 'lighter';

    // 尾焰
    const heat = 0.6 + Math.random() * 0.4;
    ctx.globalAlpha = 0.22 * heat;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.moveTo(-10, -5);
    ctx.lineTo(-24 - 10 * heat, 0);
    ctx.lineTo(-10, 5);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.shadowColor = p.col;
    ctx.shadowBlur = glowMul ? 22 : 0;
    ctx.strokeStyle = blink ? 'rgba(255,255,255,0.35)' : p.col;
    ctx.lineWidth = 2.4;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-11, 10);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-11, -10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur = glowMul ? 12 : 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(1, 0, 3.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawMines() {
    if (!S.mines.length) return;
    for (let i = 0; i < S.mines.length; i++) {
      const m = S.mines[i];
      const pulse = 0.5 + 0.5 * Math.sin(S.t * 6 + i);
      ctx.save();
      ctx.translate(m.x, m.y);
      if (glowMul) { ctx.shadowColor = COL.orange; ctx.shadowBlur = 8 + 6 * pulse; }
      ctx.globalAlpha = m.arm > 0 ? 0.55 : 0.8;
      ctx.strokeStyle = COL.orange;
      ctx.lineWidth = 1.6;
      const rr = 6 + 2 * pulse;
      ctx.beginPath();
      ctx.moveTo(0, -rr); ctx.lineTo(rr, 0); ctx.lineTo(0, rr); ctx.lineTo(-rr, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = 0.25 + 0.2 * pulse;
      ctx.beginPath();
      ctx.arc(0, 0, 13 + 5 * pulse, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBurnMark(x, y, r) {
    const k = 0.6 + 0.4 * Math.sin(S.t * 16 + x * 0.05);
    ctx.save();
    if (glowMul) { ctx.shadowColor = COL.orange; ctx.shadowBlur = 8; }
    ctx.globalAlpha = 0.5 + 0.4 * k;
    ctx.fillStyle = COL.orange;
    ctx.beginPath();
    ctx.arc(x, y - r - 6, 2.8, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawBlades() {
    if (!S.blades.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < S.blades.length; i++) {
      const b = S.blades[i];
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.spin);
      if (glowMul) { ctx.shadowColor = COL.cyan; ctx.shadowBlur = 14; }
      ctx.strokeStyle = '#d9ffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 13, -Math.PI * 0.62, Math.PI * 0.62);
      ctx.stroke();
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, 8, Math.PI * 0.4, Math.PI * 1.6);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSatellites() {
    if (!S.satellites.length) return;
    const grav = evolved('gravity');
    for (let i = 0; i < S.satellites.length; i++) {
      const s = S.satellites[i];
      const pulse = 0.5 + 0.5 * Math.sin(S.t * 4 + i);
      ctx.save();
      ctx.translate(s.x, s.y);
      if (glowMul) { ctx.shadowColor = grav ? COL.violet : COL.cyan; ctx.shadowBlur = 12 + 6 * pulse; }
      ctx.strokeStyle = grav ? COL.violet : COL.cyan;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = grav ? COL.violet : COL.cyan;
      ctx.beginPath();
      ctx.arc(0, 0, 5.4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 2.2, 0, TAU);
      ctx.fill();
      if (grav) {
        ctx.globalAlpha = 0.18 + 0.12 * pulse;
        ctx.beginPath();
        ctx.arc(0, 0, 13 + 4 * pulse, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
  }

  function drawSkillButton() {
    if (!player || (S.mode !== 'playing' && S.mode !== 'paused')) return;
    const b = skillButtonRect();
    const c = CHARACTERS[player.charIndex];
    if (!c) return;
    const frac = player.skillMax > 0 ? clamp(player.skillCd / player.skillMax, 0, 1) : 0;
    const ready = player.skillCd <= 0;

    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = ready ? 'rgba(111,246,255,0.10)' : 'rgba(20,30,50,0.65)';
    ctx.fill();
    ctx.strokeStyle = ready ? c.color : 'rgba(140,180,230,0.35)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    if (!ready) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(17, 700);
    ctx.fillStyle = ready ? c.color : 'rgba(150,180,220,0.5)';
    ctx.fillText(c.glyph, b.x, b.y - 1);

    ctx.font = font(8, 600);
    ctx.fillStyle = 'rgba(180,210,245,0.55)';
    ctx.fillText(
      ready ? ((touchMode || coarse) ? '技能' : 'E') : Math.ceil(player.skillCd) + 's',
      b.x, b.y + b.r + 9
    );
    ctx.restore();
  }

  function drawReticle() {
    if (touchMode || coarse) return;
    if (!mouse.known || touch.on || S.mode !== 'playing') return;
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = 'rgba(160,240,255,0.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
    ctx.moveTo(6, 0); ctx.lineTo(16, 0);
    ctx.moveTo(0, -16); ctx.lineTo(0, -6);
    ctx.moveTo(0, 6); ctx.lineTo(0, 16);
    ctx.stroke();
    ctx.restore();
  }

  // 辅助模块：标记最近敌人
  function drawTargetMarker() {
    const mlv = skillLv('marker');
    if (!mlv || !player || S.mode !== 'playing') return;
    const t = nearestEnemy(false, 1e9);
    if (!t) return;
    const r = Math.max(14, t.r || 14) + 10;
    const l = 7;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,209,102,0.55)';
    ctx.lineWidth = 1.2;
    for (let sx = -1; sx <= 1; sx += 2) {
      for (let sy = -1; sy <= 1; sy += 2) {
        const cx = t.x + sx * r;
        const cy = t.y + sy * r;
        ctx.beginPath();
        ctx.moveTo(cx - sx * l, cy);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx, cy - sy * l);
        ctx.stroke();
      }
    }
    if (mlv >= 2 && t.maxHp > 0) {
      const bw = r * 1.6;
      ctx.fillStyle = 'rgba(255,80,110,0.22)';
      ctx.fillRect(t.x - bw / 2, t.y - r - 9, bw, 3);
      ctx.fillStyle = '#ff6f91';
      ctx.fillRect(t.x - bw / 2, t.y - r - 9, bw * clamp(t.hp / t.maxHp, 0, 1), 3);
    }
    ctx.restore();
  }

  // 辅助模块：连击剩余时间环
  function drawComboTimer() {
    const clv = skillLv('combo');
    if (!clv || !player || S.mode !== 'playing') return;
    if (S.combo <= 0 || S.comboT <= 0) return;
    const frac = clamp(S.comboT / 3, 0, 1);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,209,102,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 26, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
    ctx.stroke();
    if (clv >= 2) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = font(9, 600);
      ctx.fillStyle = 'rgba(255,209,102,0.72)';
      ctx.fillText(S.comboT.toFixed(1) + 's', player.x, player.y - 34);
    }
    ctx.restore();
  }

  function drawJoystick() {
    if (!touch.on) return;
    const dx = touch.x - touch.ax;
    const dy = touch.y - touch.ay;
    const d = hyp(dx, dy) || 1;
    const k = Math.min(d, 48) / d;

    ctx.save();
    ctx.fillStyle = 'rgba(111,246,255,0.05)';
    ctx.beginPath();
    ctx.arc(touch.ax, touch.ay, 48, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,255,0.16)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(touch.ax, touch.ay, 48, 0, TAU);
    ctx.stroke();

    ctx.fillStyle = 'rgba(160,240,255,0.26)';
    ctx.strokeStyle = 'rgba(200,250,255,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(touch.ax + dx * k, touch.ay + dy * k, 17, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawDashButton() {
    if (!(touchMode || coarse)) return;
    if (S.mode === 'title' || S.mode === 'dead' || S.mode === 'select') return;

    const b = getDashButton();
    const cd = 1 - clamp(player.dashCd / dashCdMax(), 0, 1);
    const ready = cd >= 1;

    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = ready ? 'rgba(111,246,255,0.10)' : 'rgba(111,246,255,0.04)';
    ctx.fill();

    ctx.strokeStyle = ready ? 'rgba(111,246,255,0.7)' : 'rgba(111,246,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r - 0.5, 0, TAU);
    ctx.stroke();

    if (cd < 1) {
      ctx.strokeStyle = 'rgba(238,247,255,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 0.5, -Math.PI / 2, -Math.PI / 2 + TAU * cd);
      ctx.stroke();
    }

    const s = b.r / 30;
    ctx.beginPath();
    ctx.moveTo(b.x + 2 * s, b.y - 12 * s);
    ctx.lineTo(b.x - 7 * s, b.y + 2 * s);
    ctx.lineTo(b.x - 1 * s, b.y + 2 * s);
    ctx.lineTo(b.x - 2 * s, b.y + 12 * s);
    ctx.lineTo(b.x + 7 * s, b.y - 2 * s);
    ctx.lineTo(b.x + 1 * s, b.y - 2 * s);
    ctx.closePath();
    ctx.fillStyle = ready ? 'rgba(230,253,255,0.9)' : 'rgba(230,253,255,0.3)';
    ctx.fill();

    ctx.font = font(9, 600);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(160,200,255,0.45)';
    ctx.fillText('冲刺', b.x, b.y + b.r + 9);
    ctx.restore();
  }

  function drawPauseButton() {
    if (!(touchMode || coarse)) return;
    if (S.mode !== 'playing') return;
    const b = pauseButtonRect();

    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = 'rgba(10,18,36,0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,200,255,0.38)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    ctx.fillStyle = 'rgba(214,236,255,0.8)';
    roundRect(ctx, b.x - 5, b.y - 6, 3.6, 12, 1.4);
    ctx.fill();
    roundRect(ctx, b.x + 1.4, b.y - 6, 3.6, 12, 1.4);
    ctx.fill();
    ctx.restore();
  }

  function drawSnake(e) {
    const col = e.hitT > 0 ? '#ffffff' : e.color;
    const segs = e.segs || [];

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = col;
    ctx.shadowBlur = glowMul ? 13 : 0;

    // 身体连线
    if (segs.length) {
      ctx.strokeStyle = 'rgba(125,255,179,0.26)';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      for (let i = 0; i < segs.length; i++) ctx.lineTo(segs[i].x, segs[i].y);
      ctx.stroke();
    }

    // 体节，从尾到头
    for (let i = segs.length - 1; i >= 0; i--) {
      const s = segs[i];
      ctx.globalAlpha = 0.35 + 0.55 * (1 - i / Math.max(1, segs.length));
      ctx.fillStyle = 'rgba(125,255,179,0.16)';
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 头
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.ang);
    ctx.shadowBlur = glowMul ? 18 : 0;
    ctx.fillStyle = 'rgba(125,255,179,0.3)';
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, e.r * 1.2, e.r * 0.82, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ecfff4';
    ctx.beginPath();
    ctx.arc(4, -4.5, 2.1, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(4, 4.5, 2.1, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-e.r * 0.4, 0);
    ctx.lineTo(-e.r * 1.5, 0);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(125,255,179,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * (e.hp / e.maxHp));
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawEnemies() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const heavy = enemies.length > 45;

    // 传送落点预警（只对正在传送的少数敌人绘制）
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.type === 'teleporter' && e.state === 'blink') {
        ctx.globalAlpha = 0.45 + 0.3 * Math.sin(S.t * 18);
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(e.bx, e.by, 24, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.x < -70 || e.x > W + 70 || e.y < -70 || e.y > H + 70) continue;
      if (e.debuffs && e.debuffs.burn.t > 0) drawBurnMark(e.x, e.y, e.r);
      if (e.type === 'snake') {
        drawSnake(e);
        continue;
      }
      const col = e.hitT > 0 ? '#ffffff' : e.color;

      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.ang);
      ctx.shadowColor = col;
      ctx.shadowBlur = (glowMul && !heavy) ? 15 : 0;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      ctx.fillStyle = 'rgba(255,255,255,0.07)';

      if (e.type === 'chaser') {
        ctx.beginPath();
        ctx.moveTo(e.r, 0);
        ctx.lineTo(-e.r * 0.8, e.r * 0.78);
        ctx.lineTo(-e.r * 0.8, -e.r * 0.78);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (e.type === 'dasher') {
        ctx.beginPath();
        ctx.moveTo(e.r * 1.35, 0);
        ctx.lineTo(0, e.r);
        ctx.lineTo(-e.r * 1.35, 0);
        ctx.lineTo(0, -e.r);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        if (e.state === 'wind') {
          ctx.globalAlpha = 0.45 + 0.45 * Math.sin(S.t * 28);
          ctx.beginPath();
          ctx.arc(0, 0, e.r * 2, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else if (e.type === 'tank') {
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * TAU;
          const px = Math.cos(a) * e.r;
          const py = Math.sin(a) * e.r;
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,95,143,0.8)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, e.r + 7, -Math.PI / 2, -Math.PI / 2 + TAU * (e.hp / e.maxHp));
        ctx.stroke();
      } else if (e.type === 'gunner') {
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.r + 3, 0);
        ctx.lineTo(e.r + 11, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, TAU);
        ctx.fillStyle = col;
        ctx.fill();
      } else if (e.type === 'spider') {
        // 8 条摆动的腿
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.8;
        for (let k = 0; k < 8; k++) {
          const base = (k / 8) * TAU;
          const a = base + Math.sin(e.t * 9 + k * 1.3) * 0.22;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * e.r * 0.7, Math.sin(a) * e.r * 0.7);
          ctx.lineTo(Math.cos(a) * e.r * 1.75, Math.sin(a) * e.r * 1.75);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, TAU);
        ctx.fillStyle = 'rgba(255,154,213,0.16)';
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffe6f6';
        ctx.beginPath();
        ctx.arc(e.r * 0.42, -5, 2.4, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(e.r * 0.42, 5, 2.4, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,154,213,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, e.r + 7, -Math.PI / 2, -Math.PI / 2 + TAU * (e.hp / e.maxHp));
        ctx.stroke();
      } else if (e.type === 'bomber') {
        const fuse = e.state === 'fuse';
